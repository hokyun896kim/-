# Streamlit 테마 — 다크 트레이딩 터미널
[theme]
base = "dark"
primaryColor = "#2dd4bf"             # 시안 (포인트)
backgroundColor = "#0a0e17"          # 딥 네이비 블랙
secondaryBackgroundColor = "#131722" # 패널 (TradingView 톤)
textColor = "#d1d4dc"                # 밝은 회색 텍스트
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
