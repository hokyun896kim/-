# ============================================================
# 미국주식 분석/매매 시스템 설정
# ============================================================

# 관심종목 (대시보드 기본 목록)
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - AMZN
  - META
  - TSLA
  - JPM
  - V
  - JNJ

# 데이터 공급자: "yahoo" (실시간, 로컬 권장) 또는 "sample" (오프라인 데모)
data_provider: yahoo

# 기술적 분석 지표 파라미터
technical:
  sma_short: 20        # 단기 이동평균
  sma_long: 50         # 장기 이동평균
  ema_period: 20
  rsi_period: 14
  rsi_overbought: 70   # 과매수 기준
  rsi_oversold: 30     # 과매도 기준
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20        # 볼린저밴드 기간
  bb_std: 2.0          # 표준편차 배수
  # 추세추종 성분(SMA교차·가격위치·MACD)의 가중치.
  # 0.0 = 제외(기본). 검증 결과 이 성분은 예측 방향이 반대였다 —
  #       단조성 -1.00, IC t=-3.04(보정 통과), 편향제거 후 연 -6.89%.
  # 0.5 = 다섯 신호 균등평균(옛 기본값)  ·  1.0 = 순수 추세추종
  # 근거: data/validation.json, 대시보드 🔬 검증 화면
  trend_weight: 0.0

# 펀더멘털 채점 방식
fundamental:
  # false = PER/PBR/부채비율을 절대 구간으로 채점 (기존 동작)
  #         섹터 무관 고정 기준이라 은행·통신이 구조적으로 고득점하고
  #         고성장 기술주가 감점된다 — 의도치 않은 밸류 팩터 베팅.
  # true  = 같은 섹터 안에서의 백분위로 채점해 그 편향을 제거.
  # 어느 쪽이 나은지는 아직 검증 전이라 기본값은 기존 동작으로 둔다.
  sector_neutral: false
  min_peers: 4         # 섹터당 최소 표본. 미만이면 절대 구간으로 폴백.

# 종합 점수 가중치 (기술적 vs 기본적). 합이 1.0
weights:
  technical: 0.5
  fundamental: 0.5

# 점수 구간 라벨 경계 (0~100 종합점수 기준).
# ※ 매매 추천이 아니라 '점수 구간에서의 위치' 다 — 상위/중상/중립/중하/하위.
#   검증에서 이 점수는 미래 수익률을 예측하지 못했다 (IC -0.016).
recommendation:
  strong_buy: 75
  buy: 60
  hold: 40
  sell: 25
  # 그 미만은 strong_sell

# 모의매매 계좌
paper_trading:
  initial_cash: 100000   # 초기 자본 (USD)
  commission: 0.0        # 거래 수수료 (비율, 예: 0.001 = 0.1%)

# AI 비서
#
# engine=auto 면 자격증명(ANTHROPIC_API_KEY 또는 `ant auth login` 프로필)이
# 있을 때만 Claude 를 쓰고, 없으면 키워드 기반 규칙 엔진으로 내려간다.
# 어느 쪽이든 숫자는 이 시스템의 분석 모듈이 만든다 — 비서가 지어내지 않는다.
assistant:
  engine: auto           # auto | claude | rules
  model: claude-opus-5
  max_tokens: 16000
  max_turns: 6           # 한 질문에 허용할 도구 호출 라운드 수
  # 무거운 계산은 파이썬 도구가 하고 모델은 결과를 설명만 하므로 medium.
  # 더 촘촘한 추론이 필요하면 high 나 xhigh 로 올린다.
  effort: medium         # low | medium | high | xhigh | max
  thinking: adaptive     # adaptive | off  (구형 모델을 쓸 때만 off)
