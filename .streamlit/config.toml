# Streamlit 테마 — 밝고 시인성 높은 디자인
[theme]
base = "light"
primaryColor = "#2563eb"            # 또렷한 파랑 (포인트)
backgroundColor = "#ffffff"         # 흰 배경
secondaryBackgroundColor = "#eef2f8" # 사이드바/카드 연한 회청색
textColor = "#101828"               # 높은 대비의 짙은 잉크색
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
