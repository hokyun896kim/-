name: Morning Brief

# 모닝브리핑 에이전트 클라우드 실행 — 매일 아침 8시(KST) 관심종목+시장 브리핑을
# 생성해 reports/ 에 커밋한다. 폰에서는 GitHub 앱으로 열람. 수동 실행도 가능.
#
# 사전 준비(선택 — LLM 종합 해설용, 없으면 모듈 해설로 동작):
#   GitHub 레포 → Settings → Secrets and variables → Actions → New repository secret
#   Name: ANTHROPIC_API_KEY (또는 GEMINI_API_KEY / OPENAI_API_KEY / XAI_API_KEY)
#
# 관심종목 변경: agents/morning-brief/watchlist.txt 수정 (폰 GitHub 앱에서도 편집 가능)

on:
  schedule:
    - cron: '0 23 * * *'      # 23:00 UTC = 다음날 08:00 KST
  workflow_dispatch: {}        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt anthropic

      # history.json(월 비용 가드 누적 메모리)을 실행 간 유지
      - name: Restore agent memory
        uses: actions/cache@v4
        with:
          path: agents/morning-brief/history.json
          key: morning-brief-history-${{ github.run_id }}
          restore-keys: morning-brief-history-

      - name: Run morning-brief agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python agents/morning-brief/brief.py

      - name: Show error log on failure
        if: failure()
        run: cat agents/morning-brief/error.log 2>/dev/null || true

      - name: Commit briefing
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@github.com"
          git add -f reports/모닝브리핑_*.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "🌅 모닝브리핑 $(date -u -d '+9 hours' +%F)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
