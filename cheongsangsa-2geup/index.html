<script>
/* 청소년상담사 2급 문제은행 — vanilla JS, 빌드 없음 */
(function () {
  'use strict';

  var KEY = 'ycb-v1';
  var app = document.getElementById('app');
  var META = null;              // data/index.json
  var CACHE = {};               // subjectId -> subject data
  var view = { name: 'home', params: {} };

  /* ---------------- 저장소 ---------------- */

  var DEFAULTS = {
    picks: [],                  // 선택과목 2개
    picksInit: false,           // index.json 의 기본 선택과목을 한 번 적용했는지
    examDate: '',               // 비면 index.json 값 사용
    theme: '',                  // '' | 'light' | 'dark'
    stats: {},                  // qid -> {ok, wrong, last}
    wrong: {},                  // qid -> subjectId
    history: []                 // 실전 응시 기록
  };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return Object.assign({}, DEFAULTS);
      var o = JSON.parse(raw);
      return Object.assign({}, DEFAULTS, o);
    } catch (e) {
      return Object.assign({}, DEFAULTS);
    }
  }

  var store = load();

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* 용량 초과 등은 무시 */ }
  }

  /* ---------------- 유틸 ---------------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function examDate() {
    return store.examDate || (META && META.exam && META.exam.date) || '';
  }

  function daysLeft() {
    var d = examDate();
    if (!d) return null;
    var target = new Date(d + 'T00:00:00');
    if (isNaN(target.getTime())) return null;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((target - today) / 86400000);
  }

  // 응시 과목 = 필수 4 + 선택 2
  function activeSubjects() {
    if (!META) return [];
    return META.subjects.filter(function (s) {
      return s.type === 'required' || store.picks.indexOf(s.id) >= 0;
    });
  }

  function subjectMeta(id) {
    if (!META) return null;
    for (var i = 0; i < META.subjects.length; i++) {
      if (META.subjects[i].id === id) return META.subjects[i];
    }
    return null;
  }

  function getSubject(id) {
    if (CACHE[id]) return Promise.resolve(CACHE[id]);
    return fetch('data/' + id + '.json')
      .then(function (r) {
        if (!r.ok) throw new Error('데이터를 불러오지 못했습니다 (' + r.status + ')');
        return r.json();
      })
      .then(function (d) { CACHE[id] = d; return d; });
  }

  // 과목 정답률(%) — 시도한 문항 기준. 시도가 없으면 null
  function accuracy(id) {
    var s = CACHE[id];
    if (!s) return null;
    var ok = 0, tried = 0;
    s.questions.forEach(function (q) {
      var st = store.stats[q.id];
      if (st && (st.ok || st.wrong)) { tried++; if (st.last === 1) ok++; }
    });
    if (!tried) return null;
    return { pct: Math.round((ok / tried) * 100), tried: tried, total: s.questions.length };
  }

  function record(qid, subjectId, correct) {
    var st = store.stats[qid] || { ok: 0, wrong: 0, last: 0 };
    if (correct) { st.ok++; st.last = 1; delete store.wrong[qid]; }
    else { st.wrong++; st.last = 0; store.wrong[qid] = subjectId; }
    store.stats[qid] = st;
    save();
  }

  /* ---------------- 테마 ---------------- */

  function applyTheme() {
    var root = document.documentElement;
    if (store.theme) root.setAttribute('data-theme', store.theme);
    else root.removeAttribute('data-theme');
  }

  document.getElementById('themeBtn').addEventListener('click', function () {
    var order = ['', 'light', 'dark'];
    store.theme = order[(order.indexOf(store.theme) + 1) % order.length];
    save();
    applyTheme();
  });

  /* ---------------- 라우팅 ---------------- */

  function go(name, params) {
    view = { name: name, params: params || {} };
    window.scrollTo(0, 0);
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.nav === name);
    });
    render();
  }

  document.addEventListener('click', function (e) {
    var nav = e.target.closest('[data-nav]');
    if (nav) { go(nav.dataset.nav); return; }
  });

  /* ---------------- 렌더 ---------------- */

  function renderDday() {
    var el = document.getElementById('dday');
    var n = daysLeft();
    if (n === null) { el.textContent = ''; return; }
    el.textContent = n > 0 ? 'D-' + n : (n === 0 ? 'D-DAY' : 'D+' + Math.abs(n));
  }

  function render() {
    renderDday();
    var fn = ({
      home: viewHome, study: viewStudy, exam: viewExam, wrong: viewWrong,
      concept: viewConcept, settings: viewSettings,
      quiz: viewQuiz, examRun: viewExamRun, examResult: viewExamResult,
      conceptOne: viewConceptOne
    })[view.name] || viewHome;
    fn();
  }

  /* ---------------- 홈 ---------------- */

  function viewHome() {
    var subs = activeSubjects();
    var needPick = store.picks.length < 2;
    var n = daysLeft();

    var totalQ = 0, totalTried = 0, totalOk = 0;
    subs.forEach(function (s) {
      var d = CACHE[s.id];
      if (!d) return;
      totalQ += d.questions.length;
      d.questions.forEach(function (q) {
        var st = store.stats[q.id];
        if (st && (st.ok || st.wrong)) { totalTried++; if (st.last === 1) totalOk++; }
      });
    });
    var overall = totalTried ? Math.round((totalOk / totalTried) * 100) : null;
    var wrongCount = Object.keys(store.wrong).length;

    var h = '';

    h += '<div class="card">';
    h += '<div class="hero"><span class="big">' +
         (n === null ? '—' : (n > 0 ? 'D-' + n : (n === 0 ? 'D-DAY' : 'D+' + Math.abs(n)))) +
         '</span><span class="muted">' + esc(examDate() || '시험일 미설정') + '</span></div>';
    h += '<p class="sub">청소년상담사 2급 필기 · 6과목 응시 (필수 4 + 선택 2)</p>';
    h += '<div class="statgrid">' +
         '<div class="stat"><div class="k">전체 정답률</div><div class="v">' + (overall === null ? '—' : overall + '%') + '</div></div>' +
         '<div class="stat"><div class="k">푼 문항</div><div class="v">' + totalTried + '<span class="muted" style="font-size:.7em">/' + totalQ + '</span></div></div>' +
         '<div class="stat"><div class="k">오답노트</div><div class="v">' + wrongCount + '</div></div>' +
         '</div>';
    h += '</div>';

    if (needPick) {
      h += '<div class="card">';
      h += '<h2>선택과목을 먼저 고르세요</h2>';
      h += '<p class="sub">진로·집단·가족·학업 중 <b>2과목</b>을 선택해 응시합니다. 나중에 바꿀 수 있고, 고르지 않은 과목도 학습·개념 메뉴에서 볼 수 있습니다.</p>';
      h += electivePicker();
      h += '</div>';
    }

    // 과목별 정답률 — 40% 과락선 / 60% 평균선
    h += '<div class="card">';
    h += '<h2>과목별 정답률</h2>';
    h += '<p class="sub">이 시험은 <b>한 과목이라도 40점 미만이면 탈락</b>합니다. 평균보다 최저 과목을 먼저 보세요.</p>';

    var risky = [], untouched = [];
    subs.forEach(function (s) {
      var a = accuracy(s.id);
      var pct = a ? a.pct : 0;
      var cls = !a ? 'warn' : (pct < 40 ? 'danger' : (pct < 60 ? 'warn' : 'good'));
      if (a && pct < 40) risky.push(s.short);
      if (!a) untouched.push(s.short);
      h += '<div class="subjrow">';
      h += '<div class="subjrow-head"><span class="subjrow-name">' + esc(s.name) + '</span>' +
           '<span class="subjrow-meta">' + (a ? a.pct + '% · ' + a.tried + '/' + a.total + '문항' : '미응시') + '</span></div>';
      h += '<div class="bar">' +
           '<div class="bar-fill ' + cls + '" style="width:' + (a ? pct : 0) + '%"></div>' +
           '<span class="bar-mark m40" style="left:40%"></span>' +
           '<span class="bar-mark m60" style="left:60%"></span>' +
           '</div>';
      h += '</div>';
    });
    h += '<div class="barlegend"><i><span class="sw m40"></span>40% 과락선</i><i><span class="sw m60"></span>60% 평균선</i></div>';

    if (risky.length) {
      h += '<div class="risk"><b>과락 위험: ' + esc(risky.join(', ')) + '</b><br>정답률이 40% 아래입니다. 이 과목부터 올리는 것이 평균을 올리는 것보다 우선입니다.</div>';
    } else if (untouched.length) {
      h += '<div class="risk"><b>아직 안 푼 과목: ' + esc(untouched.join(', ')) + '</b><br>과락 여부는 풀어 봐야 압니다. 과목당 한 세트씩 먼저 돌려 보세요.</div>';
    } else if (overall !== null && overall >= 60) {
      h += '<div class="risk ok"><b>현재 전 과목 40% 이상, 평균 ' + overall + '%</b><br>기준선 위입니다. 오답노트를 반복하며 유지하세요.</div>';
    }
    h += '</div>';

    h += '<div class="card">';
    h += '<h2>바로 시작</h2>';
    h += '<div class="btn-row" style="margin-top:8px">' +
         '<button class="btn" data-nav="study" type="button">학습하기</button>' +
         '<button class="btn ghost" data-nav="exam" type="button">실전 25문항</button>' +
         (wrongCount ? '<button class="btn ghost" data-nav="wrong" type="button">오답 ' + wrongCount + '개</button>' : '') +
         '<button class="btn ghost" data-nav="settings" type="button">설정</button>' +
         '</div>';
    h += '</div>';

    app.innerHTML = h;
    bindElectivePicker();
  }

  function electivePicker() {
    var el = META.subjects.filter(function (s) { return s.type === 'elective'; });
    var h = '<div class="chips" id="electiveChips">';
    el.forEach(function (s) {
      var on = store.picks.indexOf(s.id) >= 0;
      var locked = !on && store.picks.length >= 2;
      h += '<button type="button" class="chip' + (on ? ' on' : '') + (locked ? ' locked' : '') +
           '" data-pick="' + s.id + '">' + esc(s.name) + '</button>';
    });
    h += '</div>';
    return h;
  }

  function bindElectivePicker() {
    var wrap = document.getElementById('electiveChips');
    if (!wrap) return;
    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('[data-pick]');
      if (!b) return;
      var id = b.dataset.pick;
      var i = store.picks.indexOf(id);
      if (i >= 0) store.picks.splice(i, 1);
      else if (store.picks.length < 2) store.picks.push(id);
      else return;                       // 이미 2개면 무시
      save();
      render();
    });
  }

  /* ---------------- 학습 모드: 과목 선택 ---------------- */

  function subjectList(onPickName, note) {
    var h = '<div class="picklist">';
    META.subjects.forEach(function (s) {
      var active = s.type === 'required' || store.picks.indexOf(s.id) >= 0;
      var a = accuracy(s.id);
      h += '<button type="button" class="pickitem" data-go="' + onPickName + '" data-sub="' + s.id + '">' +
           '<span><span class="nm">' + esc(s.name) + '</span>' +
           '<span class="dt">' + (a ? '정답률 ' + a.pct + '% · ' + a.tried + '/' + a.total
             : (CACHE[s.id] ? CACHE[s.id].questions.length + '문항' : '')) +
           (active ? '' : ' · 미선택 과목') + '</span></span>' +
           '<span class="badge' + (s.type === 'required' ? ' req' : '') + '">' +
           (s.type === 'required' ? '필수' : '선택') + '</span>' +
           '</button>';
    });
    h += '</div>';
    if (note) h += '<p class="sub muted" style="margin:12px 0 0">' + note + '</p>';
    return h;
  }

  function bindSubjectList() {
    app.querySelectorAll('[data-go][data-sub]').forEach(function (b) {
      b.addEventListener('click', function () {
        var target = b.dataset.go;
        if (target === 'quiz') quiz = null;      // 과목이 바뀌면 진행 상태를 새로 시작
        if (target === 'examRun') exam = null;
        go(target, { sub: b.dataset.sub });
      });
    });
  }

  function viewStudy() {
    app.innerHTML = '<div class="card"><h2>학습 모드</h2>' +
      '<p class="sub">한 문항씩 풀고 <b>바로 정답과 해설</b>을 봅니다. 틀린 문항은 오답노트에 자동으로 쌓입니다.</p>' +
      subjectList('quiz', '필수 4과목은 모두 응시합니다. 선택과목은 홈에서 2개를 고르세요.') +
      '</div>';
    bindSubjectList();
  }

  /* ---------------- 학습 모드: 풀이 ---------------- */

  var quiz = null;   // {sub, list, i, picked, revealed}

  function viewQuiz() {
    var subId = view.params.sub;
    app.innerHTML = '<div class="loading">불러오는 중…</div>';
    getSubject(subId).then(function (data) {
      if (!quiz || quiz.subId !== subId) {
        quiz = { subId: subId, data: data, list: data.questions.slice(), i: 0, picked: -1, revealed: false, mode: 'all' };
      }
      drawQuiz();
    }).catch(function (err) {
      app.innerHTML = '<div class="card"><h2>불러오기 실패</h2><p class="sub">' + esc(err.message) + '</p>' +
        '<button class="btn ghost" data-nav="study" type="button">돌아가기</button></div>';
    });
  }

  function quizFilter(mode) {
    var all = quiz.data.questions;
    if (mode === 'unseen') {
      return all.filter(function (q) { var s = store.stats[q.id]; return !s || (!s.ok && !s.wrong); });
    }
    if (mode === 'wrong') {
      return all.filter(function (q) { return store.wrong[q.id]; });
    }
    return all.slice();
  }

  function drawQuiz() {
    var q = quiz.list[quiz.i];
    var h = '';

    h += '<div class="card">';
    h += '<div class="qmeta"><span>' + esc(quiz.data.name) + '</span>' +
         '<span>' + (quiz.i + 1) + ' / ' + quiz.list.length + '</span></div>';
    h += '<div class="progressline"><i style="width:' + ((quiz.i) / quiz.list.length * 100) + '%"></i></div>';

    if (!q) {
      h += '<div class="empty"><div class="big">🎉</div><p>이 범위의 문항을 모두 풀었습니다.</p>' +
           '<div class="btn-row" style="justify-content:center">' +
           '<button class="btn ghost" data-qmode="all" type="button">전체 다시 풀기</button>' +
           '<button class="btn ghost" data-nav="study" type="button">과목 바꾸기</button></div></div>';
      h += '</div>';
      app.innerHTML = h;
      bindQuiz();
      return;
    }

    h += '<div class="qmeta"><span class="qtopic">' + esc(q.topic || '') + '</span>' +
         '<span>' + modeLabel() + '</span></div>';
    h += '<div class="qtext">' + esc(q.q) + '</div>';

    h += '<div class="choices">';
    q.choices.forEach(function (c, idx) {
      var cls = 'choice';
      if (quiz.revealed) {
        if (idx === q.answer) cls += ' correct';
        else if (idx === quiz.picked) cls += ' wrong';
      } else if (idx === quiz.picked) cls += ' picked';
      h += '<button type="button" class="' + cls + '" data-choice="' + idx + '"' +
           (quiz.revealed ? ' disabled' : '') + '>' +
           '<span class="num">' + (idx + 1) + '</span><span>' + esc(c) + '</span></button>';
    });
    h += '</div>';

    if (quiz.revealed) {
      var ok = quiz.picked === q.answer;
      h += '<div class="explain">' +
           '<span class="verdict ' + (ok ? 'o' : 'x') + '">' + (ok ? '정답입니다' : '오답 — 정답은 ' + (q.answer + 1) + '번') + '</span>' +
           '<span class="lab">해설</span>' + esc(q.explain) + '</div>';
    }

    h += '<div class="qnav">';
    if (!quiz.revealed) {
      h += '<button class="btn wide" id="checkBtn" type="button"' + (quiz.picked < 0 ? ' disabled' : '') + '>정답 확인</button>';
    } else {
      h += '<button class="btn ghost sm" data-step="-1" type="button">이전</button>' +
           '<button class="btn" data-step="1" type="button">' + (quiz.i + 1 >= quiz.list.length ? '마치기' : '다음 문항') + '</button>';
    }
    h += '</div>';
    h += '</div>';

    // 범위 전환
    h += '<div class="card"><h3>범위</h3><div class="chips">' +
         '<button type="button" class="chip' + (quiz.mode === 'all' ? ' on' : '') + '" data-qmode="all">전체 30</button>' +
         '<button type="button" class="chip' + (quiz.mode === 'unseen' ? ' on' : '') + '" data-qmode="unseen">안 푼 문항 ' + quizFilter('unseen').length + '</button>' +
         '<button type="button" class="chip' + (quiz.mode === 'wrong' ? ' on' : '') + '" data-qmode="wrong">틀린 문항 ' + quizFilter('wrong').length + '</button>' +
         '</div>' +
         '<div class="btn-row" style="margin-top:12px"><button class="btn ghost sm" data-nav="study" type="button">과목 바꾸기</button></div>' +
         '</div>';

    app.innerHTML = h;
    bindQuiz();
  }

  function modeLabel() {
    return quiz.mode === 'unseen' ? '안 푼 문항' : (quiz.mode === 'wrong' ? '틀린 문항' : '전체');
  }

  function bindQuiz() {
    app.querySelectorAll('[data-choice]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (quiz.revealed) return;
        quiz.picked = parseInt(b.dataset.choice, 10);
        drawQuiz();
      });
    });
    var chk = document.getElementById('checkBtn');
    if (chk) chk.addEventListener('click', function () {
      var q = quiz.list[quiz.i];
      quiz.revealed = true;
      record(q.id, quiz.subId, quiz.picked === q.answer);
      drawQuiz();
    });
    app.querySelectorAll('[data-step]').forEach(function (b) {
      b.addEventListener('click', function () {
        var step = parseInt(b.dataset.step, 10);
        var next = quiz.i + step;
        if (next < 0) return;
        quiz.i = next; quiz.picked = -1; quiz.revealed = false;
        drawQuiz();
      });
    });
    app.querySelectorAll('[data-qmode]').forEach(function (b) {
      b.addEventListener('click', function () {
        quiz.mode = b.dataset.qmode;
        quiz.list = quizFilter(quiz.mode);
        quiz.i = 0; quiz.picked = -1; quiz.revealed = false;
        drawQuiz();
      });
    });
  }

  /* ---------------- 실전 모드 ---------------- */

  var exam = null;   // {subId, data, list, answers, i, startedAt, timer, limitMs}

  function viewExam() {
    var per = (META.exam && META.exam.perSubject) || 25;
    var h = '<div class="card"><h2>실전 모드</h2>' +
      '<p class="sub">실제 시험과 같이 <b>과목당 ' + per + '문항 / ' + per + '분</b>으로 풉니다. 해설은 제출 후에 한꺼번에 봅니다.</p>' +
      subjectList('examRun', '') + '</div>';

    if (store.history.length) {
      h += '<div class="card"><h3>최근 응시</h3>';
      store.history.slice(-8).reverse().forEach(function (r) {
        var pass = r.pct >= 40;
        h += '<div class="field"><label>' + esc(r.name) + ' <span class="muted" style="font-weight:400">' + esc(r.at) + '</span></label>' +
             '<span class="badge" style="color:' + (pass ? 'var(--ok)' : 'var(--bad)') + '">' + r.score + '/' + r.total + ' · ' + r.pct + '%</span></div>';
      });
      h += '</div>';
    }
    app.innerHTML = h;
    bindSubjectList();
  }

  function viewExamRun() {
    var subId = view.params.sub;
    app.innerHTML = '<div class="loading">불러오는 중…</div>';
    getSubject(subId).then(function (data) {
      var per = (META.exam && META.exam.perSubject) || 25;
      if (!exam || exam.subId !== subId) {
        var picked = shuffle(data.questions).slice(0, Math.min(per, data.questions.length));
        exam = {
          subId: subId, data: data, list: picked,
          answers: new Array(picked.length).fill(-1),
          i: 0, endsAt: Date.now() + per * 60 * 1000, timer: null
        };
      }
      drawExam();
    }).catch(function (err) {
      app.innerHTML = '<div class="card"><h2>불러오기 실패</h2><p class="sub">' + esc(err.message) + '</p>' +
        '<button class="btn ghost" data-nav="exam" type="button">돌아가기</button></div>';
    });
  }

  function fmtLeft(ms) {
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function drawExam() {
    var q = exam.list[exam.i];
    var h = '';

    h += '<div class="card">';
    h += '<div class="qmeta"><span>' + esc(exam.data.name) + ' · 실전</span>' +
         '<span class="timer" id="timer">' + fmtLeft(exam.endsAt - Date.now()) + '</span></div>';
    h += '<div class="progressline"><i style="width:' + (exam.i / exam.list.length * 100) + '%"></i></div>';
    h += '<div class="qmeta"><span class="qtopic">' + (exam.i + 1) + '번</span>' +
         '<span>' + exam.answers.filter(function (a) { return a >= 0; }).length + ' / ' + exam.list.length + ' 응답</span></div>';
    h += '<div class="qtext">' + esc(q.q) + '</div>';

    h += '<div class="choices">';
    q.choices.forEach(function (c, idx) {
      h += '<button type="button" class="choice' + (exam.answers[exam.i] === idx ? ' picked' : '') +
           '" data-echoice="' + idx + '"><span class="num">' + (idx + 1) + '</span><span>' + esc(c) + '</span></button>';
    });
    h += '</div>';

    h += '<div class="qnav">' +
         '<button class="btn ghost sm" data-estep="-1" type="button"' + (exam.i === 0 ? ' disabled' : '') + '>이전</button>' +
         '<button class="btn" data-estep="1" type="button"' + (exam.i + 1 >= exam.list.length ? ' disabled' : '') + '>다음</button>' +
         '</div>';
    h += '</div>';

    h += '<div class="card"><h3>답안지</h3><div class="omr">';
    exam.list.forEach(function (_, idx) {
      var cls = (exam.answers[idx] >= 0 ? 'done ' : '') + (idx === exam.i ? 'cur' : '');
      h += '<button type="button" class="' + cls + '" data-ejump="' + idx + '">' + (idx + 1) + '</button>';
    });
    h += '</div>';
    h += '<div class="btn-row" style="margin-top:14px">' +
         '<button class="btn wide" id="submitExam" type="button">제출하고 채점</button></div>';
    h += '<p class="sub muted" style="margin:10px 0 0">시간이 끝나면 자동으로 제출됩니다.</p>';
    h += '</div>';

    app.innerHTML = h;
    bindExam();
    startTimer();
  }

  function startTimer() {
    if (exam.timer) clearInterval(exam.timer);
    exam.timer = setInterval(function () {
      var el = document.getElementById('timer');
      var left = exam.endsAt - Date.now();
      if (!el) { clearInterval(exam.timer); exam.timer = null; return; }
      el.textContent = fmtLeft(left);
      el.classList.toggle('urgent', left < 5 * 60 * 1000);
      if (left <= 0) { clearInterval(exam.timer); exam.timer = null; submitExam(); }
    }, 500);
  }

  function bindExam() {
    app.querySelectorAll('[data-echoice]').forEach(function (b) {
      b.addEventListener('click', function () {
        exam.answers[exam.i] = parseInt(b.dataset.echoice, 10);
        if (exam.i + 1 < exam.list.length) exam.i++;   // 고르면 자동으로 다음 문항
        drawExam();
      });
    });
    app.querySelectorAll('[data-estep]').forEach(function (b) {
      b.addEventListener('click', function () {
        var n = exam.i + parseInt(b.dataset.estep, 10);
        if (n < 0 || n >= exam.list.length) return;
        exam.i = n; drawExam();
      });
    });
    app.querySelectorAll('[data-ejump]').forEach(function (b) {
      b.addEventListener('click', function () { exam.i = parseInt(b.dataset.ejump, 10); drawExam(); });
    });
    var sb = document.getElementById('submitExam');
    if (sb) sb.addEventListener('click', function () {
      var unanswered = exam.answers.filter(function (a) { return a < 0; }).length;
      if (unanswered && !confirm(unanswered + '문항이 비어 있습니다. 그대로 제출할까요?')) return;
      submitExam();
    });
  }

  function submitExam() {
    if (exam.timer) { clearInterval(exam.timer); exam.timer = null; }
    var score = 0;
    exam.list.forEach(function (q, idx) {
      var ok = exam.answers[idx] === q.answer;
      if (ok) score++;
      record(q.id, exam.subId, ok);
    });
    var pct = Math.round((score / exam.list.length) * 100);
    var d = new Date();
    store.history.push({
      sub: exam.subId, name: exam.data.name, score: score, total: exam.list.length, pct: pct,
      at: (d.getMonth() + 1) + '/' + d.getDate()
    });
    if (store.history.length > 60) store.history = store.history.slice(-60);
    save();
    go('examResult', {});
  }

  function viewExamResult() {
    if (!exam) { go('exam'); return; }
    var score = 0;
    exam.list.forEach(function (q, i) { if (exam.answers[i] === q.answer) score++; });
    var pct = Math.round((score / exam.list.length) * 100);
    var passSub = pct >= 40, passAvg = pct >= 60;

    var h = '<div class="card">';
    h += '<div class="scorebox"><div class="pct ' + (passSub ? 'pass' : 'fail') + '">' + pct + '%</div>' +
         '<div class="cap">' + esc(exam.data.name) + ' · ' + score + ' / ' + exam.list.length + '문항</div></div>';
    h += '<div class="risk' + (passSub ? ' ok' : '') + '" style="margin-top:14px">';
    if (!passSub) {
      h += '<b>과락 기준(40점) 미달입니다.</b><br>실제 시험이라면 다른 과목 점수와 무관하게 불합격입니다. 이 과목을 최우선으로 보세요.';
    } else if (!passAvg) {
      h += '<b>과락은 면했지만 평균 기준(60점) 아래입니다.</b><br>이 점수대 과목이 여러 개면 평균에서 걸립니다.';
    } else {
      h += '<b>과락선·평균선을 모두 넘겼습니다.</b><br>오답 문항만 반복해 유지하세요.';
    }
    h += '</div>';
    h += '<div class="omr" style="margin-top:14px">';
    exam.list.forEach(function (q, i) {
      var ok = exam.answers[i] === q.answer;
      h += '<button type="button" class="' + (ok ? 'o' : 'x') + '" data-rjump="' + i + '">' + (i + 1) + '</button>';
    });
    h += '</div>';
    h += '<div class="btn-row" style="margin-top:14px">' +
         '<button class="btn ghost sm" id="retryExam" type="button">다시 풀기</button>' +
         '<button class="btn ghost sm" data-nav="exam" type="button">다른 과목</button>' +
         '<button class="btn ghost sm" data-nav="wrong" type="button">오답노트</button></div>';
    h += '</div>';

    h += '<div class="card"><h2>문항별 해설</h2>';
    exam.list.forEach(function (q, i) {
      var ok = exam.answers[i] === q.answer;
      var mine = exam.answers[i] >= 0 ? (exam.answers[i] + 1) + '번' : '무응답';
      h += '<div class="reviewitem" id="r' + i + '">';
      h += '<div class="qmeta"><span class="qtopic">' + (i + 1) + '. ' + esc(q.topic || '') + '</span>' +
           '<span style="color:' + (ok ? 'var(--ok)' : 'var(--bad)') + ';font-weight:700">' + (ok ? '정답' : '오답') + '</span></div>';
      h += '<div class="rq">' + esc(q.q) + '</div>';
      h += '<div class="ra"><span class="k">내 답</span> ' + esc(mine) + ' &nbsp;·&nbsp; <span class="k">정답</span> ' + (q.answer + 1) + '번 — ' + esc(q.choices[q.answer]) + '</div>';
      h += '<div class="explain"><span class="lab">해설</span>' + esc(q.explain) + '</div>';
      h += '</div>';
    });
    h += '</div>';

    app.innerHTML = h;
    app.querySelectorAll('[data-rjump]').forEach(function (b) {
      b.addEventListener('click', function () {
        var el = document.getElementById('r' + b.dataset.rjump);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
    var rb = document.getElementById('retryExam');
    if (rb) rb.addEventListener('click', function () {
      var sub = exam.subId; exam = null; go('examRun', { sub: sub });
    });
  }

  /* ---------------- 오답노트 ---------------- */

  var wrongRun = null;

  function viewWrong() {
    var ids = Object.keys(store.wrong);
    if (!ids.length) {
      app.innerHTML = '<div class="card"><div class="empty"><div class="big">📝</div>' +
        '<p>오답노트가 비어 있습니다.<br>학습·실전 모드에서 틀린 문항이 자동으로 모입니다.</p>' +
        '<button class="btn" data-nav="study" type="button">학습 시작</button></div></div>';
      return;
    }

    // 과목별 집계
    var bySub = {};
    ids.forEach(function (id) {
      var s = store.wrong[id];
      bySub[s] = (bySub[s] || 0) + 1;
    });

    var h = '<div class="card"><h2>오답노트</h2>' +
      '<p class="sub">틀린 문항 <b>' + ids.length + '개</b>. 맞히면 목록에서 빠집니다.</p>';
    h += '<div class="picklist">';
    Object.keys(bySub).forEach(function (sid) {
      var m = subjectMeta(sid);
      h += '<button type="button" class="pickitem" data-wrongsub="' + sid + '">' +
           '<span><span class="nm">' + esc(m ? m.name : sid) + '</span>' +
           '<span class="dt">' + bySub[sid] + '문항</span></span>' +
           '<span class="badge">풀기</span></button>';
    });
    h += '</div>';
    h += '<div class="btn-row" style="margin-top:14px">' +
         '<button class="btn wide" data-wrongsub="__all" type="button">전 과목 ' + ids.length + '문항 한 번에</button></div>';
    h += '</div>';

    app.innerHTML = h;
    app.querySelectorAll('[data-wrongsub]').forEach(function (b) {
      b.addEventListener('click', function () { startWrongRun(b.dataset.wrongsub); });
    });
  }

  function startWrongRun(scope) {
    var ids = Object.keys(store.wrong).filter(function (id) {
      return scope === '__all' || store.wrong[id] === scope;
    });
    var subIds = {};
    ids.forEach(function (id) { subIds[store.wrong[id]] = 1; });

    app.innerHTML = '<div class="loading">불러오는 중…</div>';
    Promise.all(Object.keys(subIds).map(getSubject)).then(function () {
      var list = [];
      ids.forEach(function (id) {
        var sid = store.wrong[id];
        var data = CACHE[sid];
        if (!data) return;
        var q = data.questions.filter(function (x) { return x.id === id; })[0];
        if (q) list.push({ q: q, sub: sid, subName: data.name });
      });
      if (!list.length) { viewWrong(); return; }
      wrongRun = { list: shuffle(list), i: 0, picked: -1, revealed: false };
      drawWrong();
    });
  }

  function drawWrong() {
    if (wrongRun.i >= wrongRun.list.length) {
      var left = Object.keys(store.wrong).length;
      app.innerHTML = '<div class="card"><div class="empty"><div class="big">' + (left ? '👍' : '🎉') + '</div>' +
        '<p>이번 묶음을 모두 풀었습니다.<br>남은 오답 <b>' + left + '개</b></p>' +
        '<div class="btn-row" style="justify-content:center">' +
        '<button class="btn ghost" data-nav="wrong" type="button">오답노트로</button>' +
        '<button class="btn ghost" data-nav="home" type="button">홈</button></div></div></div>';
      return;
    }

    var item = wrongRun.list[wrongRun.i];
    var q = item.q;
    var h = '<div class="card">';
    h += '<div class="qmeta"><span>오답노트 · ' + esc(item.subName) + '</span>' +
         '<span>' + (wrongRun.i + 1) + ' / ' + wrongRun.list.length + '</span></div>';
    h += '<div class="progressline"><i style="width:' + (wrongRun.i / wrongRun.list.length * 100) + '%"></i></div>';
    h += '<div class="qtext">' + esc(q.q) + '</div>';
    h += '<div class="choices">';
    q.choices.forEach(function (c, idx) {
      var cls = 'choice';
      if (wrongRun.revealed) {
        if (idx === q.answer) cls += ' correct';
        else if (idx === wrongRun.picked) cls += ' wrong';
      } else if (idx === wrongRun.picked) cls += ' picked';
      h += '<button type="button" class="' + cls + '" data-wchoice="' + idx + '"' +
           (wrongRun.revealed ? ' disabled' : '') + '>' +
           '<span class="num">' + (idx + 1) + '</span><span>' + esc(c) + '</span></button>';
    });
    h += '</div>';

    if (wrongRun.revealed) {
      var ok = wrongRun.picked === q.answer;
      h += '<div class="explain"><span class="verdict ' + (ok ? 'o' : 'x') + '">' +
           (ok ? '정답 — 오답노트에서 제거됩니다' : '아직 오답 — 노트에 남습니다 (정답 ' + (q.answer + 1) + '번)') +
           '</span><span class="lab">해설</span>' + esc(q.explain) + '</div>';
      h += '<div class="qnav"><button class="btn wide" id="wNext" type="button">' +
           (wrongRun.i + 1 >= wrongRun.list.length ? '마치기' : '다음 문항') + '</button></div>';
    } else {
      h += '<div class="qnav"><button class="btn wide" id="wCheck" type="button"' +
           (wrongRun.picked < 0 ? ' disabled' : '') + '>정답 확인</button></div>';
    }
    h += '</div>';

    app.innerHTML = h;
    app.querySelectorAll('[data-wchoice]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (wrongRun.revealed) return;
        wrongRun.picked = parseInt(b.dataset.wchoice, 10);
        drawWrong();
      });
    });
    var wc = document.getElementById('wCheck');
    if (wc) wc.addEventListener('click', function () {
      wrongRun.revealed = true;
      record(q.id, item.sub, wrongRun.picked === q.answer);
      drawWrong();
    });
    var wn = document.getElementById('wNext');
    if (wn) wn.addEventListener('click', function () {
      wrongRun.i++; wrongRun.picked = -1; wrongRun.revealed = false;
      drawWrong();
    });
  }

  /* ---------------- 개념정리 ---------------- */

  function viewConcept() {
    var h = '<div class="card"><h2>개념정리</h2>' +
      '<p class="sub">과목별 핵심 개념 요약입니다. 문제를 풀다 막히면 여기부터 확인하세요.</p>' +
      subjectList('conceptOne', '') + '</div>';
    app.innerHTML = h;
    bindSubjectList();
  }

  function viewConceptOne() {
    var subId = view.params.sub;
    app.innerHTML = '<div class="loading">불러오는 중…</div>';
    getSubject(subId).then(function (data) {
      var h = '<div class="card"><h2>' + esc(data.name) + '</h2>' +
        '<p class="sub">핵심 개념 ' + data.concepts.length + '개</p>';
      data.concepts.forEach(function (c, i) {
        h += '<div class="acc" data-acc="' + i + '">' +
             '<button class="acc-head" type="button"><span class="t">' + esc(c.title) + '</span><span class="caret">▶</span></button>' +
             '<div class="acc-body">' +
             (c.keys && c.keys.length ? '<div class="keys" style="margin-bottom:10px">' +
               c.keys.map(function (k) { return '<span class="key">' + esc(k) + '</span>'; }).join('') + '</div>' : '') +
             '<p>' + esc(c.body) + '</p></div></div>';
      });
      h += '<div class="btn-row" style="margin-top:16px">' +
           '<button class="btn ghost sm" data-nav="concept" type="button">과목 바꾸기</button>' +
           '<button class="btn sm" data-goquiz="' + subId + '" type="button">이 과목 문제 풀기</button></div>';
      h += '</div>';
      app.innerHTML = h;

      app.querySelectorAll('.acc-head').forEach(function (b) {
        b.addEventListener('click', function () { b.parentElement.classList.toggle('open'); });
      });
      var gq = app.querySelector('[data-goquiz]');
      if (gq) gq.addEventListener('click', function () { quiz = null; go('quiz', { sub: gq.dataset.goquiz }); });
    }).catch(function (err) {
      app.innerHTML = '<div class="card"><h2>불러오기 실패</h2><p class="sub">' + esc(err.message) + '</p>' +
        '<button class="btn ghost" data-nav="concept" type="button">돌아가기</button></div>';
    });
  }

  /* ---------------- 설정 ---------------- */

  function viewSettings() {
    var h = '<div class="card"><h2>설정</h2>';
    h += '<div class="field"><label for="dateInput">시험일</label>' +
         '<input type="date" id="dateInput" value="' + esc(examDate()) + '"></div>';
    h += '<div class="field"><label>테마</label>' +
         '<select id="themeSel">' +
         '<option value=""' + (store.theme === '' ? ' selected' : '') + '>시스템 설정</option>' +
         '<option value="light"' + (store.theme === 'light' ? ' selected' : '') + '>밝게</option>' +
         '<option value="dark"' + (store.theme === 'dark' ? ' selected' : '') + '>어둡게</option>' +
         '</select></div>';
    h += '</div>';

    h += '<div class="card"><h2>선택과목</h2>' +
         '<p class="sub">4과목 중 <b>2과목</b>을 골라 응시합니다. 현재 ' + store.picks.length + '/2 선택.</p>' +
         electivePicker() + '</div>';

    h += '<div class="card"><h2>기록 관리</h2>' +
         '<p class="sub">풀이 기록은 이 브라우저에만 저장됩니다. 기기를 바꾸면 이어지지 않습니다.</p>' +
         '<div class="btn-row">' +
         '<button class="btn ghost sm" id="resetWrong" type="button">오답노트 비우기</button>' +
         '<button class="btn ghost sm" id="resetAll" type="button">전체 기록 삭제</button>' +
         '</div></div>';

    app.innerHTML = h;
    bindElectivePicker();

    document.getElementById('dateInput').addEventListener('change', function (e) {
      store.examDate = e.target.value; save(); renderDday();
    });
    document.getElementById('themeSel').addEventListener('change', function (e) {
      store.theme = e.target.value; save(); applyTheme();
    });
    document.getElementById('resetWrong').addEventListener('click', function () {
      if (!confirm('오답노트를 비울까요? 정답률 기록은 유지됩니다.')) return;
      store.wrong = {}; save(); go('settings');
    });
    document.getElementById('resetAll').addEventListener('click', function () {
      if (!confirm('풀이 기록, 오답노트, 응시 기록을 모두 지웁니다. 되돌릴 수 없습니다.')) return;
      var picks = store.picks, date = store.examDate, theme = store.theme;
      store = Object.assign({}, DEFAULTS, { picks: picks, picksInit: true, examDate: date, theme: theme });
      save(); go('home');
    });
  }

  /* ---------------- 시작 ---------------- */

  applyTheme();

  fetch('data/index.json')
    .then(function (r) {
      if (!r.ok) throw new Error('과목 목록을 불러오지 못했습니다 (' + r.status + ')');
      return r.json();
    })
    .then(function (m) {
      META = m;
      // 기본 선택과목은 처음 한 번만 넣는다. 이후에는 사용자가 지운 상태를
      // 그대로 두어야 하므로, 비어 있다고 다시 채우지 않는다.
      if (!store.picksInit) {
        var valid = (m.defaultPicks || []).filter(function (id) {
          return m.subjects.some(function (s) { return s.id === id && s.type === 'elective'; });
        });
        if (store.picks.length === 0 && valid.length) store.picks = valid.slice(0, 2);
        store.picksInit = true;
        save();
      }
      // 8과목 전체를 미리 받아 둔다 — 대시보드 집계와 과목 목록이 동기 렌더가 된다
      return Promise.all(m.subjects.map(function (s) {
        return getSubject(s.id).catch(function () { return null; });
      }));
    })
    .then(function () { go('home'); })
    .catch(function (err) {
      app.innerHTML = '<div class="card"><h2>시작할 수 없습니다</h2>' +
        '<p class="sub">' + esc(err.message) + '</p>' +
        '<p class="sub muted">파일을 직접 열지 말고 웹 서버(또는 배포된 주소)로 접속해 주세요.</p></div>';
    });
})();

</script>
</body>
</html>
