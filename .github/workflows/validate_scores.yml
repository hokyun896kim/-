name: Validate Score Predictiveness

# 점수의 예측력을 실데이터로 측정해 data/validation.json 에 커밋한다.
#
# 로컬/샌드박스에서는 Yahoo 접속이 막히는 경우가 많아 검증을 돌릴 수 없다.
# GitHub Actions 러너는 외부 네트워크가 열려 있으므로 여기서 돌린다.
# 결과 JSON 은 대시보드 '🔬 검증' 탭이 그대로 읽어 보여준다.

on:
  schedule:
    - cron: '0 8 * * 6'        # 매주 토 08:00 UTC = 토 17:00 KST
  workflow_dispatch:
    inputs:
      top:
        description: '시총 상위 N종목'
        required: false
        default: '80'
      period:
        description: '분석 기간 (5y / 10y / max)'
        required: false
        # 독립 관측일이 표본 수를 좌우한다. 5y·60일 구간이면 비중첩 표본이
        # 19개뿐이라 t값을 신뢰하기 어렵다. 기본을 max 로 두어 표본을 늘린다.
        default: 'max'
  # 채점/검증 코드가 바뀌는 PR 에서는 자동으로 돌려 예측력 변화를 바로 본다.
  # workflow_dispatch 는 워크플로 파일이 **기본 브랜치에** 있어야 등록되므로,
  # 아직 병합 전인 지금은 PR 트리거가 유일한 실행 경로다.
  pull_request:
    paths:
      - 'stocksystem/analysis/**'
      - 'stocksystem/research/**'
      - 'research_cli.py'
      - '.github/workflows/validate_scores.yml'

permissions:
  contents: write

concurrency:
  group: validate-scores
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request 이벤트의 기본 체크아웃은 병합 커밋(detached HEAD)이라
          # 그대로면 결과를 push 할 수 없다. PR 일 때는 head 브랜치를 잡는다.
          ref: ${{ github.event_name == 'pull_request'
                   && github.head_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 자체 테스트 (하네스가 멀쩡한지 먼저 확인)
        run: pytest -q tests/test_eventstudy.py tests/test_technical.py

      - name: 이벤트 스터디 실행
        run: |
          python research_cli.py \
            --top "${{ github.event.inputs.top || '80' }}" \
            --period "${{ github.event.inputs.period || 'max' }}" \
            --horizons 20 60 \
            --compare \
            --out data/validation.json \
            | tee validation_report.txt

      - name: 리포트를 요약에 첨부
        if: always()
        run: |
          {
            echo '## 점수 예측력 검증 결과'
            echo '```'
            cat validation_report.txt || echo '(리포트 없음)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 커밋
        # 포크에서 온 PR 은 푸시 권한이 없으므로 건너뛴다. 같은 저장소 PR 은
        # 커밋한다 — GITHUB_TOKEN 으로 민 커밋은 워크플로를 재트리거하지
        # 않으므로 무한 루프는 생기지 않는다.
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git diff 는 **미추적 파일을 보지 못한다.** 처음 만들어지는
          # validation.json 에 git diff --quiet 를 쓰면 항상 '변경 없음'이
          # 나와 영영 커밋되지 않는다. status --porcelain 으로 봐야 한다.
          if [ -z "$(git status --porcelain -- data/validation.json)" ]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git add data/validation.json
          git commit -m "chore(research): 점수 예측력 검증 결과 갱신 ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do
            git push && break
            echo "push 실패 — ${i}회차, 재시도 대기"
            sleep $((2 ** i))
            git pull --rebase || true
          done
