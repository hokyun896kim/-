"인간중심 — 촉진적 관계 안에서의 자기개념 재조직화","게슈탈트 — 지금-여기에서의 알아차림과 접촉의 회복","REBT — 비합리적 신념의 논박과 재구성","현실치료 — 과거 외상 경험의 재구성과 감정 정화"],"answer":4,"explain":"현실치료는 과거와 감정보다 현재의 선택과 행동에 초점을 두며, 책임 있는 행동 선택을 통해 욕구를 충족하도록 돕는 것이 변화 기제다. 과거 외상의 재구성은 정신분석 계열의 관점이다."}]},"family":{"id":"family","name":"가족상담","short":"가족상담","type":"elective","order":7,"concepts":[{"title":"체계론적 관점","keys":["순환적 인과론","전체성","항상성","비합산성"],"body":"가족상담의 기본 전제는 개인의 증상을 개인 내부가 아니라 가족이라는 체계의 맥락에서 이해하는 것이다. 직선적 인과론(A가 B의 원인)이 아니라 순환적 인과론(A와 B가 서로 원인이자 결과)으로 보며, 전체는 부분의 합 이상이라는 비합산성을 전제한다. 가족은 항상성(homeostasis)을 통해 안정을 유지하려 하며, 변화를 요구받을 때 저항이 나타나는 것도 이 때문이다. 증상을 보이는 구성원은 '지목된 환자(IP)'일 뿐 문제의 원인이 아니다."},{"title":"가족구조와 경계","keys":["명확한 경계","밀착","유리","위계","하위체계"],"body":"가족은 부부·부모자녀·형제자매 등의 하위체계로 구성되며, 각 하위체계 사이의 경계는 명확한 경계(clear), 밀착된(경직되지 않고 지나치게 얽힌) 경계, 유리된(경직된) 경계로 나뉜다. 명확한 경계는 소속감과 자율성을 함께 허용한다. 밀착된 가족은 개별성이 침해되고, 유리된 가족은 지지와 소속감이 부족하다. 부모가 자녀보다 위계상 상위에 있어야 하며, 위계가 역전되거나 세대 간 경계가 무너질 때(부모화된 자녀, 세대 간 연합) 문제가 발생한다."},{"title":"Bowen의 다세대 가족치료","keys":["자아분화","삼각관계","가족투사","정서적 단절","가계도"],"body":"핵심 개념은 자아분화로, 지적 기능과 정서적 기능을 구분하고 가족의 정서적 융합에서 자율성을 유지하는 능력이다. 8가지 개념은 자아분화, 삼각관계, 핵가족 정서체계, 가족투사과정, 정서적 단절, 다세대 전수과정, 형제자매 위치, 사회적 정서과정이다. 두 사람 사이의 불안이 높아지면 제3자를 끌어들여 삼각관계를 형성해 불안을 분산한다. 상담자는 정서적 삼각관계에 말려들지 않는 탈삼각화를 유지하며, 가계도를 통해 최소 3세대의 관계 패턴을 탐색한다."},{"title":"Minuchin의 구조적 가족치료","keys":["합류","실연","경계 만들기","긴장 고조","재구조화"],"body":"가족의 역기능적 구조(경계, 위계, 제휴)를 재구조화하는 데 목표를 둔다. 상담자는 먼저 가족의 방식에 맞추어 들어가는 합류(joining)와 적응(accommodation)을 한 뒤, 실연(enactment)을 통해 가족의 상호작용을 상담실에서 직접 재현시켜 관찰하고 개입한다. 주요 기법은 경계 만들기, 긴장 고조시키기, 균형 깨뜨리기, 재구성(reframing), 증상 활용이다. 제휴 중 두 사람이 제3자에 대항해 결속하는 것을 연합(coalition), 갈등을 자녀에게 돌리는 것을 우회(detouring)라 한다."},{"title":"Satir의 경험적 가족치료","keys":["의사소통 유형 5가지","자존감","가족조각"],"body":"Satir는 스트레스 상황에서 나타나는 역기능적 의사소통 유형으로 회유형(자기 무시, 타인·상황 존중), 비난형(타인 무시), 초이성형(자기·타인 무시, 상황만 중시), 산만형(자기·타인·상황 모두 무시)을 제시하고, 기능적 유형으로 일치형(자기·타인·상황 모두 존중)을 제시했다. 목표는 자존감 향상과 일치적 의사소통이며, 가족조각(family sculpting), 가족그림, 역할극, 원가족 도표 같은 체험적 기법을 사용한다."},{"title":"전략적 가족치료","keys":["역설적 개입","증상 처방","재구성","지시"],"body":"Haley와 MRI 집단은 통찰보다 증상을 유지시키는 상호작용 고리를 끊는 데 초점을 둔다. '문제를 해결하려는 시도가 오히려 문제를 유지한다'고 보아 지시(directive)를 적극 사용한다. 역설적 개입에는 증상을 일부러 하게 하는 증상 처방, 변화 속도를 늦추라는 제지 기법(restraining), 변화 시 잃게 될 것을 예상하게 하는 기법이 있다. 재구성(reframing)은 같은 행동에 새로운 긍정적 의미를 부여하는 기법이다. Haley는 가족 위계와 권력 구조를 중시했다."},{"title":"해결중심 및 이야기치료","keys":["예외질문","기적질문","외재화","독특한 결과","재저작"],"body":"해결중심 가족치료(de Shazer, Berg)는 문제의 원인 탐색 대신 예외 상황과 이미 작동하는 해결책을 확대하며, 기적질문·예외질문·척도질문·대처질문을 사용한다. 이야기치료(White & Epston)는 '사람이 문제가 아니라 문제가 문제'라는 관점에서 문제를 사람과 분리하는 외재화(externalizing) 대화를 하고, 지배적 이야기에 맞지 않는 독특한 결과(unique outcome)를 찾아 대안적 이야기로 재저작(re-authoring)하며, 반영팀과 편지 쓰기, 정의예식을 활용한다."},{"title":"가족생활주기와 가족상담의 실제","keys":["발달 단계별 과업","IP","합동면접","비밀 다루기"],"body":"가족생활주기는 결혼 전 성인기, 결혼, 어린 자녀가 있는 가족, 청소년 자녀가 있는 가족, 자녀 독립기, 노년기로 구분되며 단계마다 과업과 전환기의 위기가 있다. 청소년 자녀기의 핵심 과업은 자녀의 자율성 증대에 맞추어 가족 경계를 유연하게 조정하는 것이다. 상담자는 특정 구성원을 문제의 원인으로 지목하지 않고 중립성을 유지하며, 개별 면담에서 알게 된 비밀을 어떻게 다룰지에 대한 원칙(비밀 정책)을 사전에 합의해 두어야 한다."}],"questions":[{"id":"fm-001","topic":"체계론","q":"가족상담의 체계론적 관점에 관한 설명으로 옳지 않은 것은?","choices":["개인의 증상을 가족 맥락 안에서 이해한다","가족 전체는 부분의 단순한 합 이상이다","가족원 간 영향은 순환적으로 작용한다","가족은 항상성을 통해 안정을 유지하려 한다","증상을 보이는 구성원이 가족 문제의 근본 원인이다"],"answer":4,"explain":"증상을 보이는 구성원은 '지목된 환자(IP, Identified Patient)'일 뿐 원인이 아니다. 체계론은 원인을 개인에게 귀속시키지 않고 관계 패턴에서 찾는다."},{"id":"fm-002","topic":"체계론","q":"순환적 인과론(circular causality)에 관한 설명으로 가장 적절한 것은?","choices":["원인이 결과를 낳는 일방향의 관계로 본다","가족원의 행동이 서로 원인이자 결과로 작용한다고 본다","과거의 사건이 현재를 결정한다고 본다","생물학적 요인이 행동을 결정한다고 본다","가장 힘이 센 가족원이 나머지를 통제한다고 본다"],"answer":1,"explain":"예를 들어 '아내가 잔소리해서 남편이 침묵한다'와 '남편이 침묵해서 아내가 잔소리한다'는 같은 고리의 다른 구두점이다. 순환적 인과론은 누가 먼저인지를 따지는 대신 반복되는 상호작용 패턴을 본다."},{"id":"fm-003","topic":"가족 경계","q":"다음 가족의 특징으로 가장 적절한 것은?\n\n\"자녀가 방문을 닫는 것도 허용되지 않고, 부모는 자녀의 모든 생각을 알아야 한다고 여기며, 자녀는 부모의 감정 변화에 즉각 반응한다.\"","choices":["유리된(disengaged) 경계","밀착된(enmeshed) 경계","명확한(clear) 경계","역전된 위계","정서적 단절"],"answer":1,"explain":"밀착된 가족은 경계가 지나치게 느슨해 개별성과 자율성이 침해되고 정서적 반응성이 과도하다. 청소년기 자율성 발달과 충돌해 갈등이 커지는 전형적 구조다."},{"id":"fm-004","topic":"가족 구조","q":"Minuchin의 구조적 가족치료에서 부모 중 한 사람과 자녀가 결속하여 다른 부모에게 대항하는 관계를 가리키는 용어는?","choices":["합류","연합(coalition)","우회(detouring)","제휴","실연"],"answer":1,"explain":"제휴(alignment) 중 두 사람이 제3자에 '대항'하여 결속하는 것이 연합이다. 특히 세대를 가로지르는 세대 간 연합은 부모 하위체계를 약화시켜 역기능을 초래한다. 우회는 부부 갈등을 자녀에게 돌려 다루는 것이다."},{"id":"fm-005","topic":"구조적 가족치료","q":"구조적 가족치료에서 '실연(enactment)'의 목적으로 가장 적절한 것은?","choices":["가족의 과거 경험을 회상하게 한다","가족의 상호작용을 상담 장면에서 직접 재현하게 하여 관찰하고 개입한다","가족원에게 역설적 지시를 부과한다","가계도를 그려 다세대 패턴을 확인한다","가족원 각자의 자존감을 측정한다"],"answer":1,"explain":"실연은 '집에서 어떻게 다투는지 지금 여기서 해 보라'고 요청해 보고된 이야기가 아닌 실제 패턴을 관찰하고, 그 자리에서 구조를 수정하는 개입이다."},{"id":"fm-006","topic":"구조적 가족치료","q":"구조적 가족치료에서 상담 초기에 상담자가 가족의 방식과 속도에 맞추어 체계에 들어가는 과정을 가리키는 용어는?","choices":["합류(joining)","탈삼각화","외재화","재구성","경계 만들기"],"answer":0,"explain":"합류는 가족의 언어, 정서, 규칙에 상담자가 적응(accommodation)하며 신뢰를 얻는 과정으로, 이후의 재구조화 개입이 수용되기 위한 전제 조건이다."},{"id":"fm-007","topic":"Bowen","q":"Bowen 이론에서 '자아분화(differentiation of self)'가 낮은 사람의 특징으로 가장 적절한 것은?","choices":["지적 기능과 정서적 기능을 잘 구분한다","가족의 정서적 압력에서 자율적으로 사고한다","타인의 정서에 즉각적으로 융합되고 반응한다","불안 상황에서도 자기 입장을 유지한다","친밀함과 독립성을 균형 있게 유지한다"],"answer":2,"explain":"자아분화가 낮으면 사고와 감정이 융합되고 타인의 정서에 자동적으로 반응하여 자기 입장을 유지하지 못한다. 정서적 융합과 단절은 모두 낮은 분화의 표현이다."},{"id":"fm-008","topic":"Bowen","q":"Bowen 이론에서 '삼각관계(triangle)'가 형성되는 이유로 가장 적절한 것은?","choices":["두 사람 사이의 불안과 긴장을 제3자를 통해 분산시키기 위해","가족의 위계를 명확히 하기 위해","자녀의 독립을 촉진하기 위해","가족의 경제적 자원을 배분하기 위해","세대 간 경계를 강화하기 위해"],"answer":0,"explain":"두 사람 관계는 불안이 높아지면 불안정해지므로 제3자를 끌어들여 안정을 회복하려 한다. 부부 갈등이 자녀 문제로 표출되는 것이 대표적이며, 상담자 역시 삼각관계에 끌려들지 않도록 유의해야 한다."},{"id":"fm-009","topic":"Bowen","q":"Bowen의 8가지 개념에 해당하지 않는 것은?","choices":["가족투사과정","정서적 단절","다세대 전수과정","형제자매 위치","가족조각"],"answer":4,"explain":"가족조각(family sculpting)은 Satir의 경험적 가족치료 기법이다. Bowen의 8개념은 자아분화, 삼각관계, 핵가족 정서체계, 가족투사과정, 정서적 단절, 다세대 전수과정, 형제자매 위치, 사회적 정서과정이다."},{"id":"fm-010","topic":"Bowen","q":"가계도(genogram)를 활용하는 주된 목적으로 가장 적절한 것은?","choices":["가족의 경제적 수준을 평가하기 위해","최소 3세대에 걸친 가족 구조와 관계 패턴을 파악하기 위해","가족원의 지능 수준을 비교하기 위해","가족의 의사소통 유형을 측정하기 위해","가족의 미래 사건을 예측하기 위해"],"answer":1,"explain":"가계도는 3세대 이상의 가족 구성, 주요 사건, 관계의 질(밀착·갈등·단절)을 도식화해 반복되는 다세대 패턴을 드러내는 사정 도구다."},{"id":"fm-011","topic":"Satir","q":"Satir의 의사소통 유형 중 다음에 해당하는 것은?\n\n\"갈등 상황에서 자신과 상대의 감정은 모두 무시하고, 논리와 원칙만을 장황하게 늘어놓는다.\"","choices":["회유형","비난형","초이성형","산만형","일치형"],"answer":2,"explain":"초이성형은 자기와 타인은 무시하고 상황(논리·규칙)만 중시한다. 회유형은 자기를 무시하고 타인·상황을 중시, 비난형은 타인을 무시, 산만형은 자기·타인·상황을 모두 무시한다."},{"id":"fm-012","topic":"Satir","q":"Satir가 기능적이라고 본 의사소통 유형인 '일치형'의 특징은?","choices":["자신을 낮추고 상대의 요구에 맞춘다","상대의 잘못을 지적하며 주도권을 잡는다","자신, 타인, 상황을 모두 존중하며 솔직하게 표현한다","주제를 벗어난 말로 긴장을 흩뜨린다","감정을 배제하고 사실만을 전달한다"],"answer":2,"explain":"일치형은 자기·타인·상황이라는 세 요소를 모두 존중하며 내면의 감정과 표현이 일치하는 상태다. Satir의 목표는 가족원의 자존감을 높여 일치적 의사소통을 회복하는 것이다."},{"id":"fm-013","topic":"Satir","q":"가족조각(family sculpting) 기법에 관한 설명으로 옳은 것은?","choices":["가계도를 그려 다세대 패턴을 분석한다","가족원의 신체적 위치와 자세로 가족관계를 공간적으로 표현하게 한다","가족에게 증상을 일부러 반복하도록 지시한다","문제를 사람과 분리하여 이름 붙인다","예외 상황을 찾아 확대한다"],"answer":1,"explain":"가족조각은 한 가족원이 조각가가 되어 나머지 가족을 거리·자세·시선으로 배치함으로써, 언어로 표현되지 않던 관계의 친밀도와 권력 구조를 시각적·체험적으로 드러내는 기법이다."},{"id":"fm-014","topic":"전략적 가족치료","q":"전략적 가족치료에서 '증상 처방(prescribing the symptom)'에 관한 설명으로 옳은 것은?","choices":["증상을 즉시 중단하도록 강하게 지시한다","증상을 의도적으로 계속하도록 지시하는 역설적 개입이다","증상의 원인을 통찰하도록 해석한다","증상을 다른 가족원에게 옮기도록 한다","증상에 대해 약물 치료를 처방한다"],"answer":1,"explain":"증상 처방은 통제할 수 없다고 여겨지던 증상을 의도적으로 수행하게 함으로써 증상에 대한 통제감을 회복시키고 증상을 유지하던 상호작용 고리를 끊는 역설적 기법이다."},{"id":"fm-015","topic":"전략적 가족치료","q":"다음 상담자의 개입에 해당하는 기법은?\n\n부모: \"얘는 매사에 고집이 세서 문제예요.\"\n상담자: \"자기 생각을 그만큼 분명히 갖고 있다는 뜻이기도 하네요. 그 힘을 어디에 쓸지가 관건이겠군요.\"","choices":["직면","재구성(reframing)","실연","외재화","역설적 지시"],"answer":1,"explain":"재구성은 동일한 행동에 새로운 틀과 긍정적 의미를 부여해 가족의 지각과 반응을 바꾸는 기법이다. 낙인을 자원으로 전환해 변화의 여지를 만든다."},{"id":"fm-016","topic":"전략적 가족치료","q":"MRI 집단이 제시한 문제 형성에 관한 관점으로 가장 적절한 것은?","choices":["문제는 무의식적 갈등에서 비롯된다","문제를 해결하려는 시도 자체가 문제를 유지시킨다","문제는 유전적 소인에 의해 결정된다","문제는 개인의 비합리적 신념에서 비롯된다","문제는 자아분화 수준에 의해 결정된다"],"answer":1,"explain":"MRI의 핵심 명제는 '시도된 해결책(attempted solution)이 문제를 유지한다'는 것이다. 예를 들어 등교를 거부하는 자녀에게 부모가 압박을 강화할수록 거부가 심해지는 악순환이다. 개입은 이 고리를 끊는 데 초점을 둔다."},{"id":"fm-017","topic":"이야기치료","q":"이야기치료에서 '외재화(externalizing)' 대화의 목적으로 가장 적절한 것은?","choices":["문제의 책임을 가족 전체에 분산시키기 위해","문제를 사람과 분리하여 함께 대응할 대상으로 만들기 위해","문제의 무의식적 기원을 밝히기 위해","문제 행동을 강화물로 통제하기 위해","문제를 축소하여 없는 것처럼 다루기 위해"],"answer":1,"explain":"'사람이 문제가 아니라 문제가 문제다'라는 전제에 따라 문제에 이름을 붙여 사람과 분리한다(예: '화가 너를 찾아올 때'). 이를 통해 비난과 정체성 손상을 줄이고 문제에 맞설 주체성을 회복한다."},{"id":"fm-018","topic":"이야기치료","q":"이야기치료에서 지배적 이야기에 부합하지 않는 예외적 경험을 발견해 대안적 이야기의 토대로 삼는 것을 가리키는 개념은?","choices":["독특한 결과","기적질문","실연","탈삼각화","가족조각"],"answer":0,"explain":"독특한 결과(unique outcome)는 '문제로 가득한' 지배적 이야기와 어긋나는 경험이다. 이를 확대해 대안적 이야기로 재저작(re-authoring)하는 것이 이야기치료의 핵심 과정이다."},{"id":"fm-019","topic":"해결중심","q":"해결중심 가족치료의 기본 원칙으로 옳지 않은 것은?","choices":["문제가 없으면 고치지 않는다","효과가 있는 것은 더 많이 한다","효과가 없으면 다르게 한다","작은 변화가 큰 변화를 이끈다","문제의 근본 원인을 반드시 규명해야 한다"],"answer":4,"explain":"해결중심 접근은 원인 규명 없이도 변화가 가능하다고 보며, 문제의 역사보다 이미 작동하는 예외와 해결책의 확대에 초점을 둔다."},{"id":"fm-020","topic":"해결중심","q":"다음 질문에 해당하는 해결중심 기법은?\n\n\"오늘 밤 자는 동안 기적이 일어나 이 문제가 사라졌다고 해 봅시다. 아침에 일어났을 때 무엇을 보고 기적이 일어난 걸 알 수 있을까요?\"","choices":["예외질문","기적질문","척도질문","대처질문","관계성 질문"],"answer":1,"explain":"기적질문은 문제가 해결된 상태를 구체적으로 그려 보게 하여 목표를 행동 수준으로 명료화하고, 그 조각들이 이미 일어나고 있는 예외를 찾아내는 발판이 된다."},{"id":"fm-021","topic":"가족생활주기","q":"청소년 자녀가 있는 가족의 발달 과업으로 가장 적절한 것은?","choices":["부부 체계를 새롭게 형성한다","자녀의 자율성 증대에 맞추어 가족 경계를 유연하게 조정한다","자녀를 독립시키고 부부 관계를 재조정한다","은퇴 이후의 역할 변화에 적응한다","영유아 양육을 위한 역할 분담을 확립한다"],"answer":1,"explain":"청소년기 가족의 핵심 과업은 자녀의 독립 욕구 증가에 맞추어 규칙과 경계를 재협상하는 것이다. 이전 단계의 통제 방식을 고수할 때 갈등이 심화된다."},{"id":"fm-022","topic":"가족 항상성","q":"가족 항상성(homeostasis)에 관한 설명으로 옳은 것은?","choices":["가족이 끊임없이 변화를 추구하는 경향이다","가족이 기존의 균형 상태를 유지하려는 경향이다","가족 구성원이 서로 단절되는 현상이다","가족의 경제적 안정을 의미한다","가족의 위계가 역전되는 현상이다"],"answer":1,"explain":"항상성은 체계가 안정을 유지하려는 성질로, 한 구성원이 변하면 다른 구성원이 이전 상태로 되돌리려는 압력을 가한다. 가족상담에서 나타나는 저항의 상당 부분이 이 기제로 설명된다."},{"id":"fm-023","topic":"가족상담 과정","q":"가족상담에서 상담자의 중립성에 관한 설명으로 가장 적절한 것은?","choices":["가장 힘이 약한 가족원의 편을 일관되게 든다","특정 가족원을 문제의 원인으로 지목하지 않고 균형을 유지한다","가족 문제에 대해 어떤 의견도 표현하지 않는다","부모의 입장을 우선적으로 지지한다","가족 갈등에 개입하지 않고 관찰만 한다"],"answer":1,"explain":"중립성은 무관심이나 침묵이 아니라, 어느 한 사람을 원인으로 낙인찍지 않고 모든 구성원과 작업 동맹을 유지하는 태도다. 필요에 따라 일시적으로 균형을 흔드는 개입(불균형 기법)을 쓰더라도 전체적으로는 균형을 회복한다."},{"id":"fm-024","topic":"가족상담 윤리","q":"가족상담에서 개별 면담 중 알게 된 비밀을 다루는 원칙으로 가장 적절한 것은?","choices":["모든 정보를 즉시 전체 가족에게 공개한다","어떤 정보도 절대 공개하지 않는다고 약속한다","비밀 정보를 어떻게 다룰지 상담 초기에 원칙을 합의해 둔다","부모에게는 모두 알리되 자녀에게는 알리지 않는다","상담자가 그때그때 판단하여 임의로 결정한다"],"answer":2,"explain":"가족상담에서는 여러 사람이 내담자이므로 개별 정보의 처리 방침을 사전에 정하지 않으면 신뢰가 무너진다. '비밀을 지킬 수 없다' 또는 '공개 여부는 함께 논의한다' 등 정책을 초기에 명시하고 동의를 받아야 한다."},{"id":"fm-025","topic":"학파 비교","q":"가족치료 학파와 핵심 개념의 연결이 옳지 않은 것은?","choices":["Bowen — 자아분화, 삼각관계","Minuchin — 경계, 위계, 재구조화","Satir — 의사소통 유형, 자존감","Haley — 역설적 지시, 위계","White — 항상성, 순환적 질문"],"answer":4,"explain":"White는 이야기치료의 창시자로 외재화, 독특한 결과, 재저작이 핵심 개념이다. 순환적 질문은 밀란 학파의 대표 기법이다."},{"id":"fm-026","topic":"밀란 모델","q":"밀란(Milan) 학파의 '순환질문(circular questioning)'에 관한 설명으로 옳은 것은?","choices":["한 가족원에게 다른 가족원들의 관계나 반응에 대해 묻는다","가족의 과거 외상 경험을 시간 순서대로 묻는다","증상을 일부러 반복하도록 지시한다","가족원 각자의 자존감을 평가한다","문제를 사람과 분리하여 이름 붙인다"],"answer":0,"explain":"순환질문은 '아버지가 화내실 때 어머니는 어떻게 하시나요? 그때 동생은요?'처럼 관계에 대해 제3자에게 묻는 방식이다. 정보 수집과 동시에 가족이 관계를 새로운 관점에서 보게 만드는 개입 효과가 있다."},{"id":"fm-027","topic":"청소년 가족상담","q":"청소년 자녀와 부모가 함께 참여하는 가족상담 초기에 상담자가 유의할 점으로 가장 적절하지 않은 것은?","choices":["모든 가족원에게 발언 기회를 균등하게 배분한다","청소년이 비난받는 자리가 되지 않도록 관리한다","각자가 생각하는 문제와 바람을 확인한다","가족의 상호작용 패턴을 관찰한다","부모의 문제 인식을 그대로 상담 목표로 확정한다"],"answer":4,"explain":"부모의 문제 정의를 그대로 채택하면 청소년은 상담을 훈육의 연장으로 지각해 참여를 거부한다. 각자의 관점을 모두 확인한 뒤 가족이 함께 합의할 수 있는 목표로 재구성해야 한다."},{"id":"fm-028","topic":"부모화","q":"'부모화된 자녀(parentified child)'에 관한 설명으로 가장 적절한 것은?","choices":["부모의 역할을 대신 떠맡아 세대 간 경계가 흐려진 상태이다","부모와 정서적으로 완전히 단절된 상태이다","부모의 기대를 거부하고 반항하는 상태이다","부모와 동일한 직업을 선택한 상태이다","부모로부터 과잉보호를 받는 상태이다"],"answer":0,"explain":"부모화는 자녀가 형제 양육이나 부모의 정서적 지지자 역할을 떠맡는 것으로, 세대 간 경계가 무너진 상태다. 겉으로는 성숙해 보이나 자신의 발달 과업과 욕구가 억압되어 이후 부적응으로 이어질 수 있다."},{"id":"fm-029","topic":"이중구속","q":"이중구속(double bind) 의사소통에 관한 설명으로 가장 적절한 것은?","choices":["언어적 메시지와 비언어적 메시지가 상충하여 어떤 반응도 실패하게 되는 상황","두 사람이 동시에 같은 말을 하는 상황","가족이 두 개의 하위체계로 나뉘는 상황","부모가 서로 다른 훈육 방식을 사용하는 상황","자녀가 두 부모 사이에서 중재하는 상황"],"answer":0,"explain":"Bateson이 제시한 개념으로, 상충하는 두 수준의 메시지가 주어지고 그 모순을 지적하거나 상황을 벗어날 수도 없을 때 발생한다(예: 무표정한 얼굴로 '난 널 사랑해, 왜 안 안기니'). 관계에서 벗어날 수 없다는 조건이 핵심이다."},{"id":"fm-030","topic":"종합","q":"가족상담과 개인상담의 차이에 관한 설명으로 옳지 않은 것은?","choices":["가족상담은 문제의 단위를 개인이 아닌 관계 체계로 본다","가족상담은 여러 사람이 동시에 내담자가 될 수 있다","가족상담에서는 비밀보장 원칙의 적용이 더 복잡하다","가족상담은 순환적 인과론을 전제한다","가족상담에서는 개인의 심리내적 요인을 전혀 고려하지 않는다"],"answer":4,"explain":"체계적 관점을 취한다고 해서 개인의 심리내적 요인을 배제하는 것은 아니다. 특히 Bowen의 자아분화나 Satir의 자존감처럼 개인 내적 차원을 핵심 개념으로 다루는 접근도 있으며, 필요시 개인상담을 병행한다."}]},"group":{"id":"group","name":"집단상담","short":"집단상담","type":"elective","order":6,"concepts":[{"title":"집단의 유형","keys":["지도·상담·치료·자조집단","구조화 정도","개방·폐쇄집단"],"body":"목적에 따라 지도(교육)집단은 정보 제공과 예방, 상담집단은 정상 범위의 발달·적응 문제, 치료집단은 성격 재구성과 심각한 병리, 자조집단은 공통 문제를 가진 사람들의 상호 지지를 목적으로 한다. 구조화집단은 목표와 활동이 사전에 정해져 있고 비구조화집단은 지금-여기의 상호작용에 따라 전개된다. 개방집단은 진행 중 새 구성원을 받아 유입이 자유롭지만 응집력이 낮아질 수 있고, 폐쇄집단은 응집력과 신뢰가 높으나 중도 탈락 시 보충이 어렵다."},{"title":"Yalom의 치료적 요인","keys":["보편성","희망의 주입","이타심","대인학습","응집력"],"body":"Yalom이 제시한 집단의 치료적 요인은 희망의 주입, 보편성(나만 그런 것이 아님), 정보 전달, 이타심, 초기 가족관계의 교정적 재현, 사회화 기술의 발달, 모방행동, 대인관계 학습, 집단 응집력, 정화(카타르시스), 실존적 요인이다. 이 가운데 집단 응집력은 다른 요인들이 작동하기 위한 기반이 되는 핵심 조건으로, 개인상담의 치료적 관계에 대응한다."},{"title":"집단의 발달단계","keys":["초기","과도기(갈등)","작업기","종결기"],"body":"초기 단계는 오리엔테이션과 탐색의 시기로 불안과 의존이 높고 표면적 상호작용이 이루어지며, 상담자는 구조화와 신뢰 형성에 집중한다. 과도기(갈등 단계)에는 저항, 불안, 집단원 간·상담자에 대한 갈등과 통제 다툼이 표면화되며, 이를 회피하지 않고 다루어야 작업기로 넘어간다. 작업기에는 응집력과 자기개방이 깊어지고 피드백과 직면을 통한 실질적 변화가 일어난다. 종결기에는 학습 내용을 정리하고 이별 감정을 다루며 일상으로의 전이를 계획한다."},{"title":"집단상담자의 기술","keys":["연결짓기","차단하기","지금-여기 초점화","촉진"],"body":"연결짓기(linking)는 한 집단원의 이야기를 다른 집단원의 경험과 이어 상호작용을 촉진하는 기술이다. 차단하기(blocking)는 특정 집단원의 독점, 사생활 캐묻기, 공격 등 집단에 해로운 행동을 중단시키는 기술로 사람이 아니라 행동을 겨냥한다. 그 밖에 지지, 명료화, 요약, 직면, 피드백 주고받기 촉진, 지금-여기로 초점 옮기기, 모델링이 있다."},{"title":"집단원 선발과 준비","keys":["사전 면접","동질성과 이질성","제외 기준"],"body":"사전 면접을 통해 참여 동기, 목표, 집단 적합성을 확인하고 집단의 목적·규칙·비밀보장의 한계를 안내한다. 지나치게 이질적이면 응집력이 낮아지고 지나치게 동질적이면 학습의 폭이 줄어들므로 목적에 맞게 균형을 잡는다. 급성 정신병적 상태, 심한 위기 상황, 집단을 심하게 방해할 가능성이 큰 사람은 집단보다 개인상담이 우선된다. 청소년 집단은 발달 수준 차이가 크므로 연령대를 좁게 구성하는 것이 일반적이다."},{"title":"집단에서의 문제 상황 다루기","keys":["독점","침묵","하위집단","희생양"],"body":"독점하는 집단원에게는 차단하기와 함께 다른 집단원에게 발언을 넘기고, 그 행동의 이면 욕구를 개인적으로 다룬다. 침묵하는 집단원에게는 강요 대신 참여를 초대하고 침묵의 의미를 탐색한다. 하위집단(파벌)과 집단 밖 사교는 집단 응집을 해칠 수 있어 집단 내에서 공개적으로 다룬다. 특정 집단원이 희생양이 되는 경우 즉시 개입하여 집단 전체의 역동으로 다룬다. 집단원 간 공격이나 강요된 자기개방은 상담자가 보호적으로 차단해야 한다."},{"title":"집단상담의 윤리","keys":["비밀보장의 한계","자발적 참여","심리적 위험 고지"],"body":"집단에서는 상담자가 다른 집단원의 비밀 준수를 보장할 수 없으므로, 비밀보장의 한계를 사전에 명확히 고지하고 규범으로 합의해야 한다. 참여는 자발적이어야 하며 언제든 불이익 없이 그만둘 권리를 알린다. 집단 참여에 따르는 심리적 위험(강한 정서 경험, 관계 갈등)을 사전에 알리고, 강요된 자기개방이나 압력을 방지한다. 학교 등에서 비자발적으로 구성된 집단이라면 참여 수준에 대한 선택권을 보장한다."},{"title":"이론별 집단접근","keys":["교류분석","사이코드라마","게슈탈트","T집단"],"body":"교류분석(Berne)은 자아상태(부모P·어른A·어린이C), 교류 패턴, 게임, 생활각본, 스트로크를 다루며 각본 분석을 통해 자율성 회복을 목표로 한다. 사이코드라마(Moreno)는 주인공·연출자·보조자아·관객·무대의 요소로 구성되며 역할 바꾸기, 이중자아, 거울기법을 사용한다. 게슈탈트 집단은 빈 의자와 뜨거운 자리를 활용하고, T집단(감수성 훈련)은 지금-여기의 대인 피드백을 통해 자기 이해를 넓힌다."}],"questions":[{"id":"gr-001","topic":"집단의 유형","q":"집단의 유형에 관한 설명으로 옳지 않은 것은?","choices":["치료집단은 전문가 없이 구성원끼리 운영하는 것이 원칙이다","상담집단은 정상 범위의 발달·적응 문제를 다룬다","치료집단은 성격의 재구성과 심각한 병리를 다룬다","자조집단은 공통 문제를 가진 사람들의 상호 지지를 목적으로 한다","지도집단은 정보 제공과 예방에 목적을 둔다"],"answer":0,"explain":"전문가 없이 구성원 주도로 운영되는 것은 자조집단(self-help group)의 특징이다. 치료집단은 고도의 훈련을 받은 전문가가 이끈다."},{"id":"gr-002","topic":"집단의 유형","q":"개방집단(open group)의 특징으로 옳은 것은?","choices":["구성원의 유입과 유출이 자유로워 응집력이 낮아질 수 있다","집단이 시작된 후에는 새로운 구성원을 받지 않는다","구성원 간 신뢰와 응집력이 가장 높게 형성된다","중도 탈락자가 생기면 집단을 해체해야 한다","구조화된 프로그램에서만 사용할 수 있다"],"answer":0,"explain":"개방집단은 새 구성원 유입으로 다양한 관점과 활력을 얻지만 매번 신뢰를 재구축해야 해 응집력과 작업의 깊이가 제한될 수 있다. 응집력이 높은 쪽은 폐쇄집단이다."},{"id":"gr-003","topic":"치료적 요인","q":"다음 집단원의 진술에 나타난 Yalom의 치료적 요인은?\n\n\"저만 이런 생각을 하는 줄 알고 부끄러웠는데, 다들 비슷한 고민을 하고 있다는 걸 알게 되니 마음이 놓였어요.\"","choices":["보편성","희망의 주입","이타심","정화","모방행동"],"answer":0,"explain":"자신만 겪는 문제라는 고립감이 깨지고 '나만 그런 게 아니구나'를 경험하는 것이 보편성(universality)이다. 집단상담 초기에 특히 강하게 작동하는 요인이다."},{"id":"gr-004","topic":"치료적 요인","q":"Yalom이 제시한 치료적 요인 중 다른 요인들이 작동하기 위한 기반이 되는 것으로, 개인상담의 치료적 관계에 대응하는 것은?","choices":["집단 응집력","정보 전달","실존적 요인","모방행동","이타심"],"answer":0,"explain":"집단 응집력은 집단에 소속되고 수용된다는 느낌으로, 자기개방과 피드백 등 다른 치료적 요인이 작동할 수 있는 토대가 된다. Yalom은 이를 개인상담의 치료적 동맹에 상응하는 것으로 보았다."},{"id":"gr-005","topic":"치료적 요인","q":"Yalom의 치료적 요인에 해당하지 않는 것은?","choices":["무조건적 긍정적 존중","초기 가족관계의 교정적 재현","사회화 기술의 발달","대인관계 학습","희망의 주입"],"answer":0,"explain":"무조건적 긍정적 존중은 Rogers의 인간중심 상담에서 상담자가 갖추어야 할 태도 조건이며 Yalom의 11가지 치료적 요인 목록에는 포함되지 않는다."},{"id":"gr-006","topic":"발달단계","q":"집단상담의 과도기(전환) 단계에 관한 설명으로 가장 적절한 것은?","choices":["저항과 불안, 갈등과 통제 다툼이 표면화된다","집단원들이 서로를 탐색하며 표면적인 이야기를 나눈다","깊은 자기개방과 실질적인 행동 변화가 일어난다","학습 내용을 정리하고 이별 감정을 다룬다","집단의 목표와 규칙을 처음으로 설정한다"],"answer":0,"explain":"과도기는 저항·불안·갈등이 드러나는 시기다. 상담자가 이 갈등을 회피하거나 서둘러 봉합하면 집단은 피상적 수준에 머물고 작업기로 진입하지 못한다."},{"id":"gr-007","topic":"발달단계","q":"집단상담 초기 단계에서 상담자의 역할로 가장 적절한 것은?","choices":["구조화를 통해 목표와 규범을 명확히 하고 신뢰 분위기를 만든다","집단원 간 갈등을 적극적으로 유발한다","깊은 수준의 직면을 통해 방어를 무너뜨린다","집단 운영을 전적으로 집단원에게 맡긴다","개인의 미해결 과제를 즉시 심층적으로 다룬다"],"answer":0,"explain":"초기에는 불안과 모호함이 높으므로 목적, 규칙, 비밀보장의 한계, 역할을 구조화하고 안전한 분위기를 조성하는 것이 우선이다. 깊은 직면은 신뢰가 형성된 이후의 개입이다."},{"id":"gr-008","topic":"발달단계","q":"집단상담 종결 단계에서 다루어야 할 과제로 가장 거리가 먼 것은?","choices":["새로운 집단원을 받아 집단을 확장한다","집단원 간 미해결 감정을 다룬다","일상생활로의 전이 계획을 세운다","이별에 따른 상실감을 표현하도록 돕는다","집단 경험에서 배운 것을 정리한다"],"answer":0,"explain":"종결기에는 성과를 공고화하고 마무리하는 데 집중한다. 새 구성원 유입은 종결 작업을 방해한다."},{"id":"gr-009","topic":"상담자 기술","q":"다음 상담자의 개입에 해당하는 집단상담 기술은?\n\n\"민수가 방금 말한 외로움이, 아까 지영이가 이야기한 감정과 닮아 보이는데 두 사람은 어떤가요?\"","choices":["연결짓기","차단하기","직면","명료화","요약"],"answer":0,"explain":"연결짓기(linking)는 집단원들의 경험과 감정에서 공통점을 찾아 이어 줌으로써 상호작용과 응집력을 높이는 기술이다."},{"id":"gr-010","topic":"상담자 기술","q":"집단상담에서 '차단하기(blocking)'를 사용해야 하는 상황으로 가장 적절하지 않은 것은?","choices":["집단원이 자신의 감정을 솔직하게 표현할 때","집단원이 다른 집단원의 사생활을 캐물을 때","집단원이 다른 집단원을 인신공격할 때","집단원이 집단 밖의 비밀을 누설하려 할 때","한 집단원이 대화를 계속 독점할 때"],"answer":0,"explain":"차단하기는 집단에 해로운 행동을 멈추기 위한 기술이다. 솔직한 감정 표현은 오히려 촉진해야 할 행동이며, 차단할 때도 사람이 아니라 행동을 겨냥해 존중을 유지해야 한다."},{"id":"gr-011","topic":"문제 상황","q":"집단에서 침묵하는 청소년 집단원에 대한 상담자의 대응으로 가장 적절한 것은?","choices":["침묵의 의미를 존중하면서 참여를 부드럽게 초대한다","침묵을 무시하고 다른 집단원에게만 집중한다","발언을 강제하여 참여를 유도한다","집단에서 나가도록 권유한다","다른 집단원들에게 그 집단원을 설득하게 한다"],"answer":0,"explain":"침묵은 불안, 관찰, 저항 등 여러 의미를 지닌다. 강요는 저항을 강화하고 안전감을 해치므로, 비언어적 반응을 인정하고 부담 없는 수준의 참여를 초대하며 그 의미를 함께 탐색한다."},{"id":"gr-012","topic":"문제 상황","q":"집단 내에서 특정 집단원이 반복적으로 비난의 대상이 되는 '희생양(scapegoating)' 현상에 대한 상담자의 대응으로 가장 적절한 것은?","choices":["즉시 개입하여 보호하고 집단 전체의 역동으로 다룬다","해당 집단원을 집단에서 즉시 배제한다","집단의 자연스러운 역동이므로 개입하지 않는다","비난하는 집단원들을 집단에서 배제한다","다음 회기까지 상황을 지켜본 뒤 결정한다"],"answer":0,"explain":"희생양 현상은 집단이 자신의 불안이나 갈등을 한 사람에게 투사하는 역동이다. 방치하면 심리적 피해를 낳으므로 즉시 보호적으로 개입하고, 개인의 문제가 아닌 집단 전체의 과정으로 다루어야 한다."},{"id":"gr-013","topic":"집단원 선발","q":"집단상담의 사전 면접에서 다루어야 할 내용으로 가장 거리가 먼 것은?","choices":["참여 동기와 개인적 목표의 확인","다른 집단원들의 개인 정보와 문제 소개","비밀보장의 원칙과 그 한계 고지","집단 참여에 따르는 심리적 위험 안내","집단의 목적과 진행 방식 안내"],"answer":1,"explain":"다른 집단원의 개인 정보를 사전에 알리는 것은 명백한 비밀보장 위반이다. 사전 면접은 지원자 본인의 적합성 확인과 집단에 대한 오리엔테이션이 목적이다."},{"id":"gr-014","topic":"집단원 선발","q":"집단상담보다 개인상담이 우선적으로 고려되어야 하는 대상으로 가장 적절한 것은?","choices":["대인관계 기술을 향상하고자 하는 청소년","급성 정신병적 증상으로 현실 검증력이 손상된 청소년","진로 정보를 얻고자 하는 청소년","또래관계에서 위축감을 느끼는 청소년","학업 스트레스를 호소하는 청소년"],"answer":1,"explain":"급성 정신병적 상태, 심각한 위기, 집단을 심하게 방해할 가능성이 큰 경우는 집단이 오히려 자극이 되어 악화될 수 있으므로 개인상담이나 치료적 개입이 선행되어야 한다."},{"id":"gr-015","topic":"집단 윤리","q":"집단상담의 비밀보장에 관한 설명으로 옳은 것은?","choices":["상담자가 모든 집단원의 비밀 준수를 완전히 보장할 수 있다","상담자는 비밀보장의 한계를 사전에 알리고 규범으로 합의해야 한다","집단에서는 비밀보장의 원칙이 적용되지 않는다","집단원 간에는 비밀보장을 요구할 필요가 없다","미성년자 집단에서는 보호자에게 모든 내용을 보고해야 한다"],"answer":1,"explain":"집단에서는 다른 집단원의 준수 여부를 상담자가 통제할 수 없다는 점이 개인상담과 결정적으로 다르다. 따라서 한계를 명확히 고지하고 집단 규범으로 합의하되, 절대적 보장은 약속할 수 없다."},{"id":"gr-016","topic":"집단 윤리","q":"학교에서 비자발적으로 구성된 청소년 집단을 운영할 때 상담자의 윤리적 고려로 가장 적절한 것은?","choices":["참여가 의무이므로 자기개방을 요구한다","참여 수준에 대한 선택권을 보장하고 강요된 개방을 피한다","집단 내용을 담임교사에게 모두 보고한다","참여를 거부하면 성적에 반영한다","비밀보장을 절대적으로 보장한다고 약속한다"],"answer":1,"explain":"비자발적 집단이라도 무엇을 어느 수준까지 개방할지는 본인의 선택이어야 한다. 강요된 자기개방은 윤리적 문제일 뿐 아니라 저항을 키워 집단의 효과도 떨어뜨린다."},{"id":"gr-017","topic":"교류분석","q":"교류분석(TA)에서 말하는 자아상태에 해당하지 않는 것은?","choices":["부모 자아상태(P)","각본 자아상태(S)","어린이 자아상태(C)","어른 자아상태(A)","위 중 없음"],"answer":1,"explain":"TA의 자아상태는 부모(P), 어른(A), 어린이(C)의 세 가지다. 생활각본(script)은 자아상태가 아니라 어린 시절에 형성된 인생 계획을 가리키는 별개의 개념이다."},{"id":"gr-018","topic":"교류분석","q":"교류분석에서 '스트로크(stroke)'에 관한 설명으로 옳은 것은?","choices":["무의식적 갈등을 의미한다","타인의 존재를 인정하는 자극이나 반응을 말한다","집단의 발달 단계를 의미한다","역할을 바꾸어 연기하는 기법이다","비합리적 신념을 논박하는 절차이다"],"answer":1,"explain":"스트로크는 인정 자극으로, 긍정적/부정적, 조건적/무조건적으로 구분된다. 사람은 스트로크를 얻기 위해 행동하며, 긍정적 스트로크가 없으면 부정적 스트로크라도 얻으려 한다고 본다."},{"id":"gr-019","topic":"사이코드라마","q":"사이코드라마의 구성 요소에 해당하지 않는 것은?","choices":["주인공","해석자","보조자아","관객","연출자"],"answer":1,"explain":"Moreno의 사이코드라마는 주인공, 연출자, 보조자아, 관객, 무대의 다섯 요소로 구성된다. 별도의 '해석자' 역할은 없다."},{"id":"gr-020","topic":"사이코드라마","q":"사이코드라마에서 주인공이 상대방의 역할을 직접 맡아 그 입장에서 말하고 느껴 보는 기법은?","choices":["이중자아","역할 바꾸기","거울기법","빈 의자","독백"],"answer":1,"explain":"역할 바꾸기(role reversal)는 주인공이 상대의 자리에 서서 그 관점을 체험하게 하는 기법으로 공감과 조망 수용을 촉진한다. 거울기법은 다른 사람이 주인공을 연기하는 것을 주인공이 관객의 자리에서 지켜보는 기법이다."},{"id":"gr-021","topic":"집단 역동","q":"집단 응집력을 높이는 요인으로 가장 거리가 먼 것은?","choices":["집단원 간 신뢰와 수용의 경험","집단 밖에서 형성된 배타적 하위집단","적극적인 참여와 상호 피드백","집단 목표에 대한 명확한 합의","집단이 자신에게 도움이 된다는 지각"],"answer":1,"explain":"배타적 하위집단(파벌)은 집단 전체의 응집을 분열시키고 소외되는 집단원을 만든다. 집단 밖 사교로 형성된 관계는 집단 내에서 공개적으로 다루어야 한다."},{"id":"gr-022","topic":"집단 규범","q":"집단 규범(norm)에 관한 설명으로 옳지 않은 것은?","choices":["집단에서 기대되는 행동의 기준이다","명시적으로 정할 수도 있고 암묵적으로 형성될 수도 있다","암묵적 규범은 집단에 항상 긍정적으로 작용한다","일단 형성되면 집단원 행동에 강한 영향을 미친다","상담자의 모델링이 규범 형성에 영향을 준다"],"answer":2,"explain":"암묵적 규범이 '깊은 이야기는 하지 않는다', '상담자에게 반대하지 않는다'처럼 형성되면 집단의 작업을 가로막는다. 상담자는 암묵적 규범을 알아차려 공개적으로 다루어야 한다."},{"id":"gr-023","topic":"피드백","q":"집단상담에서 효과적인 피드백의 조건으로 옳지 않은 것은?","choices":["구체적인 행동에 초점을 둔다","관찰한 사실과 그에 대한 자신의 반응을 함께 전한다","상대의 성격 전반에 대해 총평 형식으로 전한다","가능한 한 시기적절하게 전한다","변화 가능한 부분에 대해 준다"],"answer":2,"explain":"성격 전반에 대한 총평은 평가와 낙인으로 받아들여져 방어를 일으킨다. 효과적 피드백은 구체적 행동에 초점을 두고, 판단이 아닌 '나 전달법'으로, 변화 가능한 것에 대해, 적시에 준다."},{"id":"gr-024","topic":"자기개방","q":"집단상담에서 상담자의 자기개방에 관한 설명으로 가장 적절한 것은?","choices":["자기개방은 어떤 경우에도 하지 않는 것이 원칙이다","많이 할수록 집단의 신뢰가 높아진다","집단원의 성장에 도움이 되는 범위에서 선택적으로 한다","상담자의 개인적 고민을 집단에서 해결하기 위해 활용한다","집단원과 동등해지기 위해 모든 사생활을 공유한다"],"answer":2,"explain":"상담자의 자기개방은 모델링과 관계 촉진에 도움이 되지만, 기준은 언제나 '집단원에게 도움이 되는가'다. 상담자 자신의 욕구 충족을 위한 개방은 집단의 초점을 흐리고 역할을 혼란시킨다."},{"id":"gr-025","topic":"청소년 집단","q":"청소년 집단상담을 운영할 때의 고려사항으로 가장 적절하지 않은 것은?","choices":["발달 수준 차이를 고려해 연령대를 비교적 좁게 구성한다","활동과 매체를 활용해 참여 동기를 높인다","집단 규칙은 상담자가 일방적으로 정해 통보한다","또래 압력이 부정적으로 작용하지 않도록 관리한다","회기 시간을 성인 집단보다 짧게 조정할 수 있다"],"answer":2,"explain":"규칙을 집단원과 함께 만들면 주인의식과 준수 가능성이 높아진다. 특히 권위에 민감한 청소년 집단에서 일방적 통보는 저항을 유발한다."},{"id":"gr-026","topic":"구조화 집단","q":"구조화 집단(structured group)의 특징으로 옳은 것은?","choices":["집단원의 자발적 주제 선택이 중심이 된다","지금-여기의 상호작용에 따라 내용이 전개된다","회기별 목표와 활동이 사전에 계획되어 있다","상담자의 개입이 최소화된다","장기간의 성격 재구성을 목표로 한다"],"answer":2,"explain":"구조화 집단은 프로그램이 사전에 설계되어 있어 목표 달성이 명확하고 초보 지도자도 운영하기 쉬우며 단기간에 효율적이다. 다만 집단 고유의 역동을 유연하게 다루기 어렵다는 한계가 있다."},{"id":"gr-027","topic":"집단 크기","q":"청소년 집단상담의 구성에 관한 일반적 권고로 가장 적절한 것은?","choices":["집단 크기가 클수록 개별 참여 기회가 늘어난다","집단 크기는 효과와 무관하다","집단이 지나치게 작으면 상호작용의 다양성이 줄어든다","30명 이상일 때 응집력이 가장 높다","집단원 수가 많을수록 상담자의 관리가 쉬워진다"],"answer":2,"explain":"집단이 너무 작으면 상호작용의 다양성과 피드백의 폭이 줄고 부담이 커지며, 너무 크면 개별 참여 기회와 안전감이 줄어든다. 일반적으로 청소년 상담집단은 6~10명 내외를 권한다."},{"id":"gr-028","topic":"공동지도자","q":"집단상담에서 공동지도자(co-leader) 체제의 장점으로 가장 거리가 먼 것은?","choices":["집단 과정을 다각도로 관찰할 수 있다","지도자 간 상호 피드백과 슈퍼비전이 가능하다","지도자 간 의견 차이가 집단에 그대로 노출되어도 무방하다","집단원에게 협력적 관계의 모델을 보여 준다","역할을 분담해 위기 상황에 대응하기 쉽다"],"answer":2,"explain":"공동지도자 간 갈등이나 경쟁이 조율되지 않은 채 집단에 노출되면 집단원이 혼란을 겪고 편 가르기가 일어난다. 사전 협의와 회기 후 논의를 통해 역할과 방향을 맞추는 것이 필수다."},{"id":"gr-029","topic":"집단 평가","q":"집단상담의 효과를 평가하는 방법으로 가장 거리가 먼 것은?","choices":["사전-사후 표준화 검사 점수의 비교","집단원의 자기보고식 만족도 및 변화 평정","상담자의 주관적 인상만으로 내리는 총평","집단 종결 후 일정 기간이 지난 시점의 추수 평가","회기별 상담자의 관찰 기록"],"answer":2,"explain":"상담자의 인상만으로 효과를 판단하면 확증편향에 취약하다. 다양한 자료원(표준화 검사, 자기보고, 관찰, 추수 평가)을 함께 사용해 평가해야 한다."},{"id":"gr-030","topic":"종합","q":"집단상담이 개인상담에 비해 갖는 상대적 강점으로 가장 적절한 것은?","choices":["내담자의 개별 문제를 더 심층적으로 다룰 수 있다","비밀보장을 더 확실하게 할 수 있다","실생활과 유사한 대인관계 상황에서 학습이 일어난다","위기 상황에 더 신속하게 개입할 수 있다","상담자가 내담자를 더 면밀히 통제할 수 있다"],"answer":2,"explain":"집단은 축소된 사회로서 대인관계 패턴이 지금-여기에서 재현되고 즉각적 피드백을 통해 수정될 수 있다는 점이 가장 큰 강점이다. 심층성, 비밀보장, 위기 대응은 개인상담이 유리하다."},{"id":"gr-031","topic":"치료적 요인","q":"집단 초기에 구성원이 \"내 문제가 나만의 것이 아니구나\"를 깨달으면서 고립감이 줄어드는 치료적 요인은?","choices":["이타심","희망의 주입","보편성","정화","실존적 요인"],"answer":2,"explain":"보편성(universality)은 자신의 고민이 특별하거나 수치스러운 것이 아니라 많은 사람이 겪는 것임을 알게 되는 경험이다. 집단 초기에 특히 강하게 작용하며 고립감과 낙인감을 줄인다."},{"id":"gr-032","topic":"치료적 요인","q":"Yalom의 치료적 요인 중 이타심(altruism)에 해당하는 것은?","choices":["지도자가 제공하는 정보를 통해 문제를 이해하게 된다","다른 집단원을 돕는 경험을 통해 자신의 가치를 확인한다","먼저 회복한 집단원을 보며 나도 나아질 수 있다고 믿는다","억압된 감정을 표출하면서 후련함을 느낀다","집단을 원가족처럼 경험하며 과거 관계를 재현한다"],"answer":1,"explain":"이타심은 남을 돕는 과정에서 자신이 쓸모 있는 존재임을 확인하는 요인이다. 3번은 희망의 주입, 4번은 정화, 5번은 초기 가족관계의 교정적 재현에 해당한다."},{"id":"gr-033","topic":"집단 응집력","q":"집단 응집력에 관한 설명으로 옳지 않은 것은?","choices":["개인상담의 치료적 관계에 대응하는 개념이다","다른 치료적 요인들이 작동하기 위한 기반이 된다","응집력이 높은 집단에서는 갈등이 나타나지 않는다","응집력이 높으면 집단원이 위험을 감수하고 자기개방을 하기 쉬워진다","출석률과 중도 탈락률에 영향을 준다"],"answer":2,"explain":"응집력이 높다고 갈등이 없어지는 것이 아니다. 오히려 응집력이 충분해야 집단원이 갈등을 회피하지 않고 꺼내어 다룰 수 있다. 갈등의 부재는 응집이 아니라 표면적 화합이거나 저항일 수 있다."},{"id":"gr-034","topic":"발달단계","q":"집단 초기(참여)단계에서 지도자의 과제로 가장 적절한 것은?","choices":["집단원 간 깊은 직면을 촉진한다","집단 규범을 정하고 구조를 제공하며 신뢰 분위기를 만든다","각자의 변화를 일상으로 전이할 계획을 세운다","저항과 지도자에 대한 도전을 적극적으로 다룬다","미해결 과제를 마무리하고 이별 감정을 다룬다"],"answer":1,"explain":"초기단계는 탐색과 오리엔테이션의 시기로, 지도자가 구조와 안전감을 제공하고 규범을 세우는 것이 핵심이다. 4번은 과도기, 1번은 작업단계, 3·5번은 종결단계의 과제다."},{"id":"gr-035","topic":"발달단계","q":"집단의 과도기(전환)단계에 관한 설명으로 옳은 것은?","choices":["집단원의 불안과 저항이 줄어들고 협력이 가장 활발한 시기다","학습한 것을 일상에 적용할 계획을 세우는 시기다","집단 목표를 처음 소개하고 규칙을 정하는 시기다","불안·방어·지도자에 대한 도전과 통제 다툼이 나타나는 시기다","지도자가 개입을 최소화하고 관찰만 하는 시기다"],"answer":3,"explain":"과도기는 불안, 방어, 저항, 지도자에 대한 도전, 집단원 간 힘겨루기가 표면화되는 단계다. 이 갈등을 회피하지 않고 다루어 내야 작업단계로 넘어갈 수 있다."},{"id":"gr-036","topic":"발달단계","q":"집단의 작업단계에서 나타나는 특징으로 옳지 않은 것은?","choices":["집단원이 자발적으로 깊은 수준의 자기개방을 한다","지금-여기의 상호작용에 대한 피드백이 활발하다","집단원 사이에 치료적 직면이 일어난다","집단원이 서로에게 책임을 넘기며 지도자에게 의존한다","응집력이 높아 위험을 감수하는 시도가 늘어난다"],"answer":3,"explain":"지도자 의존은 초기단계의 특징이다. 작업단계에서는 집단원이 주도권을 갖고 서로를 돕는 상호 치료자 역할을 하게 되며, 지도자의 직접 개입은 오히려 줄어든다."},{"id":"gr-037","topic":"발달단계","q":"집단 종결단계에서 지도자가 우선적으로 해야 할 일로 가장 적절한 것은?","choices":["새로운 주제를 도입해 집단의 활력을 유지한다","집단원에게 개인상담을 일괄 권유한다","집단원 간 미해결 갈등을 새로 촉발시켜 다룬다","이별에 따른 감정을 다루고 학습 내용을 일상으로 전이할 계획을 세운다","비밀보장 규칙을 종결과 함께 해제한다"],"answer":3,"explain":"종결단계의 과제는 분리·상실 감정 다루기, 집단 경험의 의미 정리, 학습의 일반화와 전이 계획, 추후 지원 안내다. 비밀보장 의무는 집단이 끝난 뒤에도 유지된다."},{"id":"gr-038","topic":"상담자 기술","q":"다음 지도자의 개입에 해당하는 기술은?\n\n\"민수 씨가 방금 말한 '아버지 앞에서 말문이 막힌다'는 경험이, 지난주에 지혜 씨가 이야기한 것과 많이 닮아 보이네요.\"","choices":["차단","해석","직면","연결짓기","요약"],"answer":3,"explain":"연결짓기(linking)는 집단원의 경험·감정 사이의 공통점을 짚어 서로를 이어 주는 기술이다. 집단원 간 상호작용과 응집력을 높이며, 지도자 중심의 대화가 집단 중심으로 옮겨 가게 한다."},{"id":"gr-039","topic":"상담자 기술","q":"집단상담에서 차단(blocking) 기술을 사용해야 하는 상황으로 가장 적절한 것은?","choices":["집단원이 자신의 감정을 깊이 탐색하고 있을 때","집단원이 서로에게 긍정적 피드백을 주고 있을 때","집단원이 침묵하며 생각을 정리하고 있을 때","한 집단원이 다른 집단원의 사생활을 캐묻고 추궁할 때","집단원이 지도자에게 불만을 표현할 때"],"answer":3,"explain":"차단은 집단원에게 해가 되는 행동(사생활 캐묻기, 험담, 공격, 지나친 조언)을 멈추게 하는 기술이다. 사람이 아니라 행동을 멈추는 것이며, 지도자에 대한 불만 표현은 오히려 다루어야 할 재료다."},{"id":"gr-040","topic":"문제 상황","q":"집단을 독점하는 집단원에 대한 지도자의 개입으로 가장 적절한 것은?","choices":["집단에서 즉시 탈퇴시킨다","말을 많이 한다는 점을 다른 집단원 앞에서 비난한다","모두가 같은 시간만 말하도록 초시계로 관리한다","행동을 제지하되 그 이면의 불안을 함께 탐색하고 다른 집단원의 반응을 끌어낸다","독점하도록 그대로 두어 스스로 지치게 한다"],"answer":3,"explain":"독점 행동은 불안이나 인정 욕구의 표현인 경우가 많다. 행동은 차단하되 인격을 공격하지 않고, 그 행동이 다른 집단원에게 어떻게 느껴지는지 지금-여기에서 다루는 것이 치료적이다."},{"id":"gr-041","topic":"문제 상황","q":"집단에서 침묵하는 집단원을 다루는 방식으로 옳지 않은 것은?","choices":["침묵의 의미가 저항, 불안, 관찰 등 여러 가지일 수 있음을 고려한다","말하도록 강요하지 않되 참여를 초대한다","침묵하는 집단원이 무엇을 관찰하고 있었는지 물어본다","발언 순서를 정해 반드시 돌아가며 말하게 한다","다른 집단원이 그 침묵을 어떻게 느끼는지 다룬다"],"answer":3,"explain":"발언을 강제하는 순번제는 자발성을 해치고 침묵의 의미를 탐색할 기회를 없앤다. 침묵은 그 자체로 다룰 재료이며, 초대는 하되 강요하지 않는 것이 원칙이다."},{"id":"gr-042","topic":"문제 상황","q":"집단에서 특정 구성원이 다른 구성원들의 공격 대상이 되는 희생양(scapegoating) 현상에 대한 지도자의 대응으로 가장 적절한 것은?","choices":["집단의 자연스러운 역동이므로 개입하지 않는다","공격한 집단원들을 집단에서 제외한다","희생양이 된 집단원에게 문제 행동을 고치라고 요구한다","공격을 즉시 차단하고, 그 현상이 집단 전체의 역동임을 다룬다","희생양이 된 집단원을 다른 집단으로 옮긴다"],"answer":3,"explain":"희생양 현상은 집단이 다루기 힘든 불안·분노를 한 사람에게 투사하는 집단 전체의 역동이다. 지도자는 공격을 보호적으로 차단하고, 왜 이 집단이 지금 한 사람에게 몰리는지를 집단 수준에서 다루어야 한다."},{"id":"gr-043","topic":"문제 상황","q":"집단 내 하위집단(subgroup)에 관한 설명으로 옳지 않은 것은?","choices":["집단 밖에서의 사적 접촉이 하위집단 형성을 촉진할 수 있다","하위집단이 형성되면 집단 전체의 응집력이 약해질 수 있다","하위집단 안에서 나눈 이야기가 집단에 공개되지 않으면 비밀이 생긴다","하위집단의 존재는 반드시 은폐하고 다루지 않는 것이 좋다","지도자는 하위집단 문제를 집단 전체의 주제로 꺼내어 다룰 수 있다"],"answer":3,"explain":"하위집단은 숨길수록 집단의 신뢰를 갉아먹는다. 지도자는 이를 공개적으로, 비난이 아닌 탐색의 태도로 다루어야 한다. 집단 밖 접촉에 대한 규범을 초기에 합의해 두는 것이 예방책이다."},{"id":"gr-044","topic":"문제 상황","q":"집단에서 나타나는 저항에 대한 이해로 가장 적절한 것은?","choices":["저항은 집단을 방해하는 것이므로 신속히 제거해야 한다","저항은 지도자의 역량 부족을 뜻하므로 지도자를 교체해야 한다","저항하는 집단원은 집단상담에 부적합하므로 개인상담으로 의뢰한다","저항은 변화에 따르는 불안의 표현이므로 존중하며 탐색할 대상이다","저항은 작업단계에서만 나타난다"],"answer":3,"explain":"저항은 자기를 보호하려는 자연스러운 반응이며, 특히 과도기단계에서 두드러진다. 없애야 할 장애물이 아니라 그 사람의 대인관계 방식이 드러나는 치료적 재료로 다루는 것이 원칙이다."},{"id":"gr-045","topic":"집단 윤리","q":"집단상담에서 비밀보장에 관한 설명으로 옳은 것은?","choices":["지도자만 비밀보장 의무를 지며 집단원에게는 해당하지 않는다","지도자는 집단원의 비밀 누설을 법적으로 완전히 막을 수 있다","집단이 종결되면 비밀보장 의무도 함께 종료된다","비밀보장의 한계를 첫 회기에 알리고, 집단원 간 비밀유지를 합의해야 한다","미성년자 집단에서는 모든 내용을 보호자에게 알려야 한다"],"answer":3,"explain":"집단상담의 구조적 한계는 지도자가 집단원의 비밀 준수를 강제할 수 없다는 점이다. 따라서 첫 회기에 비밀보장의 중요성과 그 한계를 분명히 알리고 집단원 간 합의를 이끌어 내야 한다. 의무는 종결 후에도 지속된다."},{"id":"gr-046","topic":"집단 윤리","q":"집단상담의 사전 동의(informed consent)에 포함되어야 할 내용으로 보기 어려운 것은?","choices":["집단의 목표와 진행 방식, 기간","지도자의 자격과 이론적 접근","집단 참여에 따르는 심리적 위험","다른 집단원의 진단명과 개인사","중도에 집단을 떠날 권리"],"answer":3,"explain":"다른 집단원의 개인정보는 사전 동의의 대상이 아니라 오히려 보호되어야 할 정보다. 사전 동의에는 목표·절차·기간·비용, 지도자의 자격, 예상되는 이익과 위험, 비밀보장의 한계, 자발적 참여와 탈퇴권이 포함된다."},{"id":"gr-047","topic":"집단 윤리","q":"청소년 집단상담에서 지도자의 윤리적 행동으로 가장 적절한 것은?","choices":["집단원 중 한 명과 개인적으로 SNS 친구를 맺고 따로 연락한다","집단에서 나온 흥미로운 사례를 이름만 바꿔 SNS에 공유한다","집단원의 자해 위험을 알게 되어 보호자와 관련 기관에 알린다","집단원이 원하면 상담료를 받지 않는 대신 사적인 부탁을 들어 준다","참여를 꺼리는 청소년을 설득해 부모 동의만으로 참여시킨다"],"answer":2,"explain":"자·타해 위험은 비밀보장의 예외로, 보호와 통지 의무가 우선한다. 1·4번은 이중관계, 2번은 비밀보장 위반, 5번은 미성년자라도 본인의 참여 의사(동의)를 존중해야 한다는 원칙에 어긋난다."},{"id":"gr-048","topic":"집단원 선발","q":"집단상담에 부적합한 대상으로 보기 어려운 것은?","choices":["급성 정신증 상태로 현실 검증력이 손상된 사람","심한 자살 위기 상태에 있는 사람","타인에 대한 공격성 통제가 어려운 사람","집단 상황에서 극심한 편집적 반응을 보이는 사람","대인관계에서 위축되어 있으나 변화 동기가 있는 사람"],"answer":4,"explain":"대인관계 위축은 오히려 집단상담이 가장 잘 도울 수 있는 문제다. 급성 정신증, 급박한 자살 위기, 통제되지 않는 공격성, 심한 편집 성향은 집단 진행을 위협하고 본인에게도 도움이 되지 않아 개인 개입이 우선된다."},{"id":"gr-049","topic":"공동지도자","q":"공동지도자(co-leader) 체제의 장점으로 보기 어려운 것은?","choices":["한 지도자가 개입하는 동안 다른 지도자가 집단 반응을 관찰할 수 있다","두 지도자의 상호작용이 집단원에게 관계의 모델이 된다","초심 지도자의 훈련과 슈퍼비전에 유리하다","역전이나 소진의 위험을 서로 점검해 줄 수 있다","지도자 간 의견이 달라도 집단 앞에서 즉석에서 다투며 해결할 수 있다"],"answer":4,"explain":"공동지도자 간 갈등을 집단 앞에서 여과 없이 드러내면 집단원의 불안을 키우고 편 가르기를 유발한다. 지도자 간 이견은 회기 전후 협의 시간에 다루는 것이 원칙이며, 이를 위해 정기적 사전·사후 논의가 필수다."},{"id":"gr-050","topic":"피드백","q":"집단에서 효과적인 피드백의 조건으로 옳지 않은 것은?","choices":["사람의 성격이 아니라 구체적인 행동에 초점을 둔다","지금-여기에서 관찰한 것을 근거로 한다","받는 사람이 수용할 준비가 되었는지 고려한다","평가나 판단보다 자신의 느낌을 진술한다","가능한 한 많은 내용을 한 번에 전달한다"],"answer":4,"explain":"한 번에 많은 피드백을 쏟아 내면 방어를 유발하고 소화되지 않는다. 효과적 피드백은 구체적·기술적이고, 시의적절하며, 받는 사람의 준비도를 고려하고, 변화 가능한 행동에 초점을 둔다."},{"id":"gr-051","topic":"자기개방","q":"집단지도자의 자기개방에 관한 설명으로 가장 적절한 것은?","choices":["지도자는 어떤 경우에도 자기개방을 하지 않아야 한다","집단원과 친밀해지기 위해 개인사를 자세히 공유하는 것이 좋다","자기개방의 양이 많을수록 집단 응집력이 높아진다","지도자의 미해결 문제를 집단에서 함께 다루면 효과적이다","집단원에게 도움이 되는지를 기준으로 지금-여기의 반응 중심으로 한다"],"answer":4,"explain":"지도자의 자기개방은 집단원의 이익에 기여하는지가 판단 기준이다. 과거사 나열보다 지금-여기에서 집단원에게 느끼는 반응을 나누는 것이 더 치료적이며, 지도자 자신의 미해결 문제는 개인상담이나 슈퍼비전에서 다뤄야 한다."},{"id":"gr-052","topic":"아들러 집단","q":"아들러(Adler) 학파 집단상담의 특징으로 옳은 것은?","choices":["무의식적 충동의 해소를 일차 목표로 한다","생활양식을 탐색하고 사회적 관심과 공동체감을 기르는 데 초점을 둔다","지금-여기의 신체 감각에 대한 알아차림을 핵심으로 한다","비합리적 신념을 논박하여 제거하는 것을 주된 기법으로 한다","구성원이 원하는 것과 현재 행동을 점검하는 WDEP 절차를 사용한다"],"answer":1,"explain":"아들러 집단은 초기 기억과 가족구도를 통해 생활양식을 이해하고, 열등감을 다루며 사회적 관심(공동체감)을 발달시키는 것을 목표로 한다. 3번은 게슈탈트, 4번은 REBT, 5번은 현실치료의 특징이다."},{"id":"gr-053","topic":"게슈탈트 집단","q":"게슈탈트 집단상담에서 빈 의자 기법을 사용하는 주된 목적은?","choices":["집단원의 비합리적 신념을 논박하기 위해","집단원의 강화 계획을 수립하기 위해","집단원의 무의식을 자유연상으로 탐색하기 위해","문제의 예외 상황을 찾아 해결책을 구성하기 위해","미해결 과제와 관련된 대상에 대한 감정을 지금-여기에서 표현하고 접촉하기 위해"],"answer":4,"explain":"빈 의자 기법은 미해결 과제(unfinished business)와 연결된 대상이나 자기의 다른 측면을 눈앞에 있는 것처럼 두고 대화하게 함으로써, 억압된 감정을 지금-여기에서 알아차리고 접촉·통합하도록 돕는다."},{"id":"gr-054","topic":"현실치료 집단","q":"현실치료 집단상담의 WDEP 절차에 관한 설명으로 옳지 않은 것은?","choices":["W는 집단원이 진정으로 원하는 것을 탐색하는 단계다","D는 원하는 것을 얻기 위해 현재 하고 있는 행동을 살피는 단계다","E는 현재 행동이 원하는 것을 얻는 데 도움이 되는지 스스로 평가하는 단계다","P는 구체적이고 실행 가능한 계획을 세우는 단계다","계획이 실패하면 변명을 수용하고 계획을 철회한다"],"answer":4,"explain":"현실치료는 변명을 받아들이지 않고 처벌도 하지 않으며 포기하지도 않는다는 원칙을 갖는다. 계획이 실패하면 변명을 수용하는 대신 계획을 더 실행 가능하게 수정하고 책임을 다시 확인한다."},{"id":"gr-055","topic":"인간중심 집단","q":"인간중심(참만남) 집단에서 지도자(촉진자)의 역할로 가장 적절한 것은?","choices":["집단의 구조와 활동을 상세히 계획해 지시한다","집단원의 초기 기억을 해석해 생활양식을 알려 준다","집단원의 인지 왜곡을 찾아 교정한다","집단원의 행동에 대해 체계적으로 강화와 처벌을 적용한다","일치성·무조건적 긍정적 존중·공감을 제공하며 집단의 성장 능력을 신뢰한다"],"answer":4,"explain":"인간중심 접근에서 촉진자는 전문가로서 지시하기보다 촉진적 태도(일치성, 무조건적 긍정적 존중, 공감적 이해)를 제공한다. 집단 자체에 성장의 방향성이 있다고 보아 구조화를 최소화한다."},{"id":"gr-056","topic":"인지행동 집단","q":"인지행동적 집단상담의 특징으로 옳지 않은 것은?","choices":["구조화된 회기 계획과 명확한 목표를 사용한다","회기 사이에 과제를 부여하고 점검한다","사고·감정·행동의 연결을 다룬다","심리교육적 요소를 적극적으로 포함한다","집단원의 무의식적 갈등을 자유연상으로 탐색하는 것이 핵심이다"],"answer":4,"explain":"자유연상을 통한 무의식 탐색은 정신분석적 집단의 방법이다. 인지행동 집단은 구조화, 목표 지향성, 과제, 심리교육, 사고 기록과 행동 실험 등을 특징으로 한다."},{"id":"gr-057","topic":"해결중심 집단","q":"해결중심 집단상담에서 사용하는 질문과 그 목적의 연결이 옳지 않은 것은?","choices":["기적질문 — 문제가 해결된 상태를 구체적으로 그려 보게 한다","예외질문 — 문제가 일어나지 않았던 때를 찾아 자원을 발견한다","척도질문 — 변화의 정도를 수치로 표현해 작은 진전을 확인한다","대처질문 — 힘든 상황에서도 버텨 온 방법을 확인해 강점을 부각한다","원인질문 — 문제의 근본 원인을 과거에서 찾아 통찰을 얻게 한다"],"answer":4,"explain":"해결중심 접근은 문제의 원인 규명보다 해결의 구성에 초점을 둔다. 과거 원인 탐색은 이 접근의 핵심 질문 유형이 아니며, 예외·기적·척도·대처질문 등 미래와 자원 지향적 질문을 사용한다."},{"id":"gr-058","topic":"교류분석","q":"교류분석(TA)에서 스트로크(stroke)에 관한 설명으로 옳지 않은 것은?","choices":["존재를 인정하는 모든 자극을 의미한다","긍정적 스트로크와 부정적 스트로크로 나뉜다","조건적 스트로크는 행동에, 무조건적 스트로크는 존재 자체에 주어진다","스트로크가 전혀 없는 것보다는 부정적 스트로크라도 받는 편을 택하기도 한다","부정적 스트로크는 어떤 경우에도 주고받아서는 안 된다"],"answer":4,"explain":"부정적 스트로크도 인정의 한 형태이며, 사람은 무자극(무시)보다 부정적 자극을 선택하기도 한다. 이것이 문제 행동이 유지되는 기제 중 하나다. 목표는 부정적 스트로크의 완전한 금지가 아니라 긍정적 스트로크를 주고받는 능력을 기르는 것이다."},{"id":"gr-059","topic":"사이코드라마","q":"사이코드라마에서 주인공이 상대 역할을 직접 맡아 상대의 입장에서 말해 보게 하는 기법은?","choices":["이중자아","거울기법","미래투사","독백","역할바꾸기"],"answer":4,"explain":"역할바꾸기(role reversal)는 주인공이 상대의 자리에 서서 그 입장을 경험하게 하는 기법으로 공감과 조망 수용을 촉진한다. 이중자아는 주인공의 속마음을 대신 말해 주고, 거울기법은 다른 사람이 주인공을 연기해 객관적으로 보게 한다."},{"id":"gr-060","topic":"청소년 집단","q":"청소년 집단상담을 운영할 때 고려사항으로 옳지 않은 것은?","choices":["또래의 영향력이 크므로 집단 매체가 특히 효과적이다","발달 특성상 성인 집단보다 활동과 매체를 활용한 구조화가 도움이 된다","비밀보장의 한계와 보호자 고지 범위를 미리 명확히 안내한다","자발적 참여 동기가 낮은 경우가 많아 초기 관계 형성에 더 공을 들여야 한다","집단 크기는 성인 집단보다 크게 구성해 다양한 상호작용을 유도한다"],"answer":4,"explain":"청소년은 주의 집중 시간과 자기조절 능력을 고려해 성인 집단보다 작게(대략 6~8명 내외) 구성하는 것이 일반적이다. 집단이 커지면 통제가 어렵고 소외되는 구성원이 생기기 쉽다."}]},"index":{"exam":{"title":"청소년상담사 2급 필기","date":"2026-09-19","dateNote":"시험일은 설정에서 바꿀 수 있습니다","perSubject":25,"passSubject":40,"passAverage":60},"defaultPicks":["group","academic"],"subjects":[{"id":"counseling-theory","name":"청소년 상담의 이론과 실제","short":"상담이론","type":"required"},{"id":"research-method","name":"상담연구방법론의 기초","short":"연구방법론","type":"required"},{"id":"psych-assessment","name":"심리측정 평가의 활용","short":"심리측정","type":"required"},{"id":"abnormal","name":"이상심리","short":"이상심리","type":"required"},{"id":"career","name":"진로상담","short":"진로상담","type":"elective"},{"id":"group","name":"집단상담","short":"집단상담","type":"elective"},{"id":"family","name":"가족상담","short":"가족상담","type":"elective"},{"id":"academic","name":"학업상담","short":"학업상담","type":"elective"}]},"psych-assessment":{"id":"psych-assessment","name":"심리측정 평가의 활용","short":"심리측정","type":"required","order":3,"concepts":[{"title":"규준과 표준점수","keys":["백분위","Z점수","T점수","스테나인","편차IQ"],"body":"규준은 원점수를 해석하기 위한 비교 기준 집단의 점수 분포다. 백분위는 그 점수 미만인 사람의 비율로, 이해가 쉽지만 등간성이 없어 평균 부근에서 점수 차가 과장된다. Z점수는 평균 0·표준편차 1, T점수는 평균 50·표준편차 10, 편차IQ는 평균 100·표준편차 15, 스테나인은 평균 5·표준편차 2인 9등급 점수다. Z=+1이면 T=60, 백분위 약 84에 해당한다."},{"title":"문항분석","keys":["문항난이도","문항변별도","오답 매력도"],"body":"문항난이도(P)는 정답률로, 값이 클수록 쉬운 문항이다. 일반적으로 .30~.70이 적절하며 평균 .50 부근에서 변별력이 최대가 된다. 문항변별도는 상위집단과 하위집단의 정답률 차이 또는 문항-총점 상관으로, 높을수록 능력을 잘 구분한다. 변별도가 음수인 문항은 정답 오류나 문항 결함을 의심해야 한다."},{"title":"검사의 분류","keys":["규준참조·준거참조","속도·역량","객관·투사"],"body":"규준참조검사는 상대적 위치를, 준거참조검사는 설정된 기준의 도달 여부를 본다. 속도검사는 시간 제한이 핵심이고 역량(능력)검사는 문항 난이도가 핵심이다. 객관적 검사(자기보고식)는 실시·채점이 표준화되어 신뢰도가 높으나 반응 왜곡(사회적 바람직성, 묵종)에 취약하고, 투사적 검사는 모호한 자극에 대한 반응으로 무의식적 역동을 탐색하지만 신뢰도·타당도 검증이 어렵다."},{"title":"웩슬러 지능검사","keys":["K-WISC-V","5개 기본지표","전체지능지수","지표 간 편차"],"body":"K-WISC-V는 만 6세~16세 11개월을 대상으로 하며 언어이해·시공간·유동추론·작업기억·처리속도의 5개 기본지표와 전체지능지수(FSIQ)를 산출한다. 평균 100, 표준편차 15의 편차IQ를 사용한다. 지표 간 편차가 크면 FSIQ 단일 해석이 부적절하므로 지표별 강약점 프로파일을 중심으로 해석한다. 성인용은 K-WAIS-IV다."},{"title":"MMPI-2와 MMPI-A","keys":["타당도 척도","임상척도 10개","T점수 65"],"body":"MMPI-A는 만 13~18세용 청소년 규준 검사다. 타당도 척도로 무응답(?), VRIN(무선반응 비일관성), TRIN(고정반응 비일관성), F(비전형), L(부인), K(교정) 등이 있어 수검 태도를 점검한다. 임상척도는 1(Hs 건강염려) 2(D 우울) 3(Hy 히스테리) 4(Pd 반사회성) 5(Mf 남성성-여성성) 6(Pa 편집증) 7(Pt 강박) 8(Sc 조현병) 9(Ma 경조증) 0(Si 사회적 내향성)이다. 일반적으로 T점수 65 이상을 임상적으로 유의하게 본다."},{"title":"투사적 검사","keys":["로르샤흐","TAT","HTP","SCT","KFD"],"body":"로르샤흐는 10장의 잉크반점에 대한 반응을 반응영역·결정인·내용·형태질 등으로 채점한다(엑스너 종합체계). TAT는 모호한 그림에 이야기를 만들게 해 주인공의 욕구와 압력을 파악한다. HTP(집-나무-사람)와 KFD(동적 가족화)는 그림을 통해 자기상과 가족 역동을 탐색하며, SCT(문장완성검사)는 반구조화된 자극으로 실시가 간편하고 라포 형성과 면접 자료로 유용하다."},{"title":"성격 및 진로 검사","keys":["NEO 5요인","TCI","MBTI","Holland RIASEC"],"body":"NEO 성격검사는 신경증·외향성·개방성·우호성·성실성의 5요인을 측정한다. TCI는 기질(자극추구·위험회피·사회적 민감성·인내력)과 성격(자율성·연대감·자기초월)을 구분해 측정한다. MBTI는 유형론적 검사로 우열이 아닌 선호 경향을 나타내며 진단 도구로 사용해서는 안 된다. Holland의 RIASEC(실재형·탐구형·예술형·사회형·진취형·관습형)은 육각형 모형으로 개인-환경 일치도를 본다."},{"title":"심리평가의 과정과 윤리","keys":["의뢰 사유","다중 자료원","검사 사용 자격","결과 통보"],"body":"심리평가는 검사 실시가 아니라 의뢰 사유 확인 → 면접·행동관찰·검사 등 다중 자료 수집 → 통합적 해석 → 보고 및 활용의 과정이다. 검사는 자격을 갖춘 사람이 표준화된 절차로 실시해야 하며, 검사 내용의 사전 유출은 검사의 타당도를 훼손한다. 결과는 수검자가 이해할 수 있는 언어로, 낙인을 피하고 강점과 함께 전달하며, 미성년자의 경우 본인과 보호자 모두에게 적절한 수준으로 설명한다."}],"questions":[{"id":"pa-001","topic":"표준점수","q":"어떤 학생의 Z점수가 +1.0이었다. 이 학생의 T점수와 백분위로 옳게 짝지어진 것은?","choices":["T=40, 백분위 약 16","T=50, 백분위 약 50","T=60, 백분위 약 84","T=70, 백분위 약 98","T=60, 백분위 약 68"],"answer":2,"explain":"T = 50 + 10Z이므로 Z=+1이면 T=60이다. 정규분포에서 평균으로부터 +1 표준편차 아래에 약 84%가 위치하므로 백분위는 약 84다."},{"id":"pa-002","topic":"표준점수","q":"편차IQ가 115인 아동의 상대적 위치로 옳은 것은? (평균 100, 표준편차 15)","choices":["Z = +0.5, 백분위 약 69","Z = +1.0, 백분위 약 84","Z = +1.5, 백분위 약 93","Z = +2.0, 백분위 약 98","Z = +1.0, 백분위 약 68"],"answer":1,"explain":"(115-100)/15 = +1.0이므로 Z점수는 +1.0이고 백분위는 약 84다. 백분위 68은 흔한 혼동인데, 평균±1SD 사이에 약 68%가 포함된다는 것과 +1SD '이하'가 84%라는 것은 다른 진술이다."},{"id":"pa-003","topic":"규준","q":"백분위(percentile rank)에 관한 설명으로 옳지 않은 것은?","choices":["해당 점수 미만에 있는 사례의 백분율을 의미한다","일반인에게 설명하기 쉬운 장점이 있다","동간성이 없어 점수 간 산술 연산이 부적절하다","분포의 중앙 부근에서는 작은 원점수 차이가 크게 나타난다","서로 다른 검사 간 점수를 직접 더하거나 평균 낼 수 있다"],"answer":4,"explain":"백분위는 등간척도가 아니므로 가감승제나 평균 산출이 부적절하다. 검사 간 비교나 합산이 필요하면 Z, T 같은 표준점수로 변환해야 한다."},{"id":"pa-004","topic":"문항분석","q":"문항난이도(P)에 관한 설명으로 옳은 것은?","choices":["값이 클수록 어려운 문항이다","값이 클수록 쉬운 문항이며 일반적으로 .30~.70이 적절하다","상위집단과 하위집단의 정답률 차이를 의미한다","0에서 100 사이의 값을 갖는다","값이 .00일 때 변별력이 가장 높다"],"answer":1,"explain":"문항난이도는 정답률이므로 값이 클수록 쉬운 문항이다. 지나치게 쉽거나 어려운 문항은 변별이 되지 않으며, 정답률 .50 부근에서 변별력이 최대가 된다. ③은 문항변별도다."},{"id":"pa-005","topic":"문항분석","q":"문항변별도가 음(-)의 값으로 산출되었을 때 가장 먼저 검토해야 할 사항은?","choices":["표본의 크기가 충분한지","정답 처리에 오류가 있거나 문항 내용에 결함이 있는지","검사 시간이 충분했는지","규준집단이 최신인지","검사의 안면타당도가 높은지"],"answer":1,"explain":"변별도가 음수라는 것은 능력이 높은 집단이 오히려 그 문항을 더 많이 틀렸다는 뜻이다. 정답 키 오류, 중의적 표현, 오답이 더 그럴듯한 문항 등 결함을 먼저 점검해야 한다."},{"id":"pa-006","topic":"검사의 분류","q":"준거참조검사(criterion-referenced test)에 관한 설명으로 옳은 것은?","choices":["수검자의 상대적 서열을 파악하는 데 목적이 있다","설정된 기준의 도달 여부를 판단하는 데 목적이 있다","점수 분포가 정규분포를 이루어야 바람직하다","규준집단의 크기가 클수록 해석이 정확해진다","문항난이도를 .50 부근으로 맞추는 것이 필수적이다"],"answer":1,"explain":"준거참조검사는 '무엇을 할 수 있는가'를 준거에 비추어 판단한다(예: 자격시험, 성취도 도달 여부). 상대적 서열과 정규분포, 규준집단은 규준참조검사의 관심사다."},{"id":"pa-007","topic":"웩슬러","q":"K-WISC-V에서 산출되는 5개 기본지표에 해당하지 않는 것은?","choices":["언어이해","시공간","유동추론","작업기억","동작성"],"answer":4,"explain":"K-WISC-V의 기본지표는 언어이해, 시공간, 유동추론, 작업기억, 처리속도다. '언어성/동작성 IQ' 구분은 구 버전(K-WISC-III 이전)의 체계이며 현행 판에서는 사용하지 않는다."},{"id":"pa-008","topic":"웩슬러","q":"지능검사 결과 지표 간 점수 차이가 매우 큰 경우의 해석 원칙으로 가장 적절한 것은?","choices":["전체지능지수(FSIQ)를 대표값으로 삼아 단일하게 해석한다","가장 높은 지표 점수를 그 아동의 잠재력으로 본다","FSIQ의 단일 해석을 유보하고 지표별 강약점을 중심으로 해석한다","가장 낮은 지표를 기준으로 지적 수준을 판정한다","검사를 무효 처리하고 재검사한다"],"answer":2,"explain":"지표 간 편차가 크면 FSIQ가 개인의 능력을 대표하지 못한다. 이 경우 전체 점수의 단일 해석을 유보하고 인지적 강점과 약점의 프로파일을 중심으로, 행동관찰·면담 자료와 통합해 해석한다."},{"id":"pa-009","topic":"지능","q":"Cattell의 지능 이론에서 유동성 지능(fluid intelligence)에 관한 설명으로 옳은 것은?","choices":["학습과 경험을 통해 축적되는 지식이다","새로운 문제에 대한 추론 능력으로 노년기에 상대적으로 빨리 감소한다","어휘력과 일반상식으로 잘 대표된다","문화적 배경의 영향을 강하게 받는다","성인기 이후에도 지속적으로 증가한다"],"answer":1,"explain":"유동성 지능은 생물학적 기반의 새로운 문제해결·추론 능력으로 청년기에 정점에 이른 뒤 감소한다. ①③④⑤는 경험과 교육으로 축적되어 노년까지 비교적 유지되는 결정성 지능(crystallized)의 특징이다."},{"id":"pa-010","topic":"MMPI","q":"MMPI-A의 타당도 척도 중 무선적·비일관적 반응을 탐지하기 위한 척도는?","choices":["L 척도","K 척도","VRIN 척도","F 척도","Si 척도"],"answer":2,"explain":"VRIN(Variable Response Inconsistency)은 내용이 유사하거나 상반된 문항쌍에 대한 반응의 일관성을 보아 무선반응을 탐지한다. TRIN은 무조건 '그렇다' 또는 '아니다'로 답하는 고정반응을 탐지한다. Si는 타당도 척도가 아니라 임상척도 0번이다."},{"id":"pa-011","topic":"MMPI","q":"MMPI-A에서 L 척도와 K 척도가 함께 높고 F 척도가 낮게 나타났을 때 우선 고려할 수검 태도는?","choices":["증상을 과장하여 보고하는 태도","무선적으로 응답한 태도","자신을 좋게 보이려는 방어적 태도","문항을 이해하지 못한 상태","심각한 정신병리의 존재"],"answer":2,"explain":"L(부인), K(교정)의 상승과 F(비전형)의 저하가 함께 나타나는 형태는 문제를 축소하고 자신을 바람직하게 보이려는 방어적 태도를 시사한다. 반대로 F가 매우 높으면 증상 과장이나 무선반응, 심각한 병리를 검토한다."},{"id":"pa-012","topic":"MMPI","q":"MMPI의 임상척도와 명칭이 잘못 짝지어진 것은?","choices":["척도 2 — 우울(D)","척도 4 — 반사회성(Pd)","척도 6 — 편집증(Pa)","척도 7 — 강박증(Pt)","척도 9 — 사회적 내향성(Si)"],"answer":4,"explain":"척도 9는 경조증(Ma)이고, 사회적 내향성(Si)은 척도 0이다."},{"id":"pa-013","topic":"투사검사","q":"투사적 검사의 특징으로 옳지 않은 것은?","choices":["모호한 자극을 사용하여 개인의 내적 역동을 드러내게 한다","수검자가 의도적으로 반응을 왜곡하기 상대적으로 어렵다","실시와 채점, 해석에 고도의 훈련이 요구된다","객관적 검사에 비해 신뢰도와 타당도 검증이 용이하다","검사자의 이론적 배경과 숙련도가 해석에 영향을 준다"],"answer":3,"explain":"투사적 검사는 반응이 자유롭고 채점이 주관적이어서 객관적 검사에 비해 신뢰도·타당도 검증이 어렵다. 이것이 투사검사의 대표적 한계다."},{"id":"pa-014","topic":"투사검사","q":"로르샤흐 검사의 실시 절차에 관한 설명으로 옳은 것은?","choices":["자유반응 단계 없이 곧바로 질문 단계를 진행한다","자유반응 단계 후 질문 단계에서 반응의 위치와 결정인을 확인한다","카드는 총 5장으로 모두 무채색이다","검사자가 먼저 모범 반응을 제시한 뒤 수검자가 답한다","반응 시간은 기록하지 않는다"],"answer":1,"explain":"로르샤흐는 자유반응(연상) 단계 후 질문(inquiry) 단계에서 '어디서 그렇게 보았는지(반응영역)', '무엇 때문에 그렇게 보았는지(결정인)'를 확인해 채점한다. 카드는 10장이며 5장은 무채색, 2장은 흑백+적색, 3장은 다색이다."},{"id":"pa-015","topic":"투사검사","q":"문장완성검사(SCT)의 특징으로 가장 적절한 것은?","choices":["완전히 비구조화된 자극을 사용한다","반구조화된 자극으로 실시가 간편하고 집단 실시가 가능하다","채점이 완전히 객관화되어 있어 해석에 훈련이 필요 없다","무의식의 심층을 로르샤흐보다 더 깊이 탐색한다","지능 수준을 평가하는 것이 주된 목적이다"],"answer":1,"explain":"SCT는 미완성 문장이라는 반구조화된 자극을 사용해 실시가 간편하고 집단 실시가 가능하며, 가족·대인관계·자기개념에 대한 태도를 비교적 의식 수준에서 폭넓게 파악할 수 있어 면접 자료로 유용하다."},{"id":"pa-016","topic":"투사검사","q":"동적 가족화(KFD)를 통해 주로 파악하려는 내용은?","choices":["아동의 지적 발달 수준","아동이 지각하는 가족 구성원 간의 관계와 역동","아동의 시지각-운동 협응 능력","아동의 학업 성취 수준","아동의 언어 발달 정도"],"answer":1,"explain":"KFD는 '가족이 무언가를 하고 있는 그림'을 그리게 하여 인물의 위치, 거리, 크기, 활동, 장벽 등을 통해 아동이 주관적으로 지각한 가족 역동과 자신의 위치를 탐색한다."},{"id":"pa-017","topic":"성격검사","q":"MBTI 결과를 해석할 때 상담자가 유의해야 할 점으로 가장 적절한 것은?","choices":["유형 간 우열을 명확히 알려 진로를 결정해 준다","선호 경향을 나타내는 것으로 병리 진단에 사용하지 않는다","T점수 65 이상을 임상적으로 유의하게 해석한다","특정 유형이 특정 직업에 반드시 적합함을 알려 준다","결과가 평생 변하지 않는 고정된 특성임을 강조한다"],"answer":1,"explain":"MBTI는 유형론에 기반한 선호 지표이며 유형 간 우열이 없고 정신병리 진단 도구가 아니다. 결과를 직업이나 능력의 확정적 근거로 제시하는 것도 오용이다."},{"id":"pa-018","topic":"성격검사","q":"TCI(기질 및 성격검사)에서 '기질' 차원에 해당하지 않는 것은?","choices":["자극추구","위험회피","사회적 민감성","인내력","자율성"],"answer":4,"explain":"TCI의 기질 차원은 자극추구, 위험회피, 사회적 민감성, 인내력의 4개이며, 성격 차원은 자율성, 연대감, 자기초월의 3개다. 기질은 유전적·생물학적 소인, 성격은 경험을 통해 발달하는 자기개념으로 구분된다."},{"id":"pa-019","topic":"성격검사","q":"NEO 성격검사에서 측정하는 5요인에 해당하지 않는 것은?","choices":["신경증","외향성","개방성","성실성","자기초월"],"answer":4,"explain":"5요인(Big Five)은 신경증, 외향성, 개방성, 우호성, 성실성이다. 자기초월은 TCI의 성격 차원이다."},{"id":"pa-020","topic":"진로검사","q":"Holland 이론에서 개인의 성격 유형과 직업 환경이 얼마나 잘 맞는지를 나타내는 개념은?","choices":["변별성","일관성","일치성","정체성","계측성"],"answer":2,"explain":"일치성(congruence)은 개인 유형과 환경 유형의 부합 정도다. 일관성은 육각형에서 인접한 유형끼리 조합된 정도, 변별성은 특정 유형이 뚜렷하게 높은 정도, 정체성은 목표와 흥미가 명확하고 안정된 정도를 뜻한다."},{"id":"pa-021","topic":"행동평가","q":"행동평가(behavioral assessment)의 특징으로 옳지 않은 것은?","choices":["표적행동을 관찰 가능하게 조작적으로 정의한다","행동의 선행사건과 결과를 함께 분석한다","행동의 빈도, 지속시간, 강도를 측정한다","행동을 내적 성격 특질의 표시(sign)로 간주한다","개입 전후의 변화를 반복 측정하여 효과를 확인한다"],"answer":3,"explain":"행동평가는 행동을 내적 특질의 간접적 '표시'가 아니라 그 자체로 의미 있는 '표본(sample)'으로 본다. 행동을 특질의 표시로 보는 것은 전통적 성격검사·투사검사의 관점이다."},{"id":"pa-022","topic":"검사 선택","q":"심리검사를 선택할 때 우선적으로 고려해야 할 사항으로 가장 거리가 먼 것은?","choices":["의뢰 사유와 평가 목적에 부합하는가","수검자의 연령과 언어 수준에 적합한 규준이 있는가","신뢰도와 타당도가 확보된 검사인가","검사자가 실시·해석 자격을 갖추고 있는가","가장 최근에 출시되어 대중에게 널리 알려진 검사인가"],"answer":4,"explain":"인지도나 출시 시기가 선택 기준이 될 수는 없다. 평가 목적 부합성, 적절한 규준, 신뢰도·타당도, 검사자의 자격이 핵심 기준이다."},{"id":"pa-023","topic":"검사 해석","q":"심리평가 결과를 청소년 내담자와 보호자에게 전달할 때 적절하지 않은 것은?","choices":["수검자가 이해할 수 있는 일상 언어로 설명한다","약점과 함께 강점 및 자원을 함께 전달한다","점수의 오차범위와 해석의 잠정성을 언급한다","진단명을 단정적으로 통보하여 경각심을 준다","결과를 앞으로의 개입 계획과 연결하여 설명한다"],"answer":3,"explain":"진단명을 단정적으로 통보하는 것은 낙인 효과를 낳고 협력적 관계를 해친다. 검사 점수는 오차를 포함한 잠정적 추정치이므로 다른 자료와 통합해 조심스럽게 전달해야 한다."},{"id":"pa-024","topic":"측정오차","q":"측정의 표준오차(SEM)에 관한 설명으로 옳은 것은?","choices":["신뢰도가 높을수록 커진다","개인의 진점수가 위치할 신뢰구간을 추정하는 데 사용된다","타당도가 높을수록 커진다","표본 크기가 클수록 반드시 작아진다","규준집단의 평균과 동일한 값이다"],"answer":1,"explain":"SEM은 관찰점수가 진점수 주변에 흩어지는 정도로, 신뢰도가 높을수록 작아진다. 이를 이용해 '이 아동의 지능지수는 95% 신뢰구간에서 98~110'과 같은 구간 추정을 한다."},{"id":"pa-025","topic":"검사 윤리","q":"심리검사의 윤리적 사용에 관한 설명으로 옳지 않은 것은?","choices":["검사 문항과 정답은 외부에 공개하지 않는다","검사 자격을 갖춘 사람이 표준화된 절차로 실시한다","수검자에게 검사의 목적과 결과의 사용 범위를 알린다","검사 결과는 수검자의 동의 없이 제3자에게 제공하지 않는다","수검자가 원하면 사전에 문항을 연습시켜 점수를 높여 준다"],"answer":4,"explain":"사전 연습이나 문항 노출은 검사의 타당도를 훼손하는 심각한 오용이다. 검사 보안 유지는 검사 사용자의 기본 책무다."},{"id":"pa-026","topic":"발달검사","q":"K-CBCL(아동·청소년 행동평가척도)에 관한 설명으로 옳은 것은?","choices":["아동이 직접 자신의 지능을 평가하는 검사이다","부모 등 주 양육자가 아동의 문제행동을 평정하는 척도이다","투사적 자극에 대한 반응을 채점하는 검사이다","학업 성취 수준을 측정하는 표준화 학력검사이다","신경심리학적 뇌 손상을 판별하는 검사이다"],"answer":1,"explain":"CBCL은 보호자가 아동·청소년의 문제행동을 평정하는 도구로, 내재화 문제(위축, 신체증상, 불안/우울)와 외현화 문제(규칙위반, 공격행동) 등의 척도를 산출한다. 교사용(TRF), 청소년 자기보고용(YSR)이 함께 있다."},{"id":"pa-027","topic":"검사 실시","q":"심리검사 실시의 표준화가 중요한 이유로 가장 적절한 것은?","choices":["검사 시간을 단축할 수 있기 때문이다","규준과의 비교가 의미를 가지려면 실시 조건이 동일해야 하기 때문이다","수검자의 불안을 없앨 수 있기 때문이다","검사자의 주관적 판단을 배제할 수 있기 때문이다","검사 비용을 절감할 수 있기 때문이다"],"answer":1,"explain":"규준은 특정한 표준 조건에서 수집된 자료다. 지시문, 시간 제한, 환경이 달라지면 산출된 점수를 그 규준에 비추어 해석할 근거가 사라진다."},{"id":"pa-028","topic":"타당도","q":"대학 입학 후의 학업 성취를 얼마나 잘 예측하는지로 수능 성적의 타당도를 평가하였다. 이때 확인한 타당도는?","choices":["내용타당도","안면타당도","예측타당도","공인타당도","변별타당도"],"answer":2,"explain":"검사 시행 후 일정 기간이 지난 뒤의 준거 수행을 얼마나 잘 예측하는지를 보는 것은 예측타당도다. 준거 자료를 검사와 거의 동시에 수집하면 공인(동시)타당도다."},{"id":"pa-029","topic":"종합","q":"심리평가(psychological assessment)와 심리검사(psychological testing)의 관계에 관한 설명으로 가장 적절한 것은?","choices":["두 용어는 완전히 동일한 의미이다","심리검사는 심리평가에 포함되는 자료 수집 방법의 하나이다","심리평가는 심리검사의 채점 절차를 가리킨다","심리검사가 심리평가보다 더 포괄적인 개념이다","심리평가는 투사검사만을 사용하는 절차이다"],"answer":1,"explain":"심리평가는 의뢰 사유 확인, 면담, 행동관찰, 검사, 기존 기록 검토 등 다양한 자료를 통합해 임상적 판단을 내리는 전체 과정이며, 심리검사는 그중 하나의 자료 수집 방법이다."},{"id":"pa-030","topic":"종합","q":"심리검사 결과 해석 시 나타날 수 있는 오류로 가장 거리가 먼 것은?","choices":["단일 검사 점수만으로 성급하게 결론을 내린다","누구에게나 해당되는 모호한 기술을 개인에게 딱 맞는 것으로 받아들인다","규준집단과 수검자의 특성이 다른데도 그대로 비교한다","검사 점수를 오차가 없는 확정적 값으로 취급한다","면담과 행동관찰 자료를 검사 결과와 통합하여 해석한다"],"answer":4,"explain":"다중 자료원의 통합적 해석은 오류가 아니라 심리평가의 기본 원칙이다. ②는 바넘 효과(Barnum effect)로, 해석의 타당성을 착각하게 만드는 대표적 오류다."}]},"research-method":{"id":"research-method","name":"상담연구방법론의 기초","short":"연구방법론","type":"required","order":2,"concepts":[{"title":"변인의 종류","keys":["독립·종속변인","매개변인","조절변인","혼입변인"],"body":"독립변인은 원인으로 조작·투입되는 변인, 종속변인은 그 결과로 측정되는 변인이다. 매개변인은 독립변인의 효과를 '전달'하는 변인으로 '왜'를 설명하고(X→M→Y), 조절변인은 독립변인과 종속변인의 관계 '강도나 방향'을 바꾸는 변인으로 '언제/누구에게'를 설명한다. 혼입(가외)변인은 독립변인과 함께 변하면서 결과를 오염시키는 변인으로, 무선할당·통제집단·상쇄균형화로 통제한다."},{"title":"측정의 4수준","keys":["명목·서열·등간·비율"],"body":"명목척도는 분류만 가능(성별, 지역), 서열척도는 순위는 있으나 간격이 동일하지 않음(석차, 선호순위), 등간척도는 간격이 동일하나 절대영점이 없음(온도, 지능지수, 표준점수), 비율척도는 절대영점이 있어 비율 해석이 가능함(연령, 반응시간, 소득). 등간 이상이어야 평균·표준편차 등 모수통계 적용이 적절하다."},{"title":"신뢰도와 타당도(측정)","keys":["검사-재검사","동형","반분","Cronbach α","내용·준거·구인타당도"],"body":"신뢰도는 일관성으로, 검사-재검사(안정성), 동형검사(동등성), 반분신뢰도(Spearman-Brown 교정), 내적합치도(Cronbach α, KR-20)로 추정한다. 타당도는 재고자 하는 것을 재는 정도로, 내용타당도(전문가 판단), 준거타당도(동시·예측), 구인타당도(수렴·변별, 요인분석, 다특성-다방법)가 있다. 신뢰도는 타당도의 필요조건이지 충분조건이 아니다."},{"title":"내적 타당도와 위협 요인","keys":["역사","성숙","검사효과","통계적 회귀","선발","탈락"],"body":"내적 타당도는 결과가 정말 독립변인 때문인지의 정도다. 위협 요인은 역사(외부 사건), 성숙(시간에 따른 자연 변화), 검사(사전검사 경험), 도구(측정도구·관찰자 변화), 통계적 회귀(극단 점수의 평균 회귀), 선발(집단 간 초기 차이), 탈락(차별적 중도 이탈), 선발과 다른 요인의 상호작용이다. 무선할당이 가장 강력한 통제 방법이다."},{"title":"외적 타당도","keys":["일반화 가능성","생태학적 타당도"],"body":"외적 타당도는 결과를 다른 대상·장면·시기로 일반화할 수 있는 정도다. 위협 요인은 표집의 대표성 부족, 사전검사와 처치의 상호작용, 선발과 처치의 상호작용, 실험 상황에 대한 반응(호손 효과) 등이다. 통제를 강화할수록 내적 타당도는 오르지만 외적 타당도는 낮아지는 상충 관계가 흔하다."},{"title":"표집 방법","keys":["확률표집","비확률표집"],"body":"확률표집에는 단순무선, 체계적(계통), 층화(모집단을 하위집단으로 나눈 뒤 각 층에서 표집), 군집(집락, 자연 집단 단위로 표집)이 있다. 비확률표집에는 편의, 유의(판단), 할당, 눈덩이(스노볼) 표집이 있다. 확률표집만이 표집오차 추정과 모집단 일반화를 가능하게 한다."},{"title":"실험설계","keys":["진실험","유사실험","전실험","솔로몬 4집단"],"body":"진실험설계는 무선할당·통제집단·조작을 모두 갖춘 설계(사후검사 통제집단설계, 사전-사후검사 통제집단설계, 솔로몬 4집단설계)다. 유사실험설계는 무선할당이 불가능한 경우로 이질통제집단 전후설계, 시계열설계가 있다. 전실험설계는 통제집단이나 사전검사가 없어 인과 추론이 어려운 설계(단일집단 사후검사, 단일집단 전후검사)다. 솔로몬 4집단설계는 사전검사의 효과를 분리해 낼 수 있다."},{"title":"단일사례 연구설계","keys":["AB","ABA","ABAB","다중기저선"],"body":"상담에서 개별 사례의 효과를 검증하는 설계다. A는 기저선, B는 개입기다. AB설계는 가장 단순하나 인과 추론이 약하고, ABA·ABAB(반전설계)는 개입을 철회·재도입해 인과성을 높이나 윤리적 문제가 있을 수 있다. 다중기저선설계는 철회 없이 여러 행동·대상·상황에 시차를 두고 개입해 인과성을 확인하므로 반전이 곤란한 상황에 적합하다."},{"title":"질적 연구방법","keys":["근거이론","현상학","문화기술지","사례연구","CQR","삼각검증"],"body":"근거이론은 자료에서 이론을 생성하며 개방코딩→축코딩→선택코딩의 절차를 밟는다. 현상학은 체험의 본질을 기술하며 판단중지(에포케)와 괄호치기를 사용한다. 문화기술지는 문화집단을 장기 참여관찰로 기술하고, 사례연구는 경계 지어진 체계를 심층 분석한다. 합의적 질적연구(CQR)는 복수 평정자의 합의와 감수자 검토를 거친다. 질적 연구의 신뢰성 확보 전략은 삼각검증, 연구참여자 확인(member check), 동료 검토, 두꺼운 기술, 감사 추적이다."},{"title":"가설검정과 오류","keys":["영가설","1종·2종 오류","유의수준","검정력","효과크기"],"body":"영가설(H0)은 차이·관계가 없다는 진술이다. 1종 오류(α)는 참인 영가설을 기각하는 것, 2종 오류(β)는 거짓인 영가설을 기각하지 못하는 것이다. 검정력(1-β)은 실제 효과를 탐지할 확률로 표본크기, 효과크기, 유의수준이 커질수록 높아진다. 유의수준을 엄격히 할수록 1종 오류는 줄지만 2종 오류는 늘어난다. p값은 효과의 크기를 말해 주지 않으므로 효과크기(Cohen's d, η², r)를 함께 보고해야 한다."},{"title":"주요 통계 기법의 선택","keys":["t검정","ANOVA","상관","회귀","χ²"],"body":"두 집단 평균 비교는 t검정(독립/대응), 세 집단 이상은 일원분산분석(ANOVA)이며 유의하면 사후검정(Scheffé, Tukey)을 한다. 두 개 이상의 독립변인과 상호작용은 이원분산분석, 사전점수를 통제하려면 공분산분석(ANCOVA)을 쓴다. 두 연속변인의 관계는 Pearson 상관, 예측은 회귀분석, 명목변인 간 빈도 관련성은 카이제곱 검정이다. 상관은 인과를 의미하지 않는다."},{"title":"연구윤리","keys":["IRB","사전 동의","익명성과 비밀보장","이중 게재"],"body":"인간 대상 연구는 기관생명윤리위원회(IRB)의 심의를 받는다. 참여자에게 연구 목적·절차·위험·이익·중도 철회의 자유를 알리고 자발적 동의를 받아야 하며, 미성년자는 보호자 동의와 본인의 동의(assent)를 함께 받는다. 익명성은 연구자도 신원을 모르는 것, 비밀보장은 연구자는 알지만 공개하지 않는 것이다. 표절, 위조, 변조, 부당한 저자 표시, 이중 게재는 연구부정행위다."}],"questions":[{"id":"rm-001","topic":"변인","q":"다음 연구에서 '자아존중감'에 해당하는 변인의 유형은?\n\n\"또래 지지가 높을수록 자아존중감이 높아지고, 높아진 자아존중감이 다시 학교적응을 높인다.\"","choices":["독립변인","종속변인","매개변인","조절변인","통제변인"],"answer":2,"explain":"또래 지지(X)의 효과가 자아존중감(M)을 거쳐 학교적응(Y)에 전달되는 구조이므로 매개변인이다. 조절변인이라면 또래 지지와 학교적응의 '관계 강도'를 변화시켜야 한다."},{"id":"rm-002","topic":"변인","q":"조절변인(moderator)에 관한 설명으로 옳은 것은?","choices":["독립변인의 효과가 종속변인에 전달되는 경로를 설명한다","독립변인과 종속변인의 관계 강도나 방향을 변화시킨다","독립변인과 함께 변하면서 결과를 오염시키는 변인이다","연구자가 관심이 없어 일정하게 고정시키는 변인이다","종속변인을 예측하기 위해 회귀식에 먼저 투입하는 변인이다"],"answer":1,"explain":"조절변인은 '언제, 누구에게 효과가 큰가'를 설명하며 상호작용 효과로 검증된다. ①은 매개변인, ③은 혼입변인, ④는 통제변인에 대한 설명이다."},{"id":"rm-003","topic":"측정수준","q":"다음 중 등간척도에 해당하는 것으로만 묶인 것은?","choices":["성별, 종교","석차, 선호순위","지능지수, 표준점수(T점수)","연령, 반응시간","소득, 상담 회기 수"],"answer":2,"explain":"등간척도는 간격은 동일하나 절대영점이 없다. 지능지수 0이 지능의 완전한 부재를 뜻하지 않으므로 등간척도다. ①은 명목, ②는 서열, ④·⑤는 절대영점이 있는 비율척도다."},{"id":"rm-004","topic":"신뢰도","q":"검사의 신뢰도를 높이는 방법으로 옳지 않은 것은?","choices":["동질적인 문항 수를 늘린다","문항의 변별도를 높인다","검사 실시 조건을 표준화한다","채점의 객관성을 확보한다","표본을 동질적인 집단으로만 구성한다"],"answer":4,"explain":"집단이 동질적일수록 점수의 분산이 작아져 신뢰도 계수는 오히려 낮게 추정된다. 신뢰도 계수는 집단의 이질성에 영향을 받으므로 표본의 범위가 제한되면 과소추정된다."},{"id":"rm-005","topic":"신뢰도와 타당도","q":"신뢰도와 타당도의 관계에 관한 설명으로 옳은 것은?","choices":["타당도가 높으면 신뢰도는 낮을 수 있다","신뢰도가 높으면 타당도는 반드시 높다","신뢰도는 타당도의 필요조건이지만 충분조건은 아니다","신뢰도와 타당도는 서로 독립적이어서 관련이 없다","타당도는 신뢰도의 필요조건이다"],"answer":2,"explain":"일관되게 잘못된 것을 재는 검사는 신뢰도가 높아도 타당도가 낮을 수 있다. 반대로 측정이 들쭉날쭉하면(신뢰도 낮음) 타당할 수 없다. 따라서 신뢰도는 타당도의 필요조건이다."},{"id":"rm-006","topic":"타당도","q":"새로 개발한 청소년 우울 척도가 기존의 우울 척도와는 높은 상관을, 외향성 척도와는 낮은 상관을 보였다. 이때 확인된 타당도는?","choices":["내용타당도","안면타당도","예측타당도","구인타당도","공인타당도"],"answer":3,"explain":"유사 구인과의 높은 상관(수렴타당도)과 다른 구인과의 낮은 상관(변별타당도)을 동시에 확인한 것이므로 구인(구성개념)타당도의 증거다."},{"id":"rm-007","topic":"내적 타당도","q":"다음 상황에서 위협받고 있는 내적 타당도 요인은?\n\n\"우울 점수가 가장 높은 상위 10%를 선발해 8주 프로그램을 실시한 결과 점수가 크게 낮아졌다.\"","choices":["역사","성숙","검사효과","통계적 회귀","도구화"],"answer":3,"explain":"극단적인 점수를 기준으로 선발한 집단은 프로그램 효과가 없더라도 재측정 시 평균 쪽으로 이동한다. 이것이 통계적 회귀이며, 통제집단을 두어야 프로그램 효과와 분리할 수 있다."},{"id":"rm-008","topic":"내적 타당도","q":"1년에 걸친 청소년 사회성 향상 프로그램의 효과를 단일집단 전후설계로 검증했다. 이때 가장 통제하기 어려운 내적 타당도 위협 요인은?","choices":["선발","탈락","성숙","무선할당 실패","실험자 편향"],"answer":2,"explain":"장기간 연구에서 청소년은 프로그램과 무관하게 발달적으로 성숙한다. 단일집단 설계는 이 자연적 변화와 프로그램 효과를 구분할 수 없으므로 통제집단이 필요하다."},{"id":"rm-009","topic":"실험설계","q":"솔로몬 4집단설계(Solomon four-group design)의 가장 큰 장점은?","choices":["표본 수를 크게 줄일 수 있다","사전검사가 처치에 미치는 효과를 분리해 확인할 수 있다","무선할당 없이도 인과 추론이 가능하다","종속변인을 여러 번 측정할 필요가 없다","질적 자료와 양적 자료를 통합할 수 있다"],"answer":1,"explain":"솔로몬 4집단설계는 사전검사 실시 여부와 처치 여부를 교차시킨 네 집단으로 구성되어, 사전검사의 주효과와 사전검사×처치 상호작용을 분리해 낼 수 있다. 다만 표본 수가 많이 필요하다."},{"id":"rm-010","topic":"실험설계","q":"유사실험설계(quasi-experimental design)의 핵심적 특징은?","choices":["독립변인을 조작하지 않는다","종속변인을 측정하지 않는다","연구대상을 무선으로 할당하지 않는다","통제집단을 반드시 두 개 이상 둔다","질적 분석만을 사용한다"],"answer":2,"explain":"유사실험설계는 처치는 하되 무선할당이 불가능한 경우(예: 학급 단위 프로그램)에 사용한다. 이질통제집단 전후설계, 시계열설계가 대표적이다."},{"id":"rm-011","topic":"단일사례설계","q":"반전(철회)이 윤리적으로 곤란한 개입의 효과를 검증할 때 가장 적합한 단일사례 연구설계는?","choices":["AB설계","ABA설계","ABAB설계","다중기저선설계","BAB설계"],"answer":3,"explain":"다중기저선설계는 개입을 철회하지 않고, 여러 행동·대상·상황에 시차를 두고 순차적으로 개입하여 개입 시점마다 변화가 나타나는지를 확인함으로써 인과성을 추론한다."},{"id":"rm-012","topic":"단일사례설계","q":"단일사례 연구설계에서 기저선(baseline) 자료 수집에 관한 설명으로 옳지 않은 것은?","choices":["개입 전 표적행동의 자연적 수준을 확인한다","자료가 안정적인 경향을 보일 때까지 측정하는 것이 바람직하다","개입 효과를 비교할 준거를 제공한다","표적행동은 관찰·측정 가능하게 조작적으로 정의한다","기저선이 개선 추세를 보일 때 즉시 개입하는 것이 원칙이다"],"answer":4,"explain":"기저선이 이미 개선 추세라면 개입 후 변화가 개입 때문인지 기존 추세 때문인지 구분할 수 없다. 따라서 기저선이 안정될 때까지 기다린 뒤 개입하는 것이 원칙이다."},{"id":"rm-013","topic":"표집","q":"전국 중학생을 지역별·학년별로 층으로 나눈 뒤 각 층에서 무선표집하였다. 사용된 표집 방법은?","choices":["단순무선표집","체계적 표집","층화표집","군집표집","할당표집"],"answer":2,"explain":"모집단을 동질적인 하위집단(층)으로 나눈 뒤 각 층에서 무선표집하는 것은 층화표집이다. 각 층에서 '무선'표집하지 않고 조사자가 임의로 채우면 비확률표집인 할당표집이 된다."},{"id":"rm-014","topic":"표집","q":"다음 중 확률표집에 해당하지 않는 것은?","choices":["단순무선표집","체계적 표집","층화표집","군집표집","눈덩이표집"],"answer":4,"explain":"눈덩이(스노볼)표집은 기존 참여자의 소개로 대상을 확대하는 비확률표집으로, 접근이 어려운 대상(가출청소년, 약물사용자 등) 연구에 쓰인다. 표집오차 추정과 모집단 일반화가 어렵다."},{"id":"rm-015","topic":"가설검정","q":"제1종 오류(Type I error)에 대한 설명으로 옳은 것은?","choices":["실제로 효과가 있는데 없다고 결론 내리는 오류","실제로 효과가 없는데 있다고 결론 내리는 오류","표본을 잘못 추출하여 생기는 오류","측정도구의 신뢰도가 낮아 생기는 오류","연구자의 기대가 결과에 영향을 주는 오류"],"answer":1,"explain":"제1종 오류는 참인 영가설을 기각하는 것, 즉 없는 효과를 있다고 판단하는 오류이며 그 확률이 유의수준 α다. ①은 제2종 오류(β)다."},{"id":"rm-016","topic":"가설검정","q":"통계적 검정력(statistical power)을 높이는 방법으로 옳지 않은 것은?","choices":["표본 크기를 늘린다","측정도구의 신뢰도를 높인다","유의수준을 .05에서 .01로 낮춘다","처치의 강도를 높여 효과크기를 키운다","오차분산을 줄이는 설계를 사용한다"],"answer":2,"explain":"검정력은 1-β다. 유의수준을 더 엄격하게(.05→.01) 하면 제1종 오류는 줄지만 영가설을 기각하기 어려워져 제2종 오류가 늘고 검정력은 낮아진다."},{"id":"rm-017","topic":"통계","q":"세 가지 상담 프로그램의 효과를 비교하기 위해 세 집단의 사후 평균을 검정하려 한다. 가장 적절한 분석 방법은?","choices":["독립표본 t검정","대응표본 t검정","일원분산분석","카이제곱 검정","단순회귀분석"],"answer":2,"explain":"세 집단 이상의 평균 비교는 일원분산분석(ANOVA)이 적절하다. t검정을 여러 번 반복하면 제1종 오류가 누적된다. ANOVA가 유의하면 어느 집단 간 차이인지 사후검정으로 확인한다."},{"id":"rm-018","topic":"통계","q":"사전검사 점수의 영향을 통계적으로 제거한 뒤 집단 간 사후검사 평균을 비교하려 할 때 적절한 분석은?","choices":["ANOVA","ANCOVA","MANOVA","카이제곱 검정","요인분석"],"answer":1,"explain":"공분산분석(ANCOVA)은 공변인(여기서는 사전점수)의 효과를 통제한 뒤 집단 간 차이를 검정한다. 무선할당이 어려워 집단 간 초기 차이가 있을 때 자주 사용된다."},{"id":"rm-019","topic":"통계","q":"상관계수에 관한 설명으로 옳지 않은 것은?","choices":["-1에서 +1 사이의 값을 가진다","절댓값이 클수록 관계의 강도가 강하다","두 변인 간 인과관계의 방향을 알려 준다","제3의 변인 때문에 허위상관이 나타날 수 있다","관계가 곡선적이면 Pearson 상관은 과소추정된다"],"answer":2,"explain":"상관은 공변 관계일 뿐 인과의 방향을 말해 주지 않는다. 인과 추론에는 시간적 선행성, 공변, 제3변인의 배제라는 조건이 필요하며 이는 실험설계로 확보한다."},{"id":"rm-020","topic":"통계","q":"성별(남/여)과 상담 참여 여부(참여/미참여) 간의 관련성을 검정하려 한다. 적절한 분석 방법은?","choices":["Pearson 상관분석","독립표본 t검정","일원분산분석","카이제곱 검정","중다회귀분석"],"answer":3,"explain":"두 명목변인의 빈도 교차표에서 관련성을 검정하는 방법은 카이제곱(χ²) 독립성 검정이다."},{"id":"rm-021","topic":"통계","q":"효과크기(effect size)를 함께 보고해야 하는 이유로 가장 적절한 것은?","choices":["표본 크기를 줄일 수 있기 때문에","p값만으로는 효과의 실질적 크기를 알 수 없기 때문에","제1종 오류를 완전히 제거할 수 있기 때문에","질적 연구와의 비교가 가능해지기 때문에","무선할당을 대체할 수 있기 때문에"],"answer":1,"explain":"표본이 매우 크면 실질적으로 사소한 차이도 통계적으로 유의해진다. 효과크기(Cohen's d, η², r)는 표본 크기에 상대적으로 덜 좌우되며 실질적 의미와 메타분석에서의 비교를 가능하게 한다."},{"id":"rm-022","topic":"질적 연구","q":"근거이론(grounded theory)의 코딩 절차를 순서대로 나열한 것은?","choices":["선택코딩 → 축코딩 → 개방코딩","개방코딩 → 축코딩 → 선택코딩","축코딩 → 개방코딩 → 선택코딩","개방코딩 → 선택코딩 → 축코딩","선택코딩 → 개방코딩 → 축코딩"],"answer":1,"explain":"개방코딩(자료를 개념·범주로 분해) → 축코딩(범주 간 관계를 패러다임 모형으로 연결) → 선택코딩(핵심범주를 중심으로 이론을 통합) 순이다."},{"id":"rm-023","topic":"질적 연구","q":"질적 연구의 신뢰성(trustworthiness)을 확보하기 위한 전략으로 가장 거리가 먼 것은?","choices":["다양한 자료원과 방법을 사용하는 삼각검증","연구참여자에게 분석 결과를 확인받는 절차","동료 연구자의 검토와 반대 사례 탐색","연구 과정을 추적할 수 있는 감사 자료의 보관","무선표집을 통한 표본의 대표성 확보"],"answer":4,"explain":"질적 연구는 통계적 일반화가 목적이 아니므로 무선표집을 사용하지 않고, 연구 목적에 맞는 의도적(유의) 표집을 한다. 나머지는 모두 Lincoln과 Guba가 제시한 신뢰성 확보 전략이다."},{"id":"rm-024","topic":"질적 연구","q":"현상학적 연구에서 연구자가 자신의 선입견과 기존 지식을 의도적으로 유보하는 절차를 가리키는 용어는?","choices":["포화","삼각검증","판단중지(에포케)","이론적 표집","지속적 비교"],"answer":2,"explain":"판단중지(epoché) 또는 괄호치기(bracketing)는 체험의 본질에 다가가기 위해 연구자의 선이해를 유보하는 현상학의 핵심 태도다. 이론적 표집과 지속적 비교는 근거이론의 절차다."},{"id":"rm-025","topic":"연구설계","q":"동일한 대상을 여러 시점에 걸쳐 반복 측정하여 변화를 추적하는 연구 설계는?","choices":["횡단연구","종단연구","사례연구","실험연구","메타분석"],"answer":1,"explain":"종단연구는 같은 대상을 시간에 따라 반복 측정하므로 개인 내 변화와 발달 궤적을 확인할 수 있으나 비용이 크고 탈락 문제가 있다. 횡단연구는 여러 연령집단을 한 시점에 비교해 시간은 절약되나 동시대(코호트) 효과와 연령 효과가 혼입된다."},{"id":"rm-026","topic":"연구설계","q":"메타분석(meta-analysis)에 관한 설명으로 옳은 것은?","choices":["한 편의 연구를 심층적으로 재분석하는 방법이다","여러 연구의 결과를 효과크기로 변환해 통합하는 방법이다","질적 자료를 수량화하여 통계 검정하는 방법이다","연구 가설을 세우기 전에 실시하는 예비조사이다","표본을 여러 번 재추출하여 분포를 추정하는 방법이다"],"answer":1,"explain":"메타분석은 동일 주제의 개별 연구들을 공통 지표인 효과크기로 변환해 통계적으로 종합하는 방법이다. 유의한 결과만 출판되는 출판편향(서랍 속 문제)을 점검해야 한다."},{"id":"rm-027","topic":"자료수집","q":"설문 문항 작성 원칙으로 옳지 않은 것은?","choices":["한 문항에는 하나의 내용만 묻는다","이중부정이나 모호한 표현을 피한다","응답자가 이해할 수 있는 용어를 사용한다","특정 응답을 암시하는 유도 문항을 피한다","민감한 문항은 응답률을 높이기 위해 설문 맨 앞에 배치한다"],"answer":4,"explain":"민감한 문항을 앞에 두면 방어가 일어나 응답 거부나 중단이 늘어난다. 라포가 형성된 뒤인 후반부에 배치하는 것이 원칙이며, 인구통계학적 문항도 보통 뒤쪽에 둔다."},{"id":"rm-028","topic":"관찰법","q":"관찰법에서 관찰자의 편향을 줄이기 위한 방법으로 가장 거리가 먼 것은?","choices":["행동을 조작적으로 정의한다","관찰자 간 일치도를 산출한다","관찰자를 사전에 훈련한다","관찰자에게 연구가설을 상세히 알려 준다","구조화된 관찰 기록지를 사용한다"],"answer":3,"explain":"관찰자가 가설을 알면 기대에 맞는 방향으로 관찰·기록할 위험(기대 효과)이 커진다. 가능하면 가설을 모르는 관찰자를 쓰는 맹목(blind) 절차가 바람직하다."},{"id":"rm-029","topic":"연구윤리","q":"미성년 청소년을 대상으로 연구를 수행할 때의 윤리적 요건으로 옳지 않은 것은?","choices":["보호자의 동의와 청소년 본인의 동의를 함께 받는다","연구 목적과 절차, 예상되는 위험을 알기 쉽게 설명한다","언제든 불이익 없이 중도 철회할 수 있음을 알린다","수집한 자료의 익명성 또는 비밀보장 방안을 마련한다","보호자가 동의했다면 본인이 거부해도 참여시킬 수 있다"],"answer":4,"explain":"보호자의 동의가 있어도 미성년자 본인의 거부 의사는 존중되어야 한다. 참여의 자발성은 연구윤리의 기본 원칙이다."},{"id":"rm-030","topic":"연구윤리","q":"다음 중 연구부정행위에 해당하지 않는 것은?","choices":["존재하지 않는 자료를 만들어 내는 것","연구 자료를 임의로 수정하여 결과를 왜곡하는 것","타인의 아이디어나 문장을 출처 없이 사용하는 것","연구에 기여하지 않은 사람을 저자로 표시하는 것","연구 결과가 가설과 다를 때 그대로 보고하는 것"],"answer":4,"explain":"가설과 다른 결과를 있는 그대로 보고하는 것은 정직한 연구 수행이다. ①은 위조, ②는 변조, ③은 표절, ④는 부당한 저자 표시로 모두 연구부정행위다."}]}};
(function () {
  var real = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var m = /(?:^|\/)data\/([\w-]+)\.json(?:[?#]|$)/.exec(url);
    if (m && Object.prototype.hasOwnProperty.call(window.__EXAM_DATA__, m[1])) {
      return Promise.resolve(new Response(JSON.stringify(window.__EXAM_DATA__[m[1]]), {
        status: 200,
        headers: { 'Content-Type': 'application/json' }
      }));
    }
    if (!real) return Promise.reject(new Error('네트워크를 쓸 수 없습니다: ' + url));
    return real(input, init);
  };
})();
