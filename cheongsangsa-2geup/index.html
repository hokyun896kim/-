<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청소년상담사 2급 문제은행</title>
<meta name="description" content="청소년상담사 2급 필기 8과목 문제은행 · 개념정리 · 실전모의 · 오답노트">
<meta name="theme-color" content="#14161a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<style>
/* 청소년상담사 2급 문제은행 — 모바일 우선 스타일
 *
 * 색: 따뜻한 종이 바탕 + 차가운 잉크 강조.
 *     빨강·주황은 과락 경고라는 실제 기능을 지고 있으므로, 강조색은
 *     차가운 쪽으로 비켜 두어 경고와 경쟁하지 않게 한다.
 * 글자: 한글 웹폰트는 CSP에 막히고 파일에 심으면 용량이 크게 늘어난다.
 *     글꼴을 바꾸는 대신 크기·굵기 대비로 위계를 만든다.
 */

:root {
  /* 종이 — 회색이 아니라 미묘하게 따뜻한 쪽으로 치우친 중성색 */
  --bg: #f3f0eb;
  --surface: #fffdfa;
  --surface-2: #ebe6de;
  --text: #1a1714;
  --text-dim: #57514a;
  --text-mute: #8b837a;
  --line: #ddd6cb;
  --line-soft: #e8e2d8;

  /* 잉크 — 브랜드 파랑이 아니라 잉크로 읽히도록 깊고 채도를 낮춘 청색 */
  --accent: #1d4a6b;
  --accent-ink: #163a55;
  --accent-soft: #e2ebf1;
  --on-accent: #fffdfa;

  /* 의미색 — 종이 위에서 소리치지 않도록 채도를 낮춘다 */
  --ok: #2c6b4f;
  --ok-soft: #e0ecdf;
  --bad: #9c3a30;
  --bad-soft: #f6e3df;
  --warn: #8a6410;
  --warn-soft: #f7ecd8;

  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(40,30,20,.05), 0 8px 24px -12px rgba(40,30,20,.16);
  --shadow-lift: 0 2px 4px rgba(40,30,20,.06), 0 14px 34px -14px rgba(40,30,20,.22);
}

/* 어두운 테마는 밝은 테마의 반전이 아니라 별도로 맞춘 값이다. */
:root[data-theme="dark"], html[data-theme="dark"] {
  --bg: #14151a;
  --surface: #1c1e25;
  --surface-2: #262932;
  --text: #ece9e4;
  --text-dim: #a8a49d;
  --text-mute: #7d7972;
  --line: #32353f;
  --line-soft: #282b33;

  --accent: #7fa8cf;
  --accent-ink: #a3c3e0;
  --accent-soft: #1e2937;
  --on-accent: #12141a;

  --ok: #6bbf92;
  --ok-soft: #17281f;
  --bad: #e08379;
  --bad-soft: #2e1b18;
  --warn: #d4a45e;
  --warn-soft: #2b2316;

  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 14px 34px -14px rgba(0,0,0,.7);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14151a;
    --surface: #1c1e25;
    --surface-2: #262932;
    --text: #ece9e4;
    --text-dim: #a8a49d;
    --text-mute: #7d7972;
    --line: #32353f;
    --line-soft: #282b33;

    --accent: #7fa8cf;
    --accent-ink: #a3c3e0;
    --accent-soft: #1e2937;
    --on-accent: #12141a;

    --ok: #6bbf92;
    --ok-soft: #17281f;
    --bad: #e08379;
    --bad-soft: #2e1b18;
    --warn: #d4a45e;
    --warn-soft: #2b2316;

    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 14px 34px -14px rgba(0,0,0,.7);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
    "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}

button { font: inherit; color: inherit; cursor: pointer; }

/* 키보드 사용자에게만 초점 링을 보여 준다. */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- 상단바 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 11px 16px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
.brand {
  display: flex; align-items: center; gap: 9px;
  background: none; border: 0; padding: 0; font-weight: 700; letter-spacing: -.015em;
}
.brand-mark {
  background: var(--accent); color: var(--on-accent);
  font-size: .7rem; font-weight: 800;
  padding: 3px 7px; border-radius: 6px; letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
}
.brand-text { font-size: .97rem; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.dday {
  font-size: .75rem; font-weight: 750; color: var(--warn);
  background: var(--warn-soft);
  border: 1px solid color-mix(in srgb, var(--warn) 22%, transparent);
  padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  font-variant-numeric: tabular-nums; letter-spacing: .01em;
}
.icon-btn {
  background: var(--surface); border: 1px solid var(--line);
  width: 34px; height: 34px; border-radius: 10px; font-size: .95rem; line-height: 1;
  color: var(--text-dim);
  transition: border-color .18s ease, color .18s ease;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- 탭바 ---------- */
/* 밑줄 대신 알약 모양으로 현재 위치를 표시한다. 손가락으로 쓰는 화면에서
   더 크고 분명한 표적이 된다. */
.tabbar {
  position: sticky; top: 57px; z-index: 29;
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 3px; padding: 7px 10px 9px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
.tab {
  background: none; border: 0; padding: 8px 2px;
  font-size: .84rem; font-weight: 650; color: var(--text-mute);
  border-radius: 9px;
  transition: background-color .18s ease, color .18s ease;
}
.tab:hover { color: var(--text-dim); }
.tab.active { color: var(--on-accent); background: var(--accent); }

/* ---------- 레이아웃 ---------- */
main { max-width: 760px; margin: 0 auto; padding: 18px 16px 44px; }
.loading { padding: 64px 0; text-align: center; color: var(--text-mute); }

.card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  margin-bottom: 14px;
}

h2 { font-size: 1.08rem; margin: 0 0 5px; letter-spacing: -.02em; text-wrap: balance; }
h3 { font-size: .95rem; margin: 0 0 6px; letter-spacing: -.01em; }
.sub { color: var(--text-dim); font-size: .87rem; margin: 0 0 15px; }
.muted { color: var(--text-mute); }

/* 작은 라벨은 자간을 벌려 본문과 역할을 구분한다. */
.section-title {
  font-size: .72rem; font-weight: 750; color: var(--text-mute);
  letter-spacing: .09em; margin: 26px 4px 10px;
}

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--accent); color: var(--on-accent); border: 1px solid transparent;
  padding: 12px 18px; border-radius: 11px; font-weight: 700; font-size: .92rem;
  letter-spacing: -.01em;
  transition: background-color .18s ease, transform .12s ease, border-color .18s ease;
}
.btn:hover:not(:disabled) { background: var(--accent-ink); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost {
  background: var(--surface); color: var(--text); border-color: var(--line);
}
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--accent); }
.btn.wide { width: 100%; }
.btn.sm { padding: 9px 13px; font-size: .85rem; border-radius: 9px; }
.btn-row { display: flex; gap: 9px; flex-wrap: wrap; }

/* ---------- 대시보드 ---------- */
/* 매일 처음 보는 화면이므로 공을 들이는 곳은 여기 한 군데로 한정한다. */
.hero { display: flex; align-items: baseline; gap: 11px; flex-wrap: wrap; margin-bottom: 3px; }
.hero .big {
  font-size: 2.6rem; font-weight: 800; letter-spacing: -.045em; line-height: 1.02;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}

.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 15px; }
.stat {
  background: var(--surface-2); border-radius: var(--radius-sm); padding: 11px 12px;
}
.stat .k {
  font-size: .68rem; color: var(--text-mute); font-weight: 700;
  letter-spacing: .05em; display: block; margin-bottom: 1px;
}
.stat .v {
  font-size: 1.3rem; font-weight: 800; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}

/* 과목별 정답률 — 40%(과락선)/60%(평균선) 기준선을 막대 위에 직접 긋는다. */
.subjrow { padding: 13px 0; border-top: 1px solid var(--line-soft); }
.subjrow:first-of-type { border-top: 0; padding-top: 4px; }
.subjrow-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px;
}
.subjrow-name { font-size: .92rem; font-weight: 680; letter-spacing: -.01em; }
.subjrow-meta {
  font-size: .73rem; color: var(--text-mute); white-space: nowrap; font-weight: 650;
  font-variant-numeric: tabular-nums;
  background: var(--surface-2); padding: 2px 8px; border-radius: 999px;
}

.bar {
  position: relative; height: 18px; border-radius: 9px;
  background: var(--surface-2); overflow: hidden;
}
.bar-fill {
  height: 100%; border-radius: 9px;
  transition: width .45s cubic-bezier(.22,.61,.36,1);
}
.bar-fill.danger { background: var(--bad); }
.bar-fill.warn   { background: var(--warn); }
.bar-fill.good   { background: var(--ok); }

/* 기준선은 막대를 관통해 눈금처럼 읽히도록 한다. */
.bar-mark {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: color-mix(in srgb, var(--text) 40%, transparent);
}
.bar-mark.m40 {
  background: var(--bad);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--surface) 70%, transparent);
}
.bar-mark.m60 { background: color-mix(in srgb, var(--text) 42%, transparent); }

.barlegend {
  display: flex; gap: 16px; font-size: .71rem; color: var(--text-mute);
  margin-top: 11px; font-weight: 600;
}
.barlegend i { font-style: normal; }
.barlegend .sw {
  display: inline-block; width: 2px; height: 11px; vertical-align: -1px; margin-right: 6px;
}
.sw.m40 { background: var(--bad); }
.sw.m60 { background: color-mix(in srgb, var(--text) 45%, transparent); }

/* 위험 안내 — 색만이 아니라 굵은 글자로도 상태를 알린다. */
.risk {
  margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--bad-soft);
  border: 1px solid color-mix(in srgb, var(--bad) 26%, transparent);
  border-left: 3px solid var(--bad);
  font-size: .855rem; line-height: 1.65; color: var(--text-dim);
}
.risk.ok {
  background: var(--ok-soft);
  border-color: color-mix(in srgb, var(--ok) 26%, transparent);
  border-left-color: var(--ok);
}
.risk b { font-weight: 750; color: var(--text); }

/* ---------- 과목 선택 ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--surface); border: 1px solid var(--line); color: var(--text-dim);
  padding: 9px 14px; border-radius: 999px; font-size: .85rem; font-weight: 650;
  transition: border-color .18s ease, background-color .18s ease, color .18s ease;
}
.chip:hover { border-color: var(--accent); }
.chip.on {
  background: var(--accent); border-color: var(--accent); color: var(--on-accent);
}
.chip.locked { opacity: .38; }
.chip.locked:hover { border-color: var(--line); }

.picklist { display: grid; gap: 9px; }
.pickitem {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line);
  padding: 14px 15px; border-radius: 12px;
  transition: border-color .18s ease, box-shadow .18s ease, transform .12s ease;
}
.pickitem:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.pickitem:active { transform: translateY(1px); }
/* 과목명과 부가 설명은 둘 다 span 이라 그대로 두면 한 줄에 붙는다. */
.pickitem > span:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pickitem .nm { font-weight: 680; font-size: .93rem; letter-spacing: -.01em; }
.pickitem .dt {
  font-size: .76rem; color: var(--text-mute);
  font-variant-numeric: tabular-nums;
}
.badge {
  font-size: .66rem; font-weight: 800; padding: 3px 8px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--text-mute); white-space: nowrap; letter-spacing: .04em;
}
.badge.req {
  color: var(--accent); background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 32%, transparent);
}

/* ---------- 문제 ---------- */
.qmeta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; font-size: .75rem; color: var(--text-mute); margin-bottom: 12px;
  font-variant-numeric: tabular-nums; font-weight: 650;
}
.qtopic {
  background: var(--accent-soft); color: var(--accent);
  padding: 3px 9px; border-radius: 999px; font-weight: 700;
}
.qtext {
  font-size: 1.04rem; font-weight: 640; line-height: 1.72;
  letter-spacing: -.011em;
  white-space: pre-wrap; margin-bottom: 16px; text-wrap: pretty;
}

.choices { display: grid; gap: 8px; }
.choice {
  display: flex; gap: 11px; align-items: flex-start; width: 100%; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line);
  padding: 13px 14px; border-radius: 12px; font-size: .93rem; line-height: 1.6;
  transition: border-color .16s ease, background-color .16s ease, transform .1s ease;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:active:not(:disabled) { transform: translateY(1px); }
.choice .num {
  flex: 0 0 23px; height: 23px; border-radius: 7px; background: var(--surface-2);
  display: grid; place-items: center; font-size: .75rem; font-weight: 800; color: var(--text-dim);
  margin-top: 1px; font-variant-numeric: tabular-nums;
  transition: background-color .16s ease, color .16s ease;
}
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice.picked .num { background: var(--accent); color: var(--on-accent); }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.correct .num { background: var(--ok); color: var(--surface); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .num { background: var(--bad); color: var(--surface); }
.choice:disabled { cursor: default; }

.explain {
  margin-top: 15px; padding: 14px 15px; border-radius: var(--radius-sm);
  background: var(--surface-2); border-left: 3px solid var(--accent);
  font-size: .885rem; line-height: 1.78; color: var(--text-dim);
}
.explain .lab {
  font-weight: 800; font-size: .68rem; color: var(--accent); display: block;
  margin-bottom: 4px; letter-spacing: .09em;
}
.verdict { font-weight: 800; font-size: .9rem; margin-bottom: 10px; letter-spacing: -.01em; }
.verdict.o { color: var(--ok); }
.verdict.x { color: var(--bad); }

.qnav { display: flex; gap: 9px; margin-top: 16px; }
.qnav .btn { flex: 1; }

.progressline {
  height: 4px; background: var(--surface-2); border-radius: 4px;
  overflow: hidden; margin-bottom: 16px;
}
.progressline > i {
  display: block; height: 100%; background: var(--accent); border-radius: 4px;
  transition: width .4s cubic-bezier(.22,.61,.36,1);
}

/* ---------- 실전 모드 ---------- */
.timer {
  font-variant-numeric: tabular-nums; font-weight: 800; font-size: .9rem;
  padding: 5px 11px; border-radius: 999px; background: var(--surface-2);
  letter-spacing: .01em;
}
.timer.urgent {
  background: var(--bad-soft); color: var(--bad);
  border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent);
}

.omr {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
  gap: 7px; margin-top: 4px;
}
.omr button {
  aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); font-size: .78rem; font-weight: 700; color: var(--text-mute);
  display: grid; place-items: center; padding: 0;
  font-variant-numeric: tabular-nums;
  transition: background-color .16s ease, border-color .16s ease, color .16s ease;
}
.omr button:hover { border-color: var(--accent); }
.omr button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.omr button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.omr button.o { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.omr button.x { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

.scorebox { text-align: center; padding: 10px 0 6px; }
.scorebox .pct {
  font-size: 3.4rem; font-weight: 800; letter-spacing: -.05em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.scorebox .pct.pass { color: var(--ok); }
.scorebox .pct.fail { color: var(--bad); }
.scorebox .cap { font-size: .86rem; color: var(--text-dim); }

.reviewitem { border-top: 1px solid var(--line-soft); padding: 14px 0; }
.reviewitem:first-child { border-top: 0; }
.reviewitem .rq {
  font-size: .92rem; font-weight: 640; white-space: pre-wrap; margin-bottom: 9px;
  line-height: 1.65;
}
.reviewitem .ra { font-size: .85rem; margin-bottom: 3px; }
.reviewitem .ra .k { color: var(--text-mute); font-weight: 650; }

/* ---------- 개념 ---------- */
.acc { border-top: 1px solid var(--line-soft); }
.acc:first-of-type { border-top: 0; }
.acc-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; background: none; border: 0; padding: 14px 0; text-align: left;
}
.acc-head .t { font-weight: 680; font-size: .95rem; letter-spacing: -.01em; }
.acc-head .caret {
  color: var(--text-mute); font-size: .8rem; flex: 0 0 auto;
  transition: transform .22s cubic-bezier(.22,.61,.36,1), color .18s ease;
}
.acc-head:hover .caret { color: var(--accent); }
.acc.open .acc-head .caret { transform: rotate(90deg); color: var(--accent); }
.acc-body { display: none; padding: 0 0 16px; }
.acc.open .acc-body { display: block; }
.acc-body p {
  margin: 0 0 11px; font-size: .9rem; line-height: 1.8; color: var(--text-dim);
  text-wrap: pretty;
}
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.key {
  font-size: .74rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
}

/* ---------- 빈 상태 ---------- */

<script>
window.__EXAM_DATA__ = {"abnormal":{"id":"abnormal","name":"이상심리","short":"이상심리","type":"required","order":4,"concepts":[{"title":"이상행동의 판단 기준","keys":["통계적 규준","사회문화적 규범","주관적 고통","부적응"],"body":"이상행동을 판단하는 기준은 ① 통계적 기준(평균에서 심하게 벗어남) ② 사회문화적 규범의 일탈 ③ 주관적 불편감과 고통 ④ 부적응성(직업·학업·대인관계 기능의 손상) ⑤ 위험성이다. 각 기준은 단독으로는 한계가 있어(예: 통계적으로 드문 천재성은 이상이 아님) 복수의 기준을 종합해 판단하며, 문화적 맥락을 반드시 고려해야 한다."},{"title":"이상심리의 이론적 모델","keys":["취약성-스트레스 모델","생물심리사회 모델"],"body":"취약성-스트레스(소인-스트레스) 모델은 개인이 지닌 생물학적·심리적 취약성과 환경적 스트레스가 상호작용해 장애가 발현된다고 본다. 생물심리사회 모델은 생물학적(유전, 신경전달물질), 심리적(인지, 성격, 학습), 사회적(가족, 문화, 지지체계) 요인을 통합적으로 고려한다. 어느 한 요인의 단독 설명보다 상호작용을 보는 것이 현대적 관점이다."},{"title":"신경발달장애","keys":["ADHD","자폐스펙트럼장애","지적장애","특정학습장애"],"body":"ADHD는 부주의와 과잉행동-충동성이 12세 이전에 시작되어 두 가지 이상의 장면에서 6개월 이상 나타난다. 자폐스펙트럼장애(ASD)의 핵심은 ① 사회적 의사소통과 상호작용의 지속적 결함 ② 제한적·반복적 행동·관심·활동이며 발달 초기에 나타난다. 지적장애는 지적 기능과 적응 기능의 결함으로 정의하며, 현행 DSM-5는 IQ 점수보다 적응 기능 수준으로 심각도를 규정한다. 특정학습장애는 읽기·쓰기·수학 중 특정 영역의 어려움이다."},{"title":"조현병 스펙트럼","keys":["양성증상","음성증상","6개월 기준"],"body":"조현병은 망상, 환각, 와해된 언어, 극도로 와해되거나 긴장성 행동, 음성증상 중 2개 이상(그중 하나는 앞의 세 가지 중 하나)이 1개월 이상 나타나고 전체 장해가 6개월 이상 지속될 때 진단한다. 양성증상은 망상·환각처럼 정상 기능에 더해진 증상, 음성증상은 정서적 둔마·무의욕증·무논리증·무쾌감증처럼 결여된 증상이다. 지속기간이 1~6개월이면 조현양상장애, 1개월 미만이면 단기 정신병적 장애다."},{"title":"우울 및 양극성 장애","keys":["주요우울","지속성우울","파괴적 기분조절부전","조증 vs 경조증"],"body":"주요우울삽화는 우울 기분 또는 흥미·즐거움의 상실을 포함해 5개 이상 증상이 2주 이상 지속된다. 아동·청소년에서는 우울 기분이 과민한 기분으로 나타날 수 있다. 지속성우울장애(기분저하증)는 성인 2년, 아동·청소년은 1년 이상이다. 파괴적 기분조절부전장애는 6~18세에 진단하며 심한 분노 폭발과 지속적 과민성이 특징이다. 제I형 양극성장애는 조증삽화(1주 이상, 심한 기능 손상 또는 입원)가, 제II형은 경조증삽화(4일 이상)와 주요우울삽화가 요건이다."},{"title":"불안 및 강박 관련 장애","keys":["분리불안","선택적 함구증","사회불안","공황","범불안","강박"],"body":"분리불안장애는 애착 대상과의 분리에 대한 과도한 불안으로 아동·청소년은 4주 이상 지속되어야 한다. 선택적 함구증은 말할 수 있음에도 특정 사회적 상황에서 말하지 못하는 것으로 1개월 이상(입학 후 첫 달 제외) 지속된다. 사회불안장애는 타인의 평가를 받는 상황에 대한 공포로 6개월 이상 지속된다. 공황장애는 예기치 못한 공황발작의 반복과 그에 대한 걱정·회피가 1개월 이상 이어진다. 범불안장애는 다양한 사건에 대한 과도한 걱정이 6개월 이상 지속된다. 강박장애는 DSM-5에서 불안장애가 아닌 '강박 및 관련 장애'로 독립되었다."},{"title":"외상 및 스트레스 관련 장애","keys":["PTSD","급성스트레스장애","반응성 애착장애","적응장애"],"body":"PTSD는 외상 사건 이후 침습, 회피, 인지와 기분의 부정적 변화, 각성과 반응성의 변화가 1개월 이상 지속될 때 진단한다. 증상 지속이 3일~1개월이면 급성스트레스장애다. 반응성 애착장애는 양육자에게 위안을 구하지 않는 억제된 양상, 탈억제성 사회적 유대감 장애는 낯선 사람에게 무분별하게 접근하는 양상이며 둘 다 심각한 양육 결핍이 전제된다. 적응장애는 확인 가능한 스트레스 요인 발생 3개월 이내에 증상이 나타난다."},{"title":"파괴적·충동조절 및 품행장애","keys":["적대적 반항장애","품행장애","간헐적 폭발장애"],"body":"적대적 반항장애는 분노·과민한 기분, 논쟁적·반항적 행동, 보복적 양상이 6개월 이상 지속되며 타인의 기본 권리 침해는 없다. 품행장애는 사람과 동물에 대한 공격성, 재산 파괴, 사기 또는 절도, 심각한 규칙 위반 등 타인의 기본 권리를 침해하는 행동이 12개월 이상(1개 이상은 6개월 이내) 나타난다. 10세 이전 발병이면 아동기 발병형으로 예후가 더 나쁘다. 18세 이후 지속되면 반사회성 성격장애로 진단될 수 있다."},{"title":"급식 및 섭식장애","keys":["신경성 식욕부진증","신경성 폭식증","폭식장애"],"body":"신경성 식욕부진증은 필요량에 비해 심한 음식 섭취 제한으로 현저히 낮은 체중, 체중 증가에 대한 극심한 두려움, 체형·체중에 대한 왜곡된 지각이 특징이며 제한형과 폭식·제거형으로 구분된다. 신경성 폭식증은 폭식과 보상행동(구토, 하제, 과도한 운동)이 3개월간 주 1회 이상 반복되며 체중은 정상 범위인 경우가 많다. 폭식장애는 보상행동 없이 폭식만 반복된다."},{"title":"성격장애 3군","keys":["A군 기이","B군 극적","C군 불안"],"body":"A군(기이·괴상): 편집성, 조현성(관계에 무관심), 조현형(기이한 사고·지각). B군(극적·감정적·변덕): 반사회성, 경계성(불안정한 관계·정체성·충동성), 연극성, 자기애성. C군(불안·두려움): 회피성(거절 두려움으로 회피), 의존성, 강박성. 성격장애는 청소년기 이전부터의 지속적 패턴을 요구하며, 18세 미만에게 진단할 경우 1년 이상 지속되어야 하고 반사회성 성격장애는 18세 이상에서만 진단한다."}],"questions":[{"id":"ab-001","topic":"이상의 기준","q":"이상행동의 판단 기준에 관한 설명으로 옳지 않은 것은?","choices":["통계적으로 평균에서 크게 벗어난 경우를 이상으로 볼 수 있다","사회문화적 규범에서의 일탈이 판단 기준이 될 수 있다","개인이 느끼는 주관적 고통이 판단 기준이 될 수 있다","일상적 기능의 손상 여부가 판단 기준이 될 수 있다","통계적으로 드문 특성은 모두 이상행동으로 분류된다"],"answer":4,"explain":"통계적으로 드물어도 이상이 아닌 경우가 많다(예: 매우 높은 지능, 뛰어난 예술적 재능). 어떤 기준도 단독으로는 충분하지 않으므로 여러 기준을 종합하고 문화적 맥락을 고려해야 한다."},{"id":"ab-002","topic":"이론 모델","q":"취약성-스트레스 모델(vulnerability-stress model)에 관한 설명으로 가장 적절한 것은?","choices":["정신장애는 전적으로 유전에 의해 결정된다","정신장애는 전적으로 환경적 스트레스에 의해 발생한다","개인의 소인과 환경적 스트레스의 상호작용으로 장애가 발현된다","스트레스가 없으면 어떤 장애도 발생하지 않는다","취약성이 높으면 스트레스와 무관하게 반드시 발병한다"],"answer":2,"explain":"동일한 스트레스를 겪어도 취약성이 낮으면 발병하지 않고, 취약성이 높아도 스트레스가 낮으면 발병하지 않을 수 있다는 상호작용 관점이다."},{"id":"ab-003","topic":"ADHD","q":"DSM-5에 따른 주의력결핍 과잉행동장애(ADHD)의 진단 요건으로 옳은 것은?","choices":["증상이 18세 이전에 시작되어야 한다","증상이 12세 이전에 나타나고 두 가지 이상의 장면에서 관찰되어야 한다","증상이 한 가지 장면에서만 나타나도 진단할 수 있다","과잉행동 증상이 반드시 포함되어야 한다","증상 지속 기간은 3개월 이상이면 충분하다"],"answer":1,"explain":"DSM-5는 발병 연령 기준을 12세 이전으로 규정하며, 증상이 가정·학교 등 두 가지 이상의 상황에서 나타나야 하고 6개월 이상 지속되어야 한다. 부주의 우세형은 과잉행동 없이도 진단 가능하다."},{"id":"ab-004","topic":"자폐스펙트럼장애","q":"DSM-5의 자폐스펙트럼장애(ASD) 핵심 진단 영역으로 옳게 묶인 것은?","choices":["사회적 의사소통의 결함, 제한적·반복적 행동 및 관심","부주의, 과잉행동-충동성","망상, 환각","지적 기능의 결함, 적응 기능의 결함","분노 폭발, 지속적 과민성"],"answer":0,"explain":"DSM-5는 이전의 3요인(사회성, 의사소통, 상동행동)을 2요인으로 통합하여, 사회적 의사소통 및 상호작용의 지속적 결함과 제한적·반복적 행동/관심/활동을 핵심 영역으로 규정한다."},{"id":"ab-005","topic":"지적장애","q":"DSM-5에서 지적장애의 심각도를 결정하는 주된 근거는?","choices":["지능지수(IQ) 점수","적응 기능의 수준","발병 연령","언어 발달 정도","동반 질환의 유무"],"answer":1,"explain":"DSM-IV까지는 IQ 구간으로 심각도를 나눴으나, DSM-5부터는 개념적·사회적·실행적 영역의 적응 기능 수준으로 심각도(경도·중등도·고도·최고도)를 규정한다. 지원의 필요 수준을 반영하기 위한 변화다."},{"id":"ab-006","topic":"조현병","q":"조현병의 음성증상에 해당하는 것으로만 묶인 것은?","choices":["망상, 환각","와해된 언어, 긴장성 행동","정서적 둔마, 무의욕증","환청, 피해망상","관계망상, 사고이탈"],"answer":2,"explain":"음성증상은 정상 기능의 결여로, 정서적 둔마(감소된 정서 표현), 무의욕증, 무언어증, 무쾌감증, 비사회성이 포함된다. 망상·환각·와해된 언어는 양성증상이다."},{"id":"ab-007","topic":"조현병","q":"정신병적 증상이 2개월간 지속되다가 완전히 회복된 경우 가장 가능성 있는 진단은?","choices":["조현병","조현양상장애","단기 정신병적 장애","조현정동장애","망상장애"],"answer":1,"explain":"지속 기간이 1개월 이상 6개월 미만이면 조현양상장애다. 1개월 미만은 단기 정신병적 장애, 6개월 이상이면 조현병으로 진단한다."},{"id":"ab-008","topic":"우울장애","q":"아동·청소년의 주요우울장애 진단에서 성인과 다르게 적용되는 사항은?","choices":["증상 지속 기간이 1주 이상이면 된다","우울 기분 대신 과민한 기분으로 나타날 수 있다","흥미 상실은 진단 기준에서 제외된다","필요한 증상의 수가 3개로 줄어든다","체중 변화는 고려하지 않는다"],"answer":1,"explain":"아동·청소년은 우울 기분이 슬픔보다 짜증과 과민성으로 표현되는 경우가 많아 DSM-5는 이를 명시한다. 또한 체중 기준에서 '기대되는 체중 증가에 미달하는 것'을 포함한다. 2주 지속 기준은 동일하다."},{"id":"ab-009","topic":"우울장애","q":"지속성 우울장애(기분저하증)로 진단하기 위한 아동·청소년의 최소 증상 지속 기간은?","choices":["2주","1개월","6개월","1년","2년"],"answer":3,"explain":"지속성 우울장애는 성인의 경우 2년 이상이지만, 아동·청소년은 1년 이상 지속되면 진단할 수 있다. 이 기간 중 증상이 없는 기간이 2개월을 넘지 않아야 한다."},{"id":"ab-010","topic":"우울장애","q":"파괴적 기분조절부전장애(DMDD)에 관한 설명으로 옳지 않은 것은?","choices":["심한 분노 폭발이 상황에 비해 과도하게 반복된다","분노 폭발 사이에도 지속적인 과민한 기분이 관찰된다","6세 이전이나 18세 이후에는 처음 진단하지 않는다","DSM-5에서 우울장애 범주에 포함된다","양극성장애로 진단되는 아동을 늘리기 위해 도입되었다"],"answer":4,"explain":"DMDD는 만성적 과민성을 보이는 아동이 소아 양극성장애로 과잉 진단되는 문제를 줄이기 위해 도입되었다. 최초 진단은 6~18세 사이에 이루어져야 하며 발병은 10세 이전이어야 한다."},{"id":"ab-011","topic":"양극성장애","q":"제I형 양극성장애와 제II형 양극성장애를 구분하는 핵심 기준은?","choices":["주요우울삽화의 유무","조증삽화의 존재 여부","환청의 유무","발병 연령","가족력의 유무"],"answer":1,"explain":"제I형은 조증삽화(최소 1주 지속, 심한 기능 손상이나 입원 필요, 정신병적 양상 가능)가 한 번이라도 있으면 진단한다. 제II형은 조증삽화 없이 경조증삽화(최소 4일)와 주요우울삽화가 있는 경우다."},{"id":"ab-012","topic":"불안장애","q":"다음 사례에 가장 부합하는 진단은?\n\n중학교 1학년 학생이 학교에서는 1년째 한마디도 하지 않지만 집에서는 가족과 자유롭게 대화한다. 언어 능력에는 문제가 없다.","choices":["자폐스펙트럼장애","선택적 함구증","사회불안장애","분리불안장애","언어장애"],"answer":1,"explain":"말할 능력이 있음에도 특정 사회적 상황에서 일관되게 말하지 못하고, 다른 상황에서는 정상적으로 말하는 것이 선택적 함구증이다. 1개월 이상(입학 후 첫 달 제외) 지속되어야 하며 DSM-5에서 불안장애에 속한다."},{"id":"ab-013","topic":"불안장애","q":"분리불안장애의 진단에서 아동·청소년에게 요구되는 최소 증상 지속 기간은?","choices":["1주","2주","4주","3개월","6개월"],"answer":2,"explain":"아동·청소년의 분리불안장애는 4주 이상, 성인은 6개월 이상 지속되어야 한다. DSM-5부터 성인에게도 진단할 수 있게 되었다."},{"id":"ab-014","topic":"불안장애","q":"공황장애에 관한 설명으로 옳은 것은?","choices":["공황발작 자체만으로 진단이 확정된다","예기치 못한 공황발작이 반복되고 이에 대한 걱정이나 회피가 1개월 이상 지속된다","반드시 광장공포증을 동반해야 한다","발작은 보통 2~3시간 지속된다","특정 대상에 대한 공포가 핵심 증상이다"],"answer":1,"explain":"공황발작은 여러 장애에서 나타날 수 있는 현상이며, 예기치 못한 발작의 반복과 '또 발작이 올까' 하는 예기불안 또는 행동 변화가 1개월 이상 지속되어야 공황장애로 진단한다. 발작은 대개 10분 내에 정점에 이르고 수십 분 내 가라앉는다."},{"id":"ab-015","topic":"불안장애","q":"범불안장애의 진단 기준으로 옳은 것은?","choices":["특정 대상에 대한 공포가 6개월 이상 지속된다","다양한 사건이나 활동에 대한 과도한 불안과 걱정이 6개월 이상 지속된다","예기치 못한 공황발작이 반복된다","강박사고와 강박행동이 반복된다","외상 사건에 대한 침습적 재경험이 나타난다"],"answer":1,"explain":"범불안장애는 걱정의 대상이 특정되지 않고 여러 영역에 걸쳐 있으며, 걱정을 통제하기 어렵고 안절부절, 피로, 집중곤란, 과민성, 근육긴장, 수면장해 중 일부를 동반한다."},{"id":"ab-016","topic":"강박장애","q":"DSM-5에서 강박장애(OCD)의 분류상 위치로 옳은 것은?","choices":["불안장애에 포함된다","'강박 및 관련 장애'라는 독립된 범주로 분류된다","신체증상 관련 장애에 포함된다","해리장애에 포함된다","충동조절장애에 포함된다"],"answer":1,"explain":"DSM-IV에서는 불안장애에 속했으나 DSM-5에서 '강박 및 관련 장애'로 독립했다. 이 범주에는 강박장애, 신체이형장애, 수집광, 발모광, 피부뜯기장애가 포함된다."},{"id":"ab-017","topic":"외상 관련 장애","q":"외상 사건 후 증상이 2주간 지속되고 있는 경우 고려할 수 있는 진단은?","choices":["외상후스트레스장애","급성스트레스장애","적응장애","지속성 우울장애","해리성 정체성 장애"],"answer":1,"explain":"외상 사건 노출 후 증상 지속 기간이 3일 이상 1개월 이내면 급성스트레스장애, 1개월을 넘어 지속되면 PTSD로 진단한다."},{"id":"ab-018","topic":"외상 관련 장애","q":"반응성 애착장애와 탈억제성 사회적 유대감 장애의 공통 전제 조건은?","choices":["지적장애의 동반","심각한 사회적 방임 등 부적절한 양육 경험","외상 사건에 대한 직접 노출","5세 이후의 발병","가족의 정신과적 병력"],"answer":1,"explain":"두 장애 모두 '병리적 양육(사회적 방임, 주 양육자의 반복적 교체, 애착 형성을 제한하는 환경)'을 진단의 전제로 요구한다. 반응성 애착장애는 위축·억제된 양상, 탈억제성 사회적 유대감 장애는 낯선 사람에 대한 무분별한 접근으로 나타난다."},{"id":"ab-019","topic":"품행장애","q":"적대적 반항장애와 품행장애를 구분하는 핵심 요소는?","choices":["증상 지속 기간의 차이","타인의 기본적 권리 침해 여부","발병 연령의 차이","가족력의 유무","지능 수준의 차이"],"answer":1,"explain":"적대적 반항장애는 권위자에 대한 반항·논쟁·분노가 중심이며 타인의 기본 권리를 침해하지 않는다. 품행장애는 공격성, 재산 파괴, 사기·절도, 심각한 규칙 위반 등 타인의 권리와 사회 규범을 침해한다."},{"id":"ab-020","topic":"품행장애","q":"품행장애의 예후에 관한 설명으로 옳은 것은?","choices":["청소년기 발병형이 아동기 발병형보다 예후가 나쁘다","아동기 발병형(10세 이전)이 예후가 더 나쁘다","발병 연령은 예후와 관련이 없다","여아의 발병률이 남아보다 높다","성인기에는 대부분 조현병으로 이행한다"],"answer":1,"explain":"10세 이전에 발병하는 아동기 발병형은 공격성이 더 심하고 지속적이며 성인기 반사회성 성격장애로 이어질 가능성이 높아 예후가 더 나쁘다."},{"id":"ab-021","topic":"섭식장애","q":"신경성 식욕부진증과 신경성 폭식증을 감별하는 데 가장 중요한 지표는?","choices":["폭식의 유무","보상행동의 유무","현저히 낮은 체중의 유무","체형에 대한 관심의 유무","발병 연령"],"answer":2,"explain":"신경성 식욕부진증에도 폭식·제거형이 있어 폭식과 보상행동만으로는 구분되지 않는다. 결정적 차이는 '현저히 낮은 체중'으로, 폭식증은 대개 정상 체중 범위를 유지한다."},{"id":"ab-022","topic":"섭식장애","q":"폭식장애(binge-eating disorder)의 특징으로 옳은 것은?","choices":["폭식 후 반드시 구토 등 보상행동이 뒤따른다","폭식이 있으나 부적절한 보상행동은 나타나지 않는다","현저히 낮은 체중이 진단의 필수 요건이다","DSM-5에서 삭제된 진단명이다","음식에 대한 관심 자체가 결여되어 있다"],"answer":1,"explain":"폭식장애는 DSM-5에서 독립 진단으로 정식 등재되었으며, 반복적 폭식은 있으나 구토·하제·과도한 운동 같은 보상행동이 없다는 점에서 신경성 폭식증과 구분된다."},{"id":"ab-023","topic":"성격장애","q":"성격장애 B군에 속하지 않는 것은?","choices":["반사회성 성격장애","경계성 성격장애","연극성 성격장애","자기애성 성격장애","조현형 성격장애"],"answer":4,"explain":"조현형 성격장애는 A군(기이하고 괴상한 군)에 속하며, A군에는 편집성·조현성·조현형이 포함된다. B군은 극적이고 감정적이며 변덕스러운 군이다."},{"id":"ab-024","topic":"성격장애","q":"다음 특징에 해당하는 성격장애는?\n\n버림받는 것에 대한 극심한 두려움, 불안정하고 강렬한 대인관계, 정체성 혼란, 충동성, 반복적인 자해 행동","choices":["편집성 성격장애","경계성 성격장애","회피성 성격장애","의존성 성격장애","강박성 성격장애"],"answer":1,"explain":"경계성 성격장애의 핵심은 대인관계·자기상·정서의 불안정성과 현저한 충동성이며, 이상화와 평가절하를 오가는 관계 패턴과 반복적 자해·자살 행동이 특징적이다."},{"id":"ab-025","topic":"성격장애","q":"회피성 성격장애와 조현성 성격장애의 감별점으로 가장 적절한 것은?","choices":["회피성은 대인관계를 원하지만 거절이 두려워 피한다","조현성은 거절에 대한 두려움 때문에 관계를 피한다","회피성은 관계 자체에 관심이 없다","조현성은 사회적 상황에서 심한 불안을 경험한다","두 장애는 모두 B군에 속한다"],"answer":0,"explain":"회피성 성격장애는 친밀한 관계를 '원하지만' 비난과 거절이 두려워 회피하는 반면, 조현성 성격장애는 사회적 관계에 대한 욕구 자체가 결여되어 있다. 회피성은 C군, 조현성은 A군이다."},{"id":"ab-026","topic":"성격장애","q":"청소년에게 성격장애를 진단할 때의 원칙으로 옳은 것은?","choices":["18세 미만에게는 어떤 성격장애도 진단할 수 없다","18세 미만이라도 1년 이상 지속되면 진단할 수 있으나 반사회성 성격장애는 예외다","반사회성 성격장애만 18세 미만에게 진단할 수 있다","지속 기간과 무관하게 언제든 진단할 수 있다","부모의 동의가 있으면 기간과 무관하게 진단할 수 있다"],"answer":1,"explain":"청소년기에는 성격이 발달 중이므로 신중해야 하나, 특징이 1년 이상 지속되고 광범위·경직되게 나타나면 진단할 수 있다. 다만 반사회성 성격장애는 18세 이상에서만 진단하며, 그 이전에는 품행장애로 진단한다."},{"id":"ab-027","topic":"물질 및 중독","q":"DSM-5의 '물질관련 및 중독 장애' 범주에 유일하게 포함된 비물질관련 장애는?","choices":["인터넷게임장애","도박장애","쇼핑중독","성중독","운동중독"],"answer":1,"explain":"DSM-5는 도박장애를 유일한 비물질관련 장애로 정식 등재했다. 인터넷게임장애는 추가 연구가 필요한 상태로 3편 부록에 제시되어 있다."},{"id":"ab-028","topic":"해리장애","q":"해리성 정체성 장애에 관한 설명으로 옳지 않은 것은?","choices":["둘 이상의 구별되는 성격 상태가 존재한다","일상적 사건에 대한 반복적인 기억 공백이 나타난다","아동기의 심각한 외상 경험과 관련되는 경우가 많다","증상이 문화적으로 용인되는 종교 관행으로 설명되어도 진단한다","정체성의 붕괴로 인해 기능의 손상이나 고통이 초래된다"],"answer":3,"explain":"널리 수용되는 문화적·종교적 관행(예: 빙의 의례)의 정상적 일부로 설명되는 경우는 진단에서 배제한다. 문화적 맥락 고려는 DSM-5 진단의 기본 원칙이다."},{"id":"ab-029","topic":"틱장애","q":"뚜렛장애(Tourette's disorder)의 진단 요건으로 옳은 것은?","choices":["운동 틱만 1년 이상 지속된다","음성 틱만 1년 이상 지속된다","여러 가지 운동 틱과 하나 이상의 음성 틱이 1년 이상 나타난다","운동 틱과 음성 틱이 4주 이상 나타난다","18세 이후에 처음 발병해야 한다"],"answer":2,"explain":"뚜렛장애는 여러 가지 운동 틱과 하나 이상의 음성 틱이 (동시에 나타나지 않아도 무방하나) 1년 이상 지속될 때 진단하며, 18세 이전에 발병한다. 한 종류만 1년 이상이면 지속성 운동/음성 틱장애다."},{"id":"ab-030","topic":"DSM-5 종합","q":"DSM-5의 특징에 관한 설명으로 옳지 않은 것은?","choices":["다축 진단체계를 폐지하였다","일부 장애에 차원적 평가 요소를 도입하였다","발달적 관점에 따라 장애의 배열 순서를 조정하였다","자폐성 장애, 아스퍼거 장애 등을 자폐스펙트럼장애로 통합하였다","장애의 원인을 특정 이론에 근거하여 명시적으로 규정하였다"],"answer":4,"explain":"DSM은 특정 병인론에 근거하지 않는 기술적·무이론적 분류체계를 지향한다. 원인이 아니라 관찰 가능한 증상의 기술을 통해 진단하는 것이 기본 입장이다."}]},"academic":{"id":"academic","name":"학업상담","short":"학업상담","type":"elective","order":8,"concepts":[{"title":"학업문제의 유형 구분","keys":["학습부진","학습지진","학습장애","미성취"],"body":"학습부진(underachievement)은 지적 능력은 정상이나 여러 요인으로 실제 성취가 기대 수준에 못 미치는 경우다. 학습지진(slow learner)은 지적 능력 자체가 경계선 수준(대략 IQ 70~85)이어서 학습 속도가 느린 경우다. 학습장애(learning disability)는 지능은 정상이나 중추신경계 기능 이상으로 읽기·쓰기·수학 등 특정 영역에서 현저한 어려움을 보이는 경우다. 미성취 영재는 높은 잠재력에 비해 성취가 낮은 경우다. 개입 방향이 전혀 다르므로 감별이 학업상담의 출발점이다."},{"title":"귀인이론","keys":["Weiner","원인 소재·안정성·통제 가능성","학습된 무기력"],"body":"Weiner는 성공과 실패의 원인을 원인의 소재(내적/외적), 안정성(안정/불안정), 통제 가능성(통제 가능/불가능)의 세 차원으로 분류했다. 능력은 내적·안정적·통제 불가능, 노력은 내적·불안정·통제 가능, 과제 난이도는 외적·안정적, 운은 외적·불안정하다. 실패를 능력 부족(내적·안정적·통제 불가)으로 귀인하면 무기력과 포기로 이어지므로, 노력이나 전략 같은 통제 가능한 요인으로 재귀인하도록 돕는 것이 개입의 핵심이다."},{"title":"자기결정성 이론","keys":["자율성·유능성·관계성","외적 조절~통합된 조절","내재동기"],"body":"Deci와 Ryan은 자율성, 유능성, 관계성이라는 세 가지 기본 심리욕구가 충족될 때 내재동기가 자란다고 보았다. 외적 동기는 하나의 덩어리가 아니라 자율성 정도에 따라 외적 조절(보상·처벌) → 부과된(주입된) 조절(죄책감·수치심 회피) → 확인된(동일시) 조절(개인적 가치 인정) → 통합된 조절의 연속선을 이룬다. 통제적 보상은 이미 있던 내재동기를 오히려 떨어뜨릴 수 있다(과잉정당화 효과)."},{"title":"성취목표 지향성","keys":["숙달목표","수행접근","수행회피"],"body":"숙달목표(학습목표)는 능력의 향상과 이해 자체를 목적으로 하며, 도전을 선택하고 실패를 정보로 활용해 깊은 학습 전략과 지속성으로 이어진다. 수행접근목표는 타인보다 유능해 보이는 것, 수행회피목표는 무능해 보이지 않는 것을 목적으로 한다. 수행회피목표는 도전 회피, 표면적 학습, 시험불안, 자기손상 전략과 강하게 연관된다. Dweck의 관점에서 능력을 고정된 것으로 보는 실체론적 신념은 수행목표를, 증진 가능하다고 보는 증가론적 신념(성장 마인드셋)은 숙달목표를 촉진한다."},{"title":"자기조절학습","keys":["인지전략","초인지전략","동기조절","행동조절"],"body":"자기조절학습은 학습자가 스스로 목표를 세우고 전략을 선택·점검·조정하는 능동적 과정으로, 계획 → 수행(점검) → 성찰(평가)의 순환으로 이루어진다. 인지전략에는 시연(반복), 정교화(기존 지식과 연결·자기 설명), 조직화(요약·도식화·위계화)가 있고, 초인지전략에는 계획, 점검(이해 여부 확인), 조절(전략 수정)이 있다. 그 밖에 동기 조절과 시간·환경 관리, 도움 구하기 같은 행동 조절이 포함된다."},{"title":"시험불안","keys":["인지적 요소(걱정)","정서적 요소(각성)","역U자 관계"],"body":"시험불안은 걱정(worry)이라는 인지적 요소와 정서성(emotionality)이라는 생리적 각성 요소로 구성되며, 수행 저하와 더 강하게 관련되는 것은 걱정 요소다. 불안과 수행은 역U자 관계로 적정 수준의 각성은 수행을 돕는다. 개입은 이완훈련과 체계적 둔감법 같은 정서적 접근, 인지 재구성과 자기대화 수정 같은 인지적 접근, 그리고 실제 학습기술 부족이 원인일 때의 학습전략 훈련을 병행한다."},{"title":"학업지연과 자기손상 전략","keys":["지연행동","self-handicapping","완벽주의"],"body":"학업지연행동은 해야 할 학습을 미루는 것으로, 실패에 대한 두려움, 완벽주의, 과제 혐오, 낮은 자기효능감, 시간관리 부족이 배경이 된다. 자기손상 전략(self-handicapping)은 실패했을 때 능력이 아닌 다른 원인을 대기 위해 미리 장애물을 만드는 것으로(시험 전날 일부러 놀기), 자존감을 방어하지만 실제 성취를 떨어뜨리는 악순환을 낳는다. 개입은 목표를 잘게 나누기, 실행 의도 형성, 자기효능감 증진, 완벽주의적 신념 다루기다."},{"title":"학업상담의 과정","keys":["다차원 평가","원인별 개입","환경 개입"],"body":"학업문제는 인지적 요인(지능, 기초학력, 학습전략), 정의적 요인(동기, 불안, 자아개념), 행동적 요인(학습시간, 습관, 주의집중), 환경적 요인(가정, 또래, 교사, 사교육)이 얽혀 있으므로 다차원적 평가가 선행되어야 한다. 성적 향상만을 목표로 삼기보다 호소 문제의 실제 원인에 맞는 개입을 설계하고, 필요시 학습장애 평가나 ADHD 감별을 위한 전문 기관 연계를 고려한다. 부모의 과도한 기대와 통제가 원인일 때는 부모상담이 병행되어야 한다."}],"questions":[{"id":"ac-001","topic":"학업문제 유형","q":"지적 능력은 정상 범위이나 실제 학업성취가 기대되는 수준에 미치지 못하는 경우를 가리키는 용어는?","choices":["학습부진","학습지진","학습장애","정신지체","학습된 무기력"],"answer":0,"explain":"학습부진(underachievement)은 잠재 능력에 비해 성취가 낮은 상태로, 동기·정서·환경·학습전략 등 다양한 원인이 있다. 학습지진은 지적 능력 자체가 경계선 수준인 경우다."},{"id":"ac-002","topic":"학업문제 유형","q":"학습장애(learning disability)의 특징으로 옳은 것은?","choices":["지능은 정상이나 특정 학습 영역에서 현저한 어려움을 보인다","전반적인 지적 능력이 평균 이하이다","학습에 대한 동기가 없는 상태를 말한다","교육 기회의 부족으로 인한 성취 저하를 말한다","일시적인 정서 문제로 성적이 떨어진 상태이다"],"answer":0,"explain":"학습장애는 전반적 지능은 정상 범위이나 중추신경계의 기능 이상으로 읽기, 쓰기, 수학 등 특정 영역에서 기대 수준에 크게 못 미치는 상태다. 시각·청각 장애나 교육 기회 결손, 정서 문제로 설명되는 경우는 배제한다."},{"id":"ac-003","topic":"귀인이론","q":"Weiner의 귀인이론에서 '능력'에 대한 귀인의 차원으로 옳게 묶인 것은?","choices":["내적 - 안정적 - 통제 불가능","내적 - 불안정 - 통제 가능","외적 - 안정적 - 통제 불가능","외적 - 불안정 - 통제 불가능","내적 - 안정적 - 통제 가능"],"answer":0,"explain":"능력은 자기 안에 있고(내적), 잘 변하지 않으며(안정적), 마음대로 바꿀 수 없다(통제 불가능)고 지각된다. 노력은 내적·불안정·통제 가능, 과제 난이도는 외적·안정적, 운은 외적·불안정하다."},{"id":"ac-004","topic":"귀인이론","q":"반복적인 실패 경험 후 \"난 원래 머리가 나빠서 해도 안 돼\"라고 말하는 학생에 대한 귀인 재훈련의 방향으로 가장 적절한 것은?","choices":["노력과 학습전략 같은 통제 가능한 요인으로 재귀인하게 한다","실패의 원인을 교사나 시험의 난이도로 돌리게 한다","실패의 원인을 운으로 돌리게 한다","실패를 인정하지 않도록 회피시킨다","능력이 부족함을 정확히 인식시켜 기대를 낮춘다"],"answer":0,"explain":"실패를 내적·안정적·통제 불가능한 능력으로 귀인하면 무기력에 빠진다. 노력이나 전략처럼 불안정하고 통제 가능한 요인으로 재귀인하면 변화 가능성을 지각하고 다시 시도하게 된다."},{"id":"ac-005","topic":"학습된 무기력","q":"학습된 무기력(learned helplessness)에 관한 설명으로 옳지 않은 것은?","choices":["능력이 실제로 부족할 때만 나타나는 현상이다","노력해도 결과가 달라지지 않는다는 신념이 핵심이다","과제 회피와 낮은 지속성으로 나타난다","성공 경험의 축적을 통해 개선될 수 있다","반복적인 실패와 통제 불가능한 경험에서 형성된다"],"answer":0,"explain":"학습된 무기력은 실제 능력과 무관하게 '내 행동이 결과를 바꿀 수 없다'는 지각에서 생긴다. 능력이 충분한 학생도 통제 불가능한 실패를 반복하면 무기력에 빠질 수 있다."},{"id":"ac-006","topic":"자기결정성 이론","q":"Deci와 Ryan의 자기결정성 이론에서 제시한 세 가지 기본 심리욕구로 옳게 묶인 것은?","choices":["자율성, 유능성, 관계성","성취욕구, 친화욕구, 권력욕구","생존, 사랑, 힘","안전, 소속, 자아실현","흥미, 가치, 기대"],"answer":0,"explain":"자율성(스스로 선택한다는 느낌), 유능성(잘 해낼 수 있다는 느낌), 관계성(연결되어 있다는 느낌)이 충족될 때 내재동기가 발달한다. ①은 McClelland, ③은 Glasser의 개념이다."},{"id":"ac-007","topic":"자기결정성 이론","q":"자기결정성 이론의 외적 동기 유형 중 자율성이 가장 높은 것은?","choices":["통합된 조절","부과된 조절","확인된 조절","외적 조절","무동기"],"answer":0,"explain":"자율성 수준은 무동기 < 외적 조절 < 부과된(주입된) 조절 < 확인된(동일시) 조절 < 통합된 조절 < 내재동기 순으로 높아진다. 통합된 조절은 그 행동의 가치가 자기 정체성과 통합된 상태다."},{"id":"ac-008","topic":"동기","q":"이미 흥미를 가지고 공부하던 학생에게 성적에 따른 금전적 보상을 지급했더니 오히려 학습에 대한 자발적 흥미가 줄어들었다. 이 현상을 설명하는 개념은?","choices":["과잉정당화 효과","피그말리온 효과","호손 효과","낙인 효과","플린 효과"],"answer":0,"explain":"과잉정당화 효과는 내재동기로 하던 행동에 외적 보상이 주어지면 행동의 이유를 보상으로 귀인하게 되어 내재동기가 감소하는 현상이다. 보상을 쓸 때는 통제적 성격보다 정보적(유능감을 알려 주는) 성격을 갖도록 설계해야 한다."},{"id":"ac-009","topic":"성취목표","q":"숙달목표(mastery goal) 지향적인 학습자의 특징으로 옳지 않은 것은?","choices":["타인과의 비교를 통해 자신의 능력을 확인하려 한다","도전적인 과제를 선택하는 경향이 있다","실패를 학습의 기회로 받아들인다","깊이 있는 학습전략을 사용한다","능력의 향상과 이해 자체를 목표로 한다"],"answer":0,"explain":"타인과의 비교로 유능함을 확인하려는 것은 수행목표의 특징이다. 숙달목표는 준거를 자기 자신의 향상에 둔다."},{"id":"ac-010","topic":"성취목표","q":"학업 상황에서 가장 부적응적인 결과와 관련되는 목표 지향성은?","choices":["수행회피목표","숙달회피목표","수행접근목표","숙달접근목표","모두 동일하다"],"answer":0,"explain":"수행회피목표는 '무능해 보이지 않기'가 목적이므로 도전 회피, 표면적 학습전략, 시험불안, 자기손상 전략, 도움 요청 회피와 연결되어 가장 부적응적이다. 수행접근목표는 상황에 따라 성취와 정적 관련을 보이기도 한다."},{"id":"ac-011","topic":"마인드셋","q":"Dweck의 이론에서 능력을 노력으로 변화시킬 수 있다고 보는 신념을 가리키는 용어는?","choices":["증가론적 신념","실체론적 신념","귀인 편향","자기손상 전략","통제 소재"],"answer":0,"explain":"증가론적 신념(성장 마인드셋)은 능력이 노력과 전략으로 향상된다고 보아 숙달목표와 도전 추구를 촉진한다. 실체론적 신념(고정 마인드셋)은 능력이 고정되어 있다고 보아 실패를 능력의 증거로 해석하고 회피를 낳는다."},{"id":"ac-012","topic":"학습전략","q":"다음 학습 활동에 해당하는 인지전략은?\n\n\"교과서 내용을 읽고 핵심 개념을 위계도와 표로 다시 정리했다.\"","choices":["조직화 전략","정교화 전략","시연 전략","초인지 전략","동기조절 전략"],"answer":0,"explain":"조직화는 정보 간 관계를 구조화하여 위계도, 개념도, 표, 요약으로 재배열하는 전략이다. 정교화는 기존 지식과 연결하거나 자기 말로 설명·예시를 만드는 것, 시연은 반복해 외우는 것이다."},{"id":"ac-013","topic":"학습전략","q":"초인지(metacognition) 전략에 해당하는 것은?","choices":["중요한 내용에 밑줄을 긋는다","공부 중 내가 지금 내용을 제대로 이해하고 있는지 스스로 점검한다","단어를 소리 내어 반복한다","새로운 개념을 이미 아는 지식과 연결한다","학습 내용을 도표로 정리한다"],"answer":1,"explain":"초인지는 '자신의 인지 과정에 대한 인지'로 계획, 점검, 조절을 포함한다. 이해도를 스스로 확인하고 필요하면 전략을 바꾸는 것이 대표적이다. 나머지는 모두 인지전략이다."},{"id":"ac-014","topic":"자기조절학습","q":"자기조절학습의 순환 과정을 순서대로 바르게 나열한 것은?","choices":["수행 → 계획 → 성찰","계획 → 수행 및 점검 → 성찰 및 평가","성찰 → 계획 → 수행","계획 → 성찰 → 수행","수행 → 성찰 → 계획"],"answer":1,"explain":"Zimmerman의 모형에 따르면 사전 계획(목표 설정과 전략 선택) → 수행 및 자기점검 → 자기성찰(평가와 귀인)의 순환이 반복되며, 성찰의 결과가 다음 주기의 계획에 반영된다."},{"id":"ac-015","topic":"시험불안","q":"시험불안의 두 구성요소 중 학업 수행 저하와 더 밀접하게 관련되는 것은?","choices":["정서성(생리적 각성)","걱정(인지적 요소)","둘 다 관련이 없다","신체 증상의 강도","시험 전날의 수면 시간"],"answer":1,"explain":"걱정(worry) 요소는 '망칠 것 같다', '남들이 나를 어떻게 볼까' 같은 자기 관련 인지로, 작업기억 자원을 잠식해 수행을 직접적으로 떨어뜨린다. 이 때문에 인지적 재구성이 핵심 개입이 된다."},{"id":"ac-016","topic":"시험불안","q":"시험불안이 높은 학생에 대한 개입으로 가장 적절하지 않은 것은?","choices":["이완훈련과 체계적 둔감법을 실시한다","시험의 중요성을 강조해 긴장을 높인다","실제 학습기술의 부족 여부를 함께 평가한다","모의 시험 상황에서 점진적으로 노출한다","부정적 자기대화를 확인하고 재구성한다"],"answer":1,"explain":"이미 불안이 높은 학생에게 중요성을 강조하면 각성이 최적 수준을 넘어 수행이 더 떨어진다. 불안과 수행은 역U자 관계이므로 각성을 낮추는 방향이 맞다."},{"id":"ac-017","topic":"학업지연","q":"학업지연행동(academic procrastination)의 원인으로 가장 거리가 먼 것은?","choices":["실패에 대한 두려움","높은 숙달목표 지향성","과제에 대한 혐오감","낮은 자기효능감","완벽주의적 기준"],"answer":1,"explain":"숙달목표 지향성은 과제 착수와 지속성을 높여 지연행동과 부적 관계를 보인다. 나머지는 모두 지연행동을 촉진하는 요인이다."},{"id":"ac-018","topic":"자기손상 전략","q":"시험 전날 일부러 밤새 게임을 하고는 \"공부를 안 해서 못 본 것\"이라고 말하는 학생의 행동을 설명하는 개념은?","choices":["학습된 무기력","자기손상 전략","인지부조화","귀인 재훈련","과잉정당화"],"answer":1,"explain":"자기손상 전략(self-handicapping)은 실패 시 능력 부족이라는 위협적 귀인을 피하기 위해 미리 핑곗거리를 만드는 자존감 방어 행동이다. 단기적으로 자존감을 보호하지만 실제 성취를 떨어뜨리는 악순환을 만든다."},{"id":"ac-019","topic":"자기효능감","q":"Bandura의 이론에서 학업적 자기효능감의 가장 강력한 원천은?","choices":["대리 경험","성공적인 수행 경험","생리적·정서적 상태","언어적 설득","타인과의 비교"],"answer":1,"explain":"직접적인 성공 경험(숙달 경험)이 가장 강력한 원천이다. 그래서 학업상담에서는 과제를 잘게 나누어 성공 가능한 수준에서 시작해 성취 경험을 쌓게 하는 것이 기본 전략이다."},{"id":"ac-020","topic":"주의집중","q":"학습 중 주의집중이 어려운 학생에 대한 개입으로 가장 적절하지 않은 것은?","choices":["학습 환경의 방해 자극을 정비한다","집중이 될 때까지 자리에 계속 앉아 있도록 요구한다","구체적이고 달성 가능한 단기 목표를 설정한다","ADHD 등 감별이 필요한지 평가하고 필요시 연계한다","짧은 학습 단위와 계획된 휴식을 도입한다"],"answer":1,"explain":"무작정 앉아 있게 하는 것은 실패 경험만 누적시킨다. 환경 조정, 학습 단위 분할, 목표 세분화가 효과적이며, 주의력 문제가 지속적이고 전반적이면 ADHD 등의 감별 평가를 위해 전문 기관에 연계해야 한다."},{"id":"ac-021","topic":"학업상담 과정","q":"학업상담 초기의 평가에서 확인해야 할 영역으로 가장 거리가 먼 것은?","choices":["기초 학습 능력과 인지적 요인","부모가 희망하는 대학과 학과의 서열","학습 시간과 습관 등 행동적 요인","가정·또래·교사 등 환경적 요인","학습 동기와 정서적 요인"],"answer":1,"explain":"부모의 희망 서열은 평가 영역이 아니며, 오히려 그 기대가 학생에게 어떤 압력으로 작용하는지가 다루어야 할 주제다. 학업문제는 인지·정의·행동·환경의 다차원적 평가에서 출발한다."},{"id":"ac-022","topic":"학업상담 과정","q":"학업상담에서 상담 목표를 설정할 때 가장 적절한 것은?","choices":["성적 향상만을 유일한 목표로 설정한다","평가 결과에 근거해 학생과 합의하여 구체적으로 설정한다","부모가 원하는 목표를 그대로 채택한다","가능한 한 높은 목표를 설정해 동기를 자극한다","목표를 정하지 않고 자유롭게 대화한다"],"answer":1,"explain":"학업문제의 실제 원인(동기, 전략, 불안, 환경 등)에 근거해 학생이 동의할 수 있는 구체적이고 달성 가능한 목표를 세워야 실행으로 이어진다. 성적만을 목표로 삼으면 원인에 맞지 않는 개입이 되기 쉽다."},{"id":"ac-023","topic":"부모 개입","q":"학업 문제로 상담받는 청소년의 부모에게 제공할 조언으로 가장 적절한 것은?","choices":["결과 중심의 보상과 처벌을 강화하도록 한다","과정과 노력에 대한 구체적 피드백을 주도록 한다","다른 자녀나 또래와 비교하여 경쟁심을 자극하도록 한다","학습 계획과 실행을 부모가 모두 관리하도록 한다","성적이 오를 때까지 모든 여가를 제한하도록 한다"],"answer":1,"explain":"과정과 전략에 대한 구체적 피드백은 성장 마인드셋과 숙달목표를 촉진한다. 결과 중심 통제, 비교, 과도한 대리 관리는 자율성 욕구를 좌절시켜 내재동기를 떨어뜨린다."},{"id":"ac-024","topic":"학업중단","q":"학업중단 위기에 있는 청소년에 대한 상담 접근으로 가장 적절하지 않은 것은?","choices":["학업중단을 고려하게 된 배경과 욕구를 탐색한다","학업중단숙려제 등 제도적 절차를 안내한다","중단은 무조건 실패라는 점을 강조해 설득한다","가족 및 학교 자원을 연계한다","중단 이후의 대안 경로에 대한 정보를 함께 검토한다"],"answer":2,"explain":"일방적 설득은 관계를 단절시키고 이후 지원 기회마저 잃게 만든다. 결정 과정을 함께 검토하며 어떤 선택을 하든 지원이 이어지도록 자원을 연결하는 것이 상담자의 역할이다."},{"id":"ac-025","topic":"학습컨설팅","q":"학습컨설팅에 관한 설명으로 가장 적절한 것은?","choices":["학습자의 정서 문제만을 다루는 심리치료이다","교과 내용을 직접 가르치는 교습 활동이다","학습 문제의 원인을 진단하고 맞춤형 학습전략을 설계·지원하는 협력적 과정이다","표준화 검사 결과를 통보하는 절차이다","성적 향상을 보증하는 프로그램이다"],"answer":2,"explain":"학습컨설팅은 진단에 기초해 학습자·부모·교사와 협력하여 전략을 설계하고 실행을 점검·조정하는 과정이다. 교과 지식 전달(교습)과는 구별된다."},{"id":"ac-026","topic":"기억과 학습","q":"학습 내용의 장기적 파지를 높이는 방법으로 가장 효과적인 것은?","choices":["시험 직전에 한 번에 몰아서 반복해 읽는다","형광펜으로 교재 전체를 표시한다","간격을 두고 분산하여 학습하고 인출 연습을 병행한다","같은 자료를 여러 번 눈으로 읽는다","노트를 그대로 옮겨 적는다"],"answer":2,"explain":"분산 학습(spacing)과 인출 연습(retrieval practice, 스스로 답을 떠올려 보기)은 장기 기억을 가장 효과적으로 높이는 것으로 반복 검증된 방법이다. 반복해 읽기와 밑줄 긋기는 익숙함을 이해로 착각하게 만드는 대표적 비효율 전략이다."},{"id":"ac-027","topic":"학업스트레스","q":"청소년의 학업스트레스에 관한 설명으로 옳지 않은 것은?","choices":["부모의 과도한 기대가 주요 원인 중 하나이다","신체 증상과 수면 문제로 나타날 수 있다","스트레스가 높을수록 학업 성취가 비례해 높아진다","우울, 불안 등 정서 문제와 관련될 수 있다","적정 수준의 스트레스는 수행을 촉진할 수 있다"],"answer":2,"explain":"스트레스와 수행은 역U자 관계다. 일정 수준을 넘어서면 주의와 작업기억이 잠식되어 성취가 오히려 떨어지고 소진과 정서 문제로 이어진다."},{"id":"ac-028","topic":"목표 설정","q":"효과적인 학습 목표 설정의 조건으로 가장 거리가 먼 것은?","choices":["구체적으로 진술한다","달성 여부를 확인할 수 있게 한다","가능한 한 높고 포괄적으로 설정한다","기한을 명시한다","현재 수준보다 약간 도전적이되 달성 가능하게 한다"],"answer":2,"explain":"지나치게 높고 막연한 목표는 실패 경험과 회피를 낳는다. 근접발달 수준에서 약간 도전적이면서 달성 가능한 구체적 단기 목표가 자기효능감을 키운다."},{"id":"ac-029","topic":"감별","q":"학업 부진을 호소하는 청소년에 대해 전문 기관 연계를 우선 고려해야 하는 경우로 가장 적절한 것은?","choices":["시험 기간에만 일시적으로 집중이 떨어질 때","특정 과목의 학습 전략이 부족할 때","지속적·전반적인 주의력 문제와 특정 학습 영역의 현저한 결손이 함께 관찰될 때","성적이 목표보다 조금 낮을 때","학습 시간 관리가 잘 되지 않을 때"],"answer":2,"explain":"여러 상황에서 지속되는 주의력 문제와 읽기·쓰기·수학 등 특정 영역의 현저한 결손이 함께 나타나면 ADHD나 학습장애의 가능성이 있으므로, 상담만으로 접근하지 말고 종합 심리평가와 의학적 평가를 위해 연계해야 한다."},{"id":"ac-030","topic":"종합","q":"학업상담에 관한 설명으로 가장 적절한 것은?","choices":["학습 방법만 교정하면 대부분의 학업문제가 해결된다","학업상담의 성과는 성적 상승으로만 평가된다","학업문제는 인지·정의·행동·환경 요인이 복합적으로 작용한 결과이다","정서 문제는 학업상담의 범위 밖이므로 다루지 않는다","부모 개입은 학업상담의 효과를 항상 떨어뜨린다"],"answer":2,"explain":"같은 '성적 저하'라도 원인은 학습전략 부족, 시험불안, 낮은 동기, 가정환경, 학습장애 등으로 전혀 다르다. 원인에 대한 다차원적 평가 없이 방법론만 교정하면 효과가 없다."},{"id":"ac-031","topic":"귀인이론","q":"Weiner의 귀인이론에서 '능력'과 '노력'을 구분하는 핵심 차원은?","choices":["소재(내적-외적)","통제 가능성만으로 구분된다","안정성(안정-불안정)","보편성(일반-특수)","즉시성(즉각-지연)"],"answer":2,"explain":"능력과 노력은 모두 내적 요인이지만, 능력은 안정적이고 노력은 불안정하다(바뀔 수 있다). 통제 가능성에서도 노력은 통제 가능, 능력은 통제 불가능으로 갈리지만 능력·노력을 가르는 1차 차원은 안정성이다."},{"id":"ac-032","topic":"귀인이론","q":"학업 실패를 반복하는 학생에게 적용할 귀인 재훈련의 방향으로 가장 적절한 것은?","choices":["실패를 능력 부족으로 귀인하도록 돕는다","실패를 운으로 귀인하도록 돕는다","실패를 노력 부족이나 전략의 부적절함으로 귀인하도록 돕는다","실패를 교사의 편애로 귀인하도록 돕는다","실패의 원인을 생각하지 않도록 회피시킨다"],"answer":2,"explain":"귀인 재훈련은 실패를 안정적·통제 불가능한 능력이 아니라, 불안정하고 통제 가능한 노력과 학습전략으로 돌리도록 돕는다. 그래야 다음 시도에 대한 기대와 동기가 유지된다."},{"id":"ac-033","topic":"학습된 무기력","q":"학습된 무기력 상태의 학생에게 나타나는 특징으로 옳지 않은 것은?","choices":["노력해도 결과가 달라지지 않는다고 믿는다","실패를 안정적이고 전반적인 원인으로 귀인한다","실패 후에도 과제 지속 시간이 늘어난다","과제를 시작하기 전에 미리 포기한다","쉬운 과제에서도 성공 경험을 인정하지 않는다"],"answer":2,"explain":"학습된 무기력의 핵심은 수행 결손으로, 실패 후 과제 지속 시간이 오히려 줄어들고 쉽게 포기한다. 개입은 통제 가능한 원인으로의 귀인 전환과 작고 확실한 성공 경험의 누적이다."},{"id":"ac-034","topic":"자기결정성 이론","q":"자기결정성 이론에서 제시한 세 가지 기본 심리 욕구로 옳은 것은?","choices":["생존, 사랑, 자유","성취, 권력, 친애","자율성, 유능감, 관계성","안전, 소속, 자아실현","자율성, 성취, 인정"],"answer":2,"explain":"Deci와 Ryan의 자기결정성 이론은 자율성(autonomy), 유능감(competence), 관계성(relatedness)을 기본 심리 욕구로 본다. 이 셋이 충족될수록 내재 동기가 높아지고 외적 동기도 잘 내면화된다."},{"id":"ac-035","topic":"자기결정성 이론","q":"다음 학생의 학습 동기 유형은?\n\n\"공부가 재미있지는 않지만, 나중에 내가 하고 싶은 일을 하려면 지금 해 두는 게 맞다고 생각해서 해요.\"","choices":["무동기","외적 조절","확인된 조절","부과된 조절","내재적 동기"],"answer":2,"explain":"확인된(동일시) 조절은 활동 자체가 즐겁지는 않지만 그 가치를 스스로 인정하고 받아들인 상태다. 외적 조절은 보상·처벌 때문에, 부과된 조절은 죄책감이나 자존심 때문에 하는 것이며, 내재적 동기는 활동 자체가 즐거운 경우다."},{"id":"ac-036","topic":"동기","q":"원래 흥미를 갖고 하던 활동에 외적 보상을 주었더니 보상이 사라진 뒤 흥미가 오히려 줄어드는 현상은?","choices":["플린 효과","피그말리온 효과","자이가르닉 효과","과잉정당화 효과","호손 효과"],"answer":3,"explain":"과잉정당화 효과는 내재적으로 동기화된 행동에 외적 보상이 주어지면 행동의 이유를 보상으로 재해석해 내재 동기가 감소하는 현상이다. 학업 상황에서 무분별한 물질적 보상 사용을 경계해야 하는 근거가 된다."},{"id":"ac-037","topic":"성취목표","q":"숙달목표(mastery goal) 지향 학생의 특징으로 옳은 것은?","choices":["남보다 잘하는 것을 학습의 목적으로 삼는다","쉬운 과제를 골라 성공률을 높이려 한다","무능해 보이지 않는 것을 최우선으로 한다","어려운 과제를 선택하고 실패를 학습의 일부로 받아들인다","도움 요청을 능력 부족의 증거로 여겨 회피한다"],"answer":3,"explain":"숙달목표 지향은 능력의 향상과 이해 자체를 목표로 하므로 도전적 과제를 선택하고 실패를 정보로 활용하며 도움 요청에도 개방적이다. 나머지는 수행목표(특히 수행회피목표)의 특징이다."},{"id":"ac-038","topic":"성취목표","q":"수행회피목표를 가진 학생에게 가장 두드러지게 나타나는 행동은?","choices":["새로운 학습 방법을 적극적으로 시도한다","모르는 것을 교사에게 적극적으로 질문한다","자신의 이전 성취와 현재를 비교하며 성장을 확인한다","어려워 보이는 과제를 피하고 무능해 보이는 상황을 회피한다","실패 원인을 전략에서 찾아 수정한다"],"answer":3,"explain":"수행회피목표는 무능하게 보이지 않는 것이 목표이므로, 도전 회피·도움 요청 회피·자기손상 전략이 나타난다. 단기적으로 자존감은 지켜지지만 실제 학습과 성취는 저해된다."},{"id":"ac-039","topic":"마인드셋","q":"Dweck의 성장 마인드셋을 기르기 위한 피드백으로 가장 적절한 것은?","choices":["\"역시 머리가 좋구나.\"","\"타고난 재능이 있어.\"","\"넌 원래 수학을 잘하잖아.\"","\"이번엔 방법을 바꿔서 끝까지 해냈구나.\"","\"반에서 제일 똑똑해.\""],"answer":3,"explain":"성장 마인드셋은 능력이 노력과 전략으로 변할 수 있다는 믿음이다. 지능·재능 같은 고정 속성을 칭찬하면 고정 마인드셋을 강화하므로, 과정·전략·노력에 초점을 둔 피드백을 해야 한다."},{"id":"ac-040","topic":"자기효능감","q":"Bandura가 제시한 자기효능감의 네 가지 원천 중 가장 강력한 것은?","choices":["대리 경험","언어적 설득","생리적·정서적 상태","성공 경험(숙달 경험)","타인의 기대"],"answer":3,"explain":"직접 성공해 본 숙달 경험이 자기효능감의 가장 강력한 원천이다. 이어서 대리 경험(모델 관찰), 언어적 설득, 생리적·정서적 각성 상태 순으로 영향력이 있다. 학업상담에서 작은 성공 경험을 설계하는 이유다."},{"id":"ac-041","topic":"자기조절학습","q":"Zimmerman의 자기조절학습 순환 모형의 세 단계를 순서대로 나열한 것은?","choices":["수행 → 계획 → 성찰","동기화 → 암기 → 평가","성찰 → 수행 → 계획","계획(사전숙고) → 수행(수행통제) → 자기성찰","목표설정 → 보상 → 처벌"],"answer":3,"explain":"자기조절학습은 사전숙고(목표 설정, 전략 계획, 자기효능감), 수행통제(주의 집중, 자기교시, 자기점검), 자기성찰(자기평가, 귀인, 만족감) 세 단계가 순환한다. 성찰 결과가 다음 사전숙고에 반영된다."},{"id":"ac-042","topic":"자기조절학습","q":"메타인지에 해당하는 활동으로 가장 적절한 것은?","choices":["교과서 내용을 소리 내어 반복해 읽는다","핵심어에 밑줄을 긋는다","단어를 반복해서 쓰며 외운다","공부한 내용 중 무엇을 모르는지 점검하고 학습 방법을 조정한다","노트를 예쁘게 정리한다"],"answer":3,"explain":"메타인지는 자신의 인지 과정에 대한 인식과 조절이다. 무엇을 알고 모르는지 아는 메타인지적 지식과, 계획·점검·조절하는 메타인지적 조절로 나뉜다. 나머지는 인지 전략(시연) 수준이다."},{"id":"ac-043","topic":"학습전략","q":"다음에 해당하는 학습전략은?\n\n새로 배운 개념을 자신이 이미 알고 있는 사례와 연결해 설명해 본다.","choices":["시연 전략","이해점검 전략","조직화 전략","정교화 전략","시간관리 전략"],"answer":3,"explain":"정교화는 새 정보를 기존 지식과 연결해 의미를 더하는 전략으로, 심상화·유추·자기설명·요약이 포함된다. 시연은 반복, 조직화는 위계화·범주화, 이해점검은 메타인지 전략이다."},{"id":"ac-044","topic":"학습전략","q":"조직화 전략을 사용한 예로 가장 적절한 것은?","choices":["영어 단어를 소리 내어 열 번 반복한다","배운 내용을 개념도로 그려 상위·하위 개념으로 묶는다","이해가 안 되는 부분에 표시해 두고 다시 읽는다","공부 시간을 기록해 계획과 비교한다","시험 전날 밤을 새워 전 범위를 훑는다"],"answer":1,"explain":"조직화는 정보 간 관계를 구조로 만드는 전략으로 개념도, 위계도, 표, 범주화가 해당한다. 1번은 시연, 3번은 이해점검(메타인지), 4번은 자원관리(시간관리) 전략이다."},{"id":"ac-045","topic":"기억과 학습","q":"같은 총 학습 시간을 쓸 때 장기 파지에 더 효과적인 방식은?","choices":["하루에 몰아서 하는 집중연습","한 과목만 끝까지 끝내고 다음으로 넘어가는 방식","시험 직전에만 하는 벼락치기","여러 날에 나누어 하는 분산연습","읽기만 반복하는 방식"],"answer":3,"explain":"분산연습(간격 효과)은 같은 시간을 투입해도 장기 기억에 더 효과적이다. 집중연습은 단기적으로 유창해 보여 학습이 잘된 것 같은 착각을 주지만 파지가 빨리 감소한다."},{"id":"ac-046","topic":"기억과 학습","q":"학습한 내용을 다시 읽는 것보다 인출 연습(스스로 떠올려 답해 보기)이 더 효과적인 이유로 가장 적절한 것은?","choices":["읽기보다 시간이 적게 들기 때문이다","읽기는 작업기억을 사용하지 않기 때문이다","인출은 정서적 각성을 낮추기 때문이다","인출 과정 자체가 기억 흔적을 강화하고 모르는 부분을 드러내기 때문이다","인출은 시험불안을 완전히 제거하기 때문이다"],"answer":3,"explain":"시험 효과(testing effect)라 불리는 현상으로, 기억을 꺼내는 행위가 그 기억을 더 강하게 만든다. 동시에 무엇을 모르는지 정확히 알려 주어 메타인지적 착각을 줄여 준다."},{"id":"ac-047","topic":"기억과 학습","q":"작업기억의 특성을 고려한 학습 지도로 적절하지 않은 것은?","choices":["복잡한 내용을 작은 단위로 나누어 제시한다","관련 정보를 묶어 청킹하도록 돕는다","기초 기능을 자동화해 인지 부하를 줄인다","한 번에 최대한 많은 정보를 동시에 제시한다","그림과 설명을 가까이 배치해 분산된 주의를 줄인다"],"answer":3,"explain":"작업기억의 용량은 제한적이므로 한 번에 많은 정보를 제시하면 인지 부하가 초과되어 학습이 방해된다. 분할, 청킹, 자동화, 근접 배치 등으로 부하를 관리해야 한다."},{"id":"ac-048","topic":"학습전략","q":"SQ3R 독서법의 순서로 옳은 것은?","choices":["훑어보기 → 읽기 → 질문 → 복습 → 암송","질문 → 훑어보기 → 읽기 → 복습 → 암송","읽기 → 훑어보기 → 질문 → 암송 → 복습","훑어보기 → 질문 → 읽기 → 암송 → 복습","질문 → 읽기 → 훑어보기 → 암송 → 복습"],"answer":3,"explain":"SQ3R은 Survey(훑어보기) → Question(질문 만들기) → Read(읽기) → Recite(암송·인출) → Review(복습)의 순서다. 읽기 전에 질문을 만들어 목적을 갖고 읽게 하고, 읽은 뒤 인출로 확인하는 구조다."},{"id":"ac-049","topic":"목표 설정","q":"학업상담에서 효과적인 목표 설정의 조건으로 옳지 않은 것은?","choices":["구체적이고 측정 가능해야 한다","학생이 스스로 참여해 정해야 한다","현재 수준보다 도전적이되 달성 가능해야 한다","달성 여부를 확인할 기한이 있어야 한다","가능한 한 장기 목표만 세워 큰 그림에 집중하게 한다"],"answer":4,"explain":"장기 목표만 있으면 피드백이 지연되어 동기가 유지되지 않는다. 장기 목표를 단기·근접 목표로 쪼개어 성공 경험을 자주 확인하게 하는 것이 자기효능감과 지속성에 효과적이다."},{"id":"ac-050","topic":"시험불안","q":"시험불안의 두 구성 요소에 관한 설명으로 옳은 것은?","choices":["내적 요소와 외적 요소로 구성된다","행동적 요소와 사회적 요소로 구성된다","유전적 요소와 환경적 요소로 구성된다","단기 요소와 장기 요소로 구성된다","인지적 요소(걱정)와 정서적 요소(정서성)로 구성된다"],"answer":4,"explain":"시험불안은 걱정(worry, 실패와 평가에 대한 인지적 염려)과 정서성(emotionality, 심장 박동·발한 등 생리적 각성)으로 구성된다. 이 중 학업 수행을 더 크게 떨어뜨리는 것은 걱정 요소다."},{"id":"ac-051","topic":"시험불안","q":"시험불안이 높은 학생에 대한 개입으로 적절하지 않은 것은?","choices":["이완훈련과 호흡법을 익히게 한다","부정적 자동사고를 찾아 현실적 사고로 바꾸도록 돕는다","체계적 둔감화를 통해 시험 상황에 점진적으로 노출시킨다","실제 학습전략과 시험 준비 기술을 함께 훈련한다","시험의 중요성을 강조해 각성 수준을 더 높인다"],"answer":4,"explain":"각성을 더 높이면 수행은 오히려 떨어진다. 시험불안 개입은 이완(정서성), 인지 재구성(걱정), 노출, 그리고 실제 학습·시험 기술 훈련을 병행한다. 준비 부족이 원인인 경우 기술 훈련 없이 불안만 다루면 효과가 제한된다."},{"id":"ac-052","topic":"학업지연","q":"학업 지연행동(procrastination)에 대한 개입으로 가장 적절한 것은?","choices":["과제를 더 크고 도전적으로 만들어 긴장을 높인다","지연할 때마다 강한 처벌을 준다","마감 직전까지 미루는 습관을 개인의 성격 문제로 규정한다","완벽하게 준비된 뒤에 시작하도록 지도한다","과제를 작은 단위로 쪼개고 즉시 시작할 수 있는 첫 행동을 정한다"],"answer":4,"explain":"지연은 게으름보다 과제 혐오·실패 불안·완벽주의와 관련된 정서 조절 문제인 경우가 많다. 과제를 잘게 나누어 진입 장벽을 낮추고, 구체적 실행 의도(언제·어디서·무엇부터)를 정하는 것이 효과적이다."},{"id":"ac-053","topic":"자기손상 전략","q":"시험 전날 일부러 밤새 게임을 하고 \"공부를 안 해서 못 봤다\"고 말하는 학생의 행동을 설명하는 개념은?","choices":["자기결정성","자기충족적 예언","인지부조화 감소","학습된 낙관성","자기손상 전략"],"answer":4,"explain":"자기손상 전략(self-handicapping)은 실패했을 때 능력 부족이라는 귀인을 피하려고 미리 장애물을 만들어 두는 행동이다. 자존감은 일시적으로 보호되지만 실제 수행은 계속 나빠지는 악순환을 만든다."},{"id":"ac-054","topic":"완벽주의","q":"학업 장면에서 부적응적 완벽주의의 특징으로 옳은 것은?","choices":["높은 기준을 세우고 성취에서 만족을 얻는다","과제를 빨리 끝내는 것을 최우선으로 한다","목표를 낮게 잡아 실패를 피한다","타인의 평가에 전혀 영향을 받지 않는다","높은 기준과 함께 실수에 대한 과도한 염려와 자기비난을 보인다"],"answer":4,"explain":"완벽주의는 높은 기준 자체가 문제가 아니라, 실수에 대한 염려·수행 의심·자기비난이 결합될 때 부적응적이 된다. 이는 학업 지연, 시험불안, 과제 회피로 이어진다."},{"id":"ac-055","topic":"감별","q":"학습부진, 학습지진, 학습장애의 구분으로 옳은 것은?","choices":["학습부진은 지적 능력이 경계선 수준이어서 학습이 느린 경우다","학습지진은 잠재 능력에 비해 성취가 현저히 낮은 경우다","학습부진은 교육적 개입으로 회복이 불가능하다","세 개념은 모두 지능 저하를 전제로 한다","학습장애는 정상 지능임에도 특정 영역의 학습에 현저한 어려움을 보이는 경우다"],"answer":4,"explain":"학습장애는 정상 지능에도 읽기·쓰기·수학 등 특정 영역에서 현저한 어려움을 보이는 신경학적 원인의 문제다. 학습부진은 잠재력 대비 성취가 낮은 상태로 환경·정서 요인이 크고 개입으로 회복 가능하며, 학습지진은 지적 능력 자체가 경계선 수준인 경우다."},{"id":"ac-056","topic":"주의집중","q":"주의력 문제로 학업 부진을 보이는 청소년에 대한 상담자의 접근으로 가장 적절한 것은?","choices":["의지 부족으로 보고 정신력 강화를 요구한다","주의 산만한 환경에서 견디는 훈련을 우선한다","즉시 ADHD로 진단하고 약물 복용을 권유한다","학습량을 크게 늘려 집중 시간을 강제로 늘린다","주의력 문제의 원인을 감별하고 필요 시 전문 평가와 의뢰를 고려한다"],"answer":4,"explain":"주의력 저하는 ADHD뿐 아니라 불안, 우울, 수면 부족, 학습결손, 미디어 과다 사용 등 여러 원인에서 온다. 상담자는 진단자가 아니므로 감별적 평가와 필요 시 의뢰가 우선이며, 동시에 환경 구조화와 학습 단위 조절을 병행한다."},{"id":"ac-057","topic":"부모 개입","q":"자녀의 학업에 대한 부모 개입 상담에서 권장할 방향으로 가장 적절한 것은?","choices":["성적 결과에 대한 보상과 처벌을 강화하도록 안내한다","자녀의 진로 목표를 부모가 결정해 주도록 안내한다","학습 계획과 시간표를 부모가 전적으로 관리하도록 안내한다","다른 집 자녀와 비교해 동기를 자극하도록 안내한다","학습 과정과 노력에 관심을 두고 자율성을 지지하도록 안내한다"],"answer":4,"explain":"통제적 개입은 자율성 욕구를 좌절시켜 내재 동기를 낮춘다. 결과보다 과정·노력에 관심을 두고, 선택권을 주며, 정서적 지지를 제공하는 자율성 지지적 양육이 학업 동기와 성취에 긍정적이다."},{"id":"ac-058","topic":"학업중단","q":"학업중단 위기 청소년에 대한 개입으로 적절하지 않은 것은?","choices":["학업중단 숙려제를 안내해 충분히 숙고할 기회를 제공한다","학업중단의 배경 요인(학교 부적응, 가정, 정신건강)을 다각도로 평가한다","학교 밖 청소년 지원센터 등 지역 자원을 연계한다","중단 이후의 진로·학습 경로를 함께 설계한다","복교만이 유일한 해결책이라고 설득한다"],"answer":4,"explain":"복교가 늘 최선은 아니다. 학업중단 숙려제로 성급한 결정을 막되, 최종 결정은 청소년의 상황과 의사를 존중해야 하며 중단을 택하는 경우에도 검정고시·직업훈련 등 대안 경로를 함께 설계하는 것이 상담자의 역할이다."},{"id":"ac-059","topic":"학습컨설팅","q":"학습컨설팅에 관한 설명으로 옳지 않은 것은?","choices":["학습자의 학습 문제를 진단하고 맞춤형 개입을 설계한다","인지·정의·행동·환경 영역을 함께 고려한다","교사·부모 등 의뢰인을 통한 간접 지원을 포함한다","표준화 검사와 면담 결과를 종합해 개입 계획을 세운다","학습 방법만 알려 주면 되므로 정서적 요인은 다루지 않는다"],"answer":4,"explain":"학습 문제의 상당수는 동기, 불안, 자기효능감, 또래·가족 관계 같은 정의적·환경적 요인과 얽혀 있다. 학습컨설팅은 인지적 학습전략만이 아니라 이 요인들을 함께 다루는 통합적 접근이다."},{"id":"ac-060","topic":"학업소진","q":"학업 소진(academic burnout)의 하위 요소로 보기 어려운 것은?","choices":["정서적 고갈","냉소(무관심)","무능감(효능감 저하)","학업에 대한 심리적 거리두기","학업에 대한 몰입 증가"],"answer":4,"explain":"학업 소진은 정서적 고갈, 냉소·심리적 거리두기, 효능감 저하를 핵심으로 한다. 몰입 증가는 소진의 반대 개념인 학업 열의(engagement)에 해당한다."}]},"career":{"id":"career","name":"진로상담","short":"진로상담","type":"elective","order":5,"concepts":[{"title":"특성-요인 이론","keys":["Parsons","3요소","직업지도"],"body":"Parsons는 현명한 직업 선택을 위해 ① 자신에 대한 명확한 이해 ② 직업 세계에 대한 지식 ③ 이 둘의 합리적 연결(matching)이 필요하다고 보았다. Williamson은 이를 분석-종합-진단-예후-상담-추수지도의 6단계 절차로 체계화했다. 개인의 특성과 직업의 요구를 짝짓는 관점으로 심리검사 활용의 이론적 기초가 되었으나, 선택을 일회적 사건으로 보고 발달 과정을 간과했다는 비판을 받는다."},{"title":"Holland의 인성이론","keys":["RIASEC","육각형 모형","일치성·일관성·변별성·정체성"],"body":"개인의 성격 유형과 직업 환경을 실재형(R), 탐구형(I), 예술형(A), 사회형(S), 진취형(E), 관습형(C)으로 분류하고, 유형과 환경이 일치할 때 만족과 안정이 높아진다고 본다. 육각형 상에서 인접한 유형은 유사하고 마주 보는 유형은 상반된다(R↔S, I↔E, A↔C). 주요 개념은 일치성(개인-환경 부합), 일관성(육각형상 인접 정도), 변별성(특정 유형의 뚜렷함), 정체성(목표·흥미의 명확성과 안정성)이다."},{"title":"Super의 생애진로발달이론","keys":["자아개념","5단계","생애역할 무지개","진로성숙도"],"body":"진로 발달을 자아개념을 직업을 통해 실현해 가는 평생의 과정으로 본다. 단계는 성장기(0~14, 자아개념 형성) → 탐색기(15~24, 잠정적 선택과 시행) → 확립기(25~44, 안정과 정착) → 유지기(45~64) → 쇠퇴(해체)기(65~)다. 탐색기의 하위단계는 잠정기-전환기-시행기다. 생애무지개(life-career rainbow)로 자녀·학생·여가인·시민·근로자·가정인 등 여러 역할이 생애에 걸쳐 교차함을 설명했고, 청소년기 핵심 개념으로 진로성숙도를 제시했다."},{"title":"Ginzberg의 진로발달이론","keys":["환상기","잠정기","현실기"],"body":"직업 선택을 비가역적이고 발달적인 과정으로 본 최초의 이론 중 하나다. 환상기(11세 이전, 놀이 중심의 비현실적 선택) → 잠정기(11~17세, 흥미-능력-가치-전환의 하위단계를 거침) → 현실기(17세 이후, 탐색-구체화-특수화)로 진행된다. 후기에는 직업 선택이 일생에 걸친 의사결정 과정이며 비가역적이지 않다고 수정했다."},{"title":"Gottfredson의 제한과 타협 이론","keys":["직업포부","제한(circumscription)","타협(compromise)"],"body":"직업포부의 발달을 자기개념에 맞지 않는 대안을 제거해 가는 '제한' 과정으로 설명한다. 단계는 힘과 크기 지향(3~5세) → 성역할 지향(6~8세) → 사회적 가치 지향(9~13세) → 내적 고유자아 지향(14세 이후)이다. 현실적 제약에 부딪히면 '타협'이 일어나는데, 이때 포기하는 순서는 흥미 → 직업의 명성(사회적 지위) → 성유형(성역할)의 순으로, 가장 늦게 형성된 것을 먼저 포기한다."},{"title":"Krumboltz의 사회학습이론과 계획된 우연","keys":["4가지 영향요인","planned happenstance","5가지 기술"],"body":"진로 결정에 영향을 주는 요인으로 ① 유전적 요인과 특별한 능력 ② 환경적 조건과 사건 ③ 학습 경험(도구적·연상적) ④ 과제접근기술을 제시했다. 이후 '계획된 우연(planned happenstance)' 이론으로 발전시켜, 예기치 않은 사건을 진로 기회로 전환하는 다섯 가지 기술 — 호기심, 인내심, 융통성, 낙관성, 위험 감수 — 을 강조했다."},{"title":"사회인지진로이론(SCCT)","keys":["자기효능감","결과기대","개인적 목표","맥락 요인"],"body":"Lent, Brown, Hackett이 Bandura의 사회인지이론을 진로에 적용한 것으로, 자기효능감·결과기대·개인적 목표의 삼각 관계가 흥미 → 선택 → 수행으로 이어진다고 본다. 흥미는 자기효능감과 결과기대에서 형성되며, 능력이 있어도 자기효능감이 낮으면 흥미와 선택으로 이어지지 않는다. 근접 맥락 요인(지지·장벽)이 목표와 행동 사이를 조절한다. 진로장벽 인식과 자기효능감 증진 개입의 근거가 된다."},{"title":"직업적응이론과 구성주의 진로이론","keys":["Dawis & Lofquist","만족·충족","Savickas 진로적응도","생애설계"],"body":"직업적응이론(TWA)은 개인의 욕구와 환경의 강화체계가 부합할 때의 '만족(satisfaction)'과, 개인의 능력이 환경의 요구를 충족할 때의 '충족(satisfactoriness)'이 함께 유지될 때 재직 기간이 길어진다고 본다. 적응방식으로 융통성·끈기·적극성·반응성을 제시한다. Savickas의 구성주의 진로이론은 진로를 개인이 구성하는 이야기로 보며, 진로적응도의 4C — 관심(Concern), 통제(Control), 호기심(Curiosity), 자신감(Confidence) — 를 핵심 자원으로 제시한다."},{"title":"진로의사결정과 진로미결정","keys":["합리적·직관적·의존적","발달적 미결정 vs 만성적 우유부단"],"body":"Harren은 의사결정 유형을 합리적, 직관적, 의존적 유형으로 구분했다. 진로미결정은 정보 부족이나 탐색 부족에서 오는 '발달적 미결정'과, 불안·완벽주의·낮은 자아정체감에서 비롯되어 어떤 결정도 하지 못하는 '만성적 우유부단(indecisiveness)'으로 구분된다. 전자는 정보 제공과 탐색 활동으로, 후자는 불안과 성격적 요인을 다루는 심리적 개입으로 접근이 달라진다."},{"title":"청소년 진로상담의 실제","keys":["진로검사 활용","진로체험","학교진로교육","커리어넷·워크넷"],"body":"청소년 진로상담은 결정을 대신 내려 주는 것이 아니라 자기이해-직업세계 이해-의사결정 능력을 기르는 데 목적이 있다. 흥미검사(Holland, STRONG), 적성검사, 가치관검사, 진로성숙도검사를 활용하되 단일 검사로 진로를 확정하지 않는다. 진로체험(직업체험, 현장견학, 인터뷰), 진로포트폴리오, 자유학기제 진로탐색 활동을 병행하며, 커리어넷과 워크넷 등 공공 진로정보망을 활용한다."}],"questions":[{"id":"cr-001","topic":"특성요인이론","q":"Parsons가 제시한 현명한 직업 선택의 3요소에 해당하지 않는 것은?","choices":["자신의 흥미, 적성, 능력에 대한 명확한 이해","직업의 요구 조건과 전망에 대한 지식","위 두 가지 정보의 합리적인 연결","직업 세계에서의 우연한 기회에 대한 개방성","이상의 요소를 바탕으로 한 진로 결정"],"answer":3,"explain":"우연한 기회에 대한 개방성은 Krumboltz의 '계획된 우연' 이론의 핵심 개념이다. Parsons는 자기이해, 직업이해, 이 둘의 합리적 연결(matching)이라는 합리주의적 3요소를 제시했다."},{"id":"cr-002","topic":"Holland","q":"Holland의 육각형 모형에서 서로 마주 보는(상반되는) 유형끼리 짝지어진 것은?","choices":["실재형(R) - 탐구형(I)","예술형(A) - 사회형(S)","실재형(R) - 사회형(S)","진취형(E) - 관습형(C)","탐구형(I) - 예술형(A)"],"answer":2,"explain":"육각형은 R-I-A-S-E-C 순으로 배열되며 마주 보는 쌍은 R↔S, I↔E, A↔C다. 나머지 보기는 모두 인접하거나 한 칸 떨어진 유형들이다."},{"id":"cr-003","topic":"Holland","q":"Holland 이론의 '변별성(differentiation)'에 관한 설명으로 옳은 것은?","choices":["개인 유형과 환경 유형이 얼마나 부합하는가","육각형에서 인접한 유형끼리 조합되어 있는가","특정 유형이 다른 유형들에 비해 뚜렷하게 높은가","진로 목표와 흥미가 명확하고 안정적인가","직업 환경이 얼마나 다양한 활동을 요구하는가"],"answer":2,"explain":"변별성은 프로파일에서 특정 유형이 뚜렷하게 두드러지는 정도다. 모든 유형이 비슷하게 나오면 변별성이 낮아 해석과 진로 결정에 어려움이 있다. ①은 일치성, ②는 일관성, ④는 정체성이다."},{"id":"cr-004","topic":"Super","q":"Super의 진로발달단계 중 '탐색기(exploration)'에 해당하는 연령대와 특징으로 옳은 것은?","choices":["0~14세, 욕구와 환상을 중심으로 자아개념이 형성된다","15~24세, 잠정적 선택과 시행을 통해 진로를 좁혀 간다","25~44세, 선택한 분야에 정착하고 지위를 안정시킨다","45~64세, 현재의 위치를 유지하고 방어한다","65세 이후, 활동을 줄이고 은퇴를 준비한다"],"answer":1,"explain":"탐색기(15~24세)는 학교·여가·시간제 일을 통해 자기와 직업을 탐색하며 잠정기-전환기-시행기를 거친다. 청소년 진로상담이 집중되는 시기다."},{"id":"cr-005","topic":"Super","q":"Super가 제시한 '생애진로무지개(life-career rainbow)'가 강조하는 바로 가장 적절한 것은?","choices":["직업 선택은 아동기에 결정되어 변하지 않는다","개인은 생애에 걸쳐 여러 역할을 동시에 수행하며 그 비중이 변화한다","직업 흥미는 6가지 유형으로 분류된다","진로 선택은 유전적 요인에 의해 대부분 결정된다","직업 환경의 강화체계가 만족을 결정한다"],"answer":1,"explain":"생애무지개는 자녀, 학생, 여가인, 시민, 근로자, 가정인 등의 역할이 생애 주기에 걸쳐 중첩되고 비중이 달라짐을 시각화한 것이다. 진로를 직업에 국한하지 않고 생애 역할 전체로 확장한 개념이다."},{"id":"cr-006","topic":"Super","q":"Super가 청소년의 진로 발달 정도를 나타내기 위해 제시한 핵심 개념은?","choices":["진로자기효능감","진로성숙도","진로적응도","직업정체감","진로장벽"],"answer":1,"explain":"진로성숙도(career maturity)는 같은 연령대에서 기대되는 진로발달 과업을 얼마나 잘 수행하고 있는지를 나타낸다. 진로적응도(career adaptability)는 Savickas가 성인기까지 확장하며 제안한 개념이다."},{"id":"cr-007","topic":"Ginzberg","q":"Ginzberg의 진로발달단계에서 '잠정기'의 하위단계에 해당하지 않는 것은?","choices":["흥미단계","능력단계","가치단계","전환단계","구체화단계"],"answer":4,"explain":"잠정기(11~17세)의 하위단계는 흥미-능력-가치-전환이다. 구체화(specification)와 특수화는 현실기(17세 이후)의 하위단계로 탐색-구체화-특수화 순으로 진행된다."},{"id":"cr-008","topic":"Gottfredson","q":"Gottfredson의 이론에서 진로포부를 타협할 때 일반적으로 가장 먼저 포기하는 요소는?","choices":["성유형(성역할)","직업의 명성(사회적 지위)","흥미","능력","가치"],"answer":2,"explain":"가장 늦게 발달한 요소를 가장 먼저 포기한다는 원리에 따라 흥미 → 명성 → 성유형 순으로 타협한다. 성역할에 대한 인식은 6~8세에 가장 이르게 형성되므로 마지막까지 지켜진다."},{"id":"cr-009","topic":"Gottfredson","q":"Gottfredson이 제시한 직업포부 발달 단계의 순서로 옳은 것은?","choices":["성역할 지향 → 힘과 크기 지향 → 사회적 가치 지향 → 내적 고유자아 지향","힘과 크기 지향 → 성역할 지향 → 사회적 가치 지향 → 내적 고유자아 지향","힘과 크기 지향 → 사회적 가치 지향 → 성역할 지향 → 내적 고유자아 지향","내적 고유자아 지향 → 힘과 크기 지향 → 성역할 지향 → 사회적 가치 지향","성역할 지향 → 사회적 가치 지향 → 힘과 크기 지향 → 내적 고유자아 지향"],"answer":1,"explain":"힘과 크기 지향(3~5세) → 성역할 지향(6~8세) → 사회적 가치 지향(9~13세) → 내적 고유자아 지향(14세 이후) 순이다. 각 단계에서 자기개념에 맞지 않는 직업 대안이 제거(제한)된다."},{"id":"cr-010","topic":"Krumboltz","q":"Krumboltz가 진로 결정에 영향을 미치는 요인으로 제시한 것에 해당하지 않는 것은?","choices":["유전적 요인과 특별한 능력","환경적 조건과 사건","학습 경험","과제접근기술","무의식적 갈등과 방어기제"],"answer":4,"explain":"Krumboltz의 사회학습이론은 유전적 요인·특별한 능력, 환경적 조건과 사건, 학습 경험, 과제접근기술의 네 가지를 제시한다. 무의식적 갈등은 정신분석적 진로이론의 개념이다."},{"id":"cr-011","topic":"계획된 우연","q":"Krumboltz의 '계획된 우연(planned happenstance)' 이론에서 우연한 사건을 기회로 전환하기 위해 필요한 기술이 아닌 것은?","choices":["호기심","인내심","융통성","낙관성","완벽주의"],"answer":4,"explain":"다섯 가지 기술은 호기심, 인내심, 융통성, 낙관성, 위험 감수다. 완벽주의는 오히려 우연한 기회에 대한 개방성과 시도를 억제하며 진로 우유부단과 관련된다."},{"id":"cr-012","topic":"SCCT","q":"사회인지진로이론(SCCT)의 핵심 변인 세 가지로 옳게 묶인 것은?","choices":["흥미, 적성, 가치","자기효능감, 결과기대, 개인적 목표","일치성, 일관성, 변별성","만족, 충족, 재직기간","관심, 통제, 호기심"],"answer":1,"explain":"SCCT는 Bandura의 사회인지이론에 기초해 자기효능감, 결과기대, 개인적 목표의 상호작용으로 흥미 형성-진로 선택-수행을 설명한다. ⑤는 Savickas 진로적응도의 요소다."},{"id":"cr-013","topic":"SCCT","q":"SCCT의 관점에서 다음 사례에 대한 개입으로 가장 적절한 것은?\n\n수학 성적이 상위권인 여학생이 \"공대는 제가 잘 해낼 자신이 없어요\"라며 관련 진로를 아예 고려하지 않는다.","choices":["다른 흥미 영역의 직업 목록을 제공한다","성공 경험과 대리 경험을 통해 진로 자기효능감을 높인다","직업 명성이 더 높은 대안을 제시한다","성격유형 검사를 실시하여 적합 직업을 확정한다","결정을 미루고 시간이 지나기를 기다린다"],"answer":1,"explain":"능력은 충분하나 자기효능감이 낮아 흥미와 선택으로 이어지지 못하는 전형적 사례다. SCCT는 수행 성취 경험, 대리 경험(역할모델), 사회적 설득, 정서적 각성 조절을 통해 자기효능감을 높이고 지각된 진로장벽을 다루도록 개입한다."},{"id":"cr-014","topic":"직업적응이론","q":"Dawis와 Lofquist의 직업적응이론에서 '충족(satisfactoriness)'에 해당하는 것은?","choices":["개인이 직업 환경에 대해 느끼는 주관적 만족","개인의 능력이 직업 환경의 요구를 충족시키는 정도","개인과 환경의 성격 유형이 일치하는 정도","직업 환경이 제공하는 보상의 절대적 크기","직업을 유지한 기간의 길이"],"answer":1,"explain":"만족(satisfaction)은 개인이 느끼는 주관적 만족이고, 충족(satisfactoriness)은 조직이 개인의 수행에 대해 만족하는 정도, 즉 개인이 환경의 요구를 충족시키는 정도다. 둘이 함께 유지될 때 재직 기간이 길어진다."},{"id":"cr-015","topic":"구성주의 진로이론","q":"Savickas의 진로적응도(career adaptability) 4차원에 해당하지 않는 것은?","choices":["관심(Concern)","통제(Control)","호기심(Curiosity)","자신감(Confidence)","일치성(Congruence)"],"answer":4,"explain":"진로적응도의 4C는 관심, 통제, 호기심, 자신감이다. 일치성은 Holland 이론의 개념이다."},{"id":"cr-016","topic":"의사결정","q":"Harren의 진로의사결정 유형 중 다음 설명에 해당하는 것은?\n\n\"자신의 감정과 순간적 느낌에 근거해 비교적 빠르게 결정하며, 결정에 대한 책임은 스스로 진다.\"","choices":["합리적 유형","직관적 유형","의존적 유형","회피적 유형","충동적 유형"],"answer":1,"explain":"직관적 유형은 정서적 자각과 상상에 의존해 신속히 결정하지만 결정의 책임은 자신이 진다. 의존적 유형은 타인의 기대와 조언에 따르며 책임을 외부로 돌린다."},{"id":"cr-017","topic":"진로미결정","q":"진로미결정(indecision)과 우유부단(indecisiveness)의 구분에 관한 설명으로 옳은 것은?","choices":["우유부단은 정보 부족에서 오므로 정보 제공으로 해결된다","진로미결정은 발달 과정상 자연스러울 수 있으며 탐색 활동으로 도움을 받는다","우유부단은 미결정보다 개입이 더 단순하다","두 개념은 동일한 의미로 사용된다","진로미결정은 성격적 불안에서 비롯된다"],"answer":1,"explain":"발달적 미결정은 정보와 탐색 부족에서 오는 자연스러운 상태로 진로정보 제공·체험 활동이 효과적이다. 반면 만성적 우유부단은 불안, 완벽주의, 낮은 자아정체감 등 성격적 요인이 배경이므로 심리적 개입이 함께 필요하다."},{"id":"cr-018","topic":"진로장벽","q":"진로장벽(career barrier)에 관한 설명으로 옳지 않은 것은?","choices":["진로 목표 달성을 방해한다고 지각되는 요인이다","실제 존재 여부보다 개인의 지각이 행동에 더 큰 영향을 준다","내적 장벽과 외적 장벽으로 구분할 수 있다","지각된 장벽은 상담을 통해 재평가될 수 있다","객관적으로 확인되지 않는 장벽은 상담에서 다룰 필요가 없다"],"answer":4,"explain":"장벽의 객관적 실재 여부와 무관하게 '지각된' 장벽이 진로 탐색과 선택 행동을 위축시킨다. 따라서 지각된 장벽을 탐색하고 현실 검증을 통해 재평가하도록 돕는 것이 중요한 개입이다."},{"id":"cr-019","topic":"진로검사","q":"청소년 진로상담에서 심리검사를 활용할 때의 원칙으로 옳지 않은 것은?","choices":["검사 결과는 여러 자료 중 하나로 통합하여 해석한다","검사 목적과 한계를 사전에 내담자에게 설명한다","결과를 내담자와 함께 탐색하며 의미를 구성한다","단일 검사 결과로 적합 직업을 확정해 제시한다","발달 단계상 흥미가 변할 수 있음을 함께 안내한다"],"answer":3,"explain":"청소년기는 흥미와 자아개념이 변화하는 시기이므로 단일 검사로 진로를 확정하는 것은 부적절하다. 검사는 자기이해와 탐색을 촉진하는 출발점이지 결론이 아니다."},{"id":"cr-020","topic":"진로검사","q":"다음 중 흥미검사에 해당하는 것은?","choices":["STRONG 직업흥미검사","GATB 적성검사","TCI","K-WISC-V","MMPI-A"],"answer":0,"explain":"STRONG 직업흥미검사와 Holland 기반 흥미검사가 대표적 흥미검사다. GATB는 적성검사, TCI는 기질·성격검사, K-WISC-V는 지능검사, MMPI-A는 성격·정신병리 검사다."},{"id":"cr-021","topic":"진로상담 과정","q":"청소년 진로상담의 목표로 가장 적절하지 않은 것은?","choices":["자기 이해의 증진","직업 세계에 대한 정보 탐색 능력의 향상","합리적 의사결정 능력의 함양","진로 계획의 수립과 실천 지원","상담자가 판단한 최적 직업의 결정 제공"],"answer":4,"explain":"진로상담은 결정을 대신해 주는 것이 아니라 스스로 결정할 수 있는 역량을 기르는 것이 목적이다. 상담자가 직업을 지정하는 것은 자기결정권을 침해하며 실행 동기도 떨어뜨린다."},{"id":"cr-022","topic":"진로상담 과정","q":"진로상담의 일반적 과정을 순서대로 나열한 것은?","choices":["진로 정보 제공 → 관계 형성 → 자기 이해 → 의사결정 → 실행 계획","관계 형성 및 문제 평가 → 자기 이해 → 직업세계 탐색 → 의사결정 → 실행 및 추수지도","의사결정 → 관계 형성 → 자기 이해 → 직업세계 탐색 → 실행","자기 이해 → 관계 형성 → 의사결정 → 직업세계 탐색 → 추수지도","실행 계획 → 자기 이해 → 관계 형성 → 직업세계 탐색 → 의사결정"],"answer":1,"explain":"관계 형성과 호소문제 평가로 시작해, 검사·탐색을 통한 자기 이해와 직업세계 이해를 거쳐, 대안을 비교하고 결정한 뒤, 구체적 실행 계획과 추수지도로 마무리하는 것이 일반적 흐름이다."},{"id":"cr-023","topic":"진로정보","q":"우리나라의 대표적인 공공 진로·직업 정보망을 바르게 짝지은 것은?","choices":["커리어넷 - 한국직업능력연구원, 워크넷 - 한국고용정보원","커리어넷 - 한국고용정보원, 워크넷 - 한국직업능력연구원","둘 다 여성가족부가 운영한다","둘 다 교육부가 운영한다","커리어넷은 민간 기업이 운영한다"],"answer":0,"explain":"커리어넷은 한국직업능력연구원이 운영하며 학생·청소년 대상 진로심리검사와 진로정보를 제공한다. 워크넷은 한국고용정보원이 운영하며 채용정보와 직업정보, 직업심리검사를 제공한다."},{"id":"cr-024","topic":"진로체험","q":"청소년 진로체험 활동의 교육적 의의로 가장 거리가 먼 것은?","choices":["직업 세계를 간접·직접 경험하여 현실감을 높인다","막연한 직업 이미지를 구체적 정보로 바꾼다","자신의 흥미와 적성을 실제 활동 속에서 확인한다","진로 결정에 대한 자기효능감을 높인다","체험한 직업을 최종 진로로 확정하게 한다"],"answer":4,"explain":"진로체험은 탐색의 폭을 넓히고 현실 검증을 돕는 활동이지 진로를 확정하는 절차가 아니다. 한 번의 체험으로 진로를 고정시키면 오히려 탐색을 제한한다."},{"id":"cr-025","topic":"학교 밖 청소년","q":"학교 밖 청소년의 진로상담에서 상담자가 고려해야 할 사항으로 가장 적절하지 않은 것은?","choices":["학업 중단의 배경과 현재 상황을 먼저 이해한다","학력 취득, 직업훈련 등 다양한 경로를 함께 검토한다","꿈드림 등 지역 지원 기관의 자원을 연계한다","당장의 생계 문제와 진로 계획을 함께 다룬다","학교 복귀만을 유일한 목표로 설정한다"],"answer":4,"explain":"학교 복귀는 여러 선택지 중 하나일 뿐이다. 검정고시, 직업훈련, 취업, 대안교육 등 다양한 경로를 청소년의 상황과 욕구에 맞춰 함께 검토해야 하며, 복귀만을 목표로 삼으면 상담 관계 자체가 형성되지 않는다."},{"id":"cr-026","topic":"진로이론 종합","q":"다음 설명에 해당하는 진로이론은?\n\n\"개인은 자신의 진로를 객관적 사실의 나열이 아니라 삶의 이야기로 구성하며, 상담자는 그 이야기를 함께 재구성하도록 돕는다.\"","choices":["특성-요인 이론","Holland의 인성이론","직업적응이론","구성주의 진로이론","사회학습이론"],"answer":3,"explain":"Savickas의 구성주의 진로이론(진로구성이론)은 진로를 개인이 의미를 부여해 구성하는 내러티브로 보며, 진로유형면접(Career Style Interview)과 생애설계 상담을 통해 삶의 주제를 찾아 나간다."},{"id":"cr-027","topic":"진로이론 종합","q":"진로이론과 핵심 개념의 연결이 옳지 않은 것은?","choices":["Super — 자아개념의 실현과 진로성숙도","Holland — 개인 유형과 환경의 일치성","Gottfredson — 제한과 타협","Krumboltz — 학습 경험과 계획된 우연","Ginzberg — 자기효능감과 결과기대"],"answer":4,"explain":"자기효능감과 결과기대는 사회인지진로이론(SCCT)의 핵심 개념이다. Ginzberg는 환상기-잠정기-현실기의 발달 단계로 알려져 있다."},{"id":"cr-028","topic":"진로집단상담","q":"청소년 진로집단상담의 장점으로 가장 거리가 먼 것은?","choices":["또래의 진로 고민을 들으며 보편성을 경험한다","다양한 진로 정보를 효율적으로 공유할 수 있다","또래 피드백을 통해 자기 이해를 넓힐 수 있다","제한된 시간에 여러 청소년에게 개입할 수 있다","개인의 심층적 진로 갈등을 충분히 다룰 수 있다"],"answer":4,"explain":"집단상담은 효율성과 보편성 경험, 또래 피드백에 강점이 있으나 개인의 깊은 갈등이나 가족 문제를 충분히 다루기에는 한계가 있어 필요시 개인상담을 병행한다."},{"id":"cr-029","topic":"진로발달","q":"청소년기 진로 발달의 특징으로 옳지 않은 것은?","choices":["자아정체감 형성과 진로 정체감 형성이 밀접히 관련된다","흥미와 가치가 변화하며 잠정적 선택을 반복한다","부모와 또래 등 중요한 타인의 영향을 크게 받는다","현실적 제약을 인식하며 포부를 조정하기 시작한다","이 시기에 형성된 진로 선택은 이후 변경되지 않는다"],"answer":4,"explain":"Ginzberg조차 후기에 직업 선택을 비가역적이지 않은 평생의 과정으로 수정했다. 청소년기의 선택은 잠정적이며 이후 경험에 따라 계속 재구성된다."},{"id":"cr-030","topic":"진로상담 기법","q":"진로상담에서 '직업카드 분류(occupational card sort)'의 주된 목적은?","choices":["직업의 임금 수준을 비교하기 위해","내담자가 직업을 분류하는 과정에서 자신의 가치와 선호 기준을 자각하도록 돕기 위해","표준화된 규준과 비교해 적성을 진단하기 위해","직업의 미래 전망을 예측하기 위해","내담자의 지능 수준을 파악하기 위해"],"answer":1,"explain":"직업카드 분류는 '좋아하는/싫어하는/모르겠는' 등으로 카드를 나누고 그 이유를 말하게 하는 질적 평가 기법이다. 분류 준거를 언어화하는 과정에서 내담자 스스로 자신의 가치와 선택 기준을 자각하게 된다."}]},"counseling-theory":{"id":"counseling-theory","name":"청소년 상담의 이론과 실제","short":"상담이론","type":"required","order":1,"concepts":[{"title":"청소년상담의 개념과 특성","keys":["조력활동","예방·발달적 관점","다면적 개입"],"body":"청소년상담은 청소년, 청소년 관련인(부모·교사), 청소년 관련 기관을 대상으로 하는 조력활동이다. 성인상담과 달리 ① 문제해결뿐 아니라 예방·발달 촉진을 함께 지향하고 ② 개인 내적 개입에 그치지 않고 가정·학교·지역사회를 포함한 환경 개입을 병행하며 ③ 자발적 내방이 적어 비자발적 내담자를 다루는 기술이 중요하다. 매체(전화·사이버)상담, 또래상담, 찾아가는 상담(아웃리치) 등 접근 통로가 다양한 것도 특징이다."},{"title":"청소년상담의 목표 위계","keys":["궁극적 목표","과정적 목표"],"body":"궁극적 목표는 청소년의 건강한 성장과 자립이며, 이를 위한 하위 목표로 ① 문제 해결 및 증상 완화 ② 대처 능력·심리적 자원의 증진 ③ 발달과업의 성취 ④ 환경의 변화가 설정된다. 상담 초기에 세우는 구체적 목표는 내담자와 합의된 것이어야 하며 관찰·측정 가능한 형태로 진술하는 것이 원칙이다."},{"title":"정신분석 상담","keys":["무의식","전이","자유연상","방어기제"],"body":"Freud는 성격을 원초아·자아·초자아로 보고, 부적응을 무의식적 갈등과 불안에 대한 방어의 결과로 설명한다. 목표는 무의식의 의식화와 자아 기능의 강화다. 기법은 자유연상, 꿈 분석, 저항의 분석, 전이의 분석, 해석, 훈습(working through)이다. 해석은 내담자가 받아들일 준비가 된 시점에, 표면에서 심층으로, 저항을 먼저 다룬 뒤 그 아래 감정을 다루는 순서로 한다."},{"title":"개인심리학(Adler)","keys":["열등감","생활양식","사회적 관심","출생순위"],"body":"Adler는 인간을 총체적·목적론적·사회적 존재로 본다. 열등감은 병리가 아니라 성장의 동기이며, 이를 보상하려는 우월성 추구가 삶을 이끈다. 개인이 만든 고유한 신념·행동 패턴이 생활양식이고, 정신건강의 핵심 지표는 사회적 관심(공동체감)이다. 기법으로 초기 회상, 생활양식 분석, 격려, 마치 ~인 것처럼 행동하기, 수프에 침 뱉기, 단추 누르기가 있다."},{"title":"인간중심 상담(Rogers)","keys":["일치성","무조건적 긍정적 존중","공감적 이해","실현경향성"],"body":"인간은 스스로 성장할 실현경향성을 지닌 존재이며, 부적응은 가치의 조건화로 자기개념과 경험이 불일치할 때 발생한다. 상담자의 세 가지 태도 조건 — 일치성(진솔성), 무조건적 긍정적 존중, 공감적 이해 — 이 내담자에게 지각될 때 변화가 일어난다. 기법보다 관계 자체를 변화 기제로 본다."},{"title":"게슈탈트 상담(Perls)","keys":["지금-여기","알아차림","접촉경계 혼란","미해결과제"],"body":"건강한 사람은 전경과 배경을 유연하게 교체하며 욕구를 알아차리고 해소한다. 미해결과제가 쌓이면 알아차림과 접촉이 차단된다. 접촉경계 혼란에는 내사, 투사, 융합, 반전, 편향(자의식)이 있다. 기법은 빈 의자 기법, 과장하기, 신체 자각, 꿈 작업(꿈의 각 요소를 자기 일부로 동일시), 뜨거운 자리다."},{"title":"REBT와 인지치료","keys":["ABCDE","비합리적 신념","자동적 사고","인지적 오류"],"body":"Ellis의 REBT는 선행사건(A)이 아니라 신념(B)이 결과(C)를 만든다고 보고, 논박(D)을 통해 효과(E)에 이른다. 비합리적 신념의 핵심은 당위적 사고(~해야만 한다)다. Beck의 인지치료는 자동적 사고와 그 밑의 역기능적 인지도식을 다루며, 인지적 오류로 임의적 추론, 선택적 추상화, 과잉일반화, 개인화, 이분법적 사고, 의미확대·축소 등을 든다. 소크라테스식 문답과 사고기록지가 대표 기법이다."},{"title":"행동주의 상담","keys":["체계적 둔감법","토큰경제","행동조성","프리맥 원리"],"body":"부적응 행동도 학습된 것이므로 재학습으로 수정할 수 있다고 본다. 고전적 조건형성에 근거한 체계적 둔감법(이완훈련 → 불안위계 작성 → 위계에 따른 둔감화), 노출법, 홍수법이 있고, 조작적 조건형성에 근거한 강화·소거·행동조성(조형)·토큰경제·타임아웃·프리맥 원리가 있다. 사회학습이론에 근거한 모델링(대리학습)과 자기주장훈련도 포함된다."},{"title":"현실치료(Glasser)","keys":["선택이론","5가지 기본욕구","WDEP","3R"],"body":"인간은 생존·사랑과 소속·힘(성취)·자유·즐거움의 다섯 기본 욕구를 충족하려 전행동(활동하기·생각하기·느끼기·생리반응)을 선택한다. 상담은 책임(Responsibility)·현실(Reality)·옳고 그름(Right and wrong)을 다루며, 과거와 증상보다 현재의 선택에 초점을 둔다. WDEP: 바람(Want) 탐색 → 현재 행동(Doing) 확인 → 자기평가(Evaluation) → 계획(Plan) 수립. 계획은 SAMIC³(단순·달성가능·측정가능·즉시·통제가능 등) 조건을 갖춰야 한다."},{"title":"해결중심 단기상담","keys":["예외질문","기적질문","척도질문","대처질문"],"body":"문제의 원인 규명보다 이미 작동하는 해결책과 예외 상황을 확대하는 데 초점을 둔다. 원칙: 문제가 없으면 건드리지 않는다, 효과가 있으면 더 하라, 효과가 없으면 다르게 하라. 질문 기법은 예외질문, 기적질문, 척도질문, 대처질문, 관계성 질문이다. 내담자 유형을 방문형·불평형·고객형으로 구분해 개입을 달리한다."},{"title":"상담의 과정과 기법","keys":["구조화","반영·명료화·직면","해석","종결"],"body":"초기에는 관계 형성, 구조화(상담의 목적·역할·시간·비밀보장 한계 안내), 문제 탐색, 목표 설정 및 사례개념화를 한다. 중기에는 탐색을 심화하고 저항을 다루며 행동 변화를 촉진한다. 종결기에는 목표 달성 평가, 이별 감정 다루기, 재발 방지 계획, 추수상담 합의를 한다. 반응 기법은 경청 → 반영 → 명료화 → 직면 → 해석 순으로 개입 수준이 깊어지며, 직면은 신뢰관계가 형성된 뒤 사용한다."},{"title":"위기개입과 자살·자해","keys":["안전 확보 우선","구체성·치명성 평가","비밀보장의 예외"],"body":"위기개입의 1순위는 안전 확보다. 자살 위험 평가는 자살 사고의 빈도·강도, 계획의 구체성, 수단의 접근성, 치명성, 과거 시도력, 보호요인을 확인한다. 자살 의도를 직접 묻는 것이 자살을 촉발한다는 통념은 근거가 없으며, 명확하고 직접적으로 묻는 것이 원칙이다. 자·타해 위험, 아동학대 의심, 법원의 명령이 있는 경우 비밀보장은 제한되며, 상담자는 이를 사전에 구조화 단계에서 고지한다."},{"title":"청소년상담 전달체계와 법","keys":["CYS-Net","한국청소년상담복지개발원","청소년기본법·복지지원법"],"body":"청소년상담사는 「청소년기본법」에 근거한 국가자격이다. 중앙에 한국청소년상담복지개발원, 시·도 및 시·군·구에 청소년상담복지센터가 있고, 위기청소년을 위한 지역사회 안전망이 CYS-Net(지역사회청소년통합지원체계)로 「청소년복지지원법」에 근거한다. 관련 시설로 청소년쉼터, 청소년자립지원관, 청소년회복지원시설, 학교밖청소년지원센터(꿈드림)가 있다."},{"title":"상담자 윤리","keys":["이중관계 금지","사전 동의","미성년자 동의","전문성의 한계"],"body":"핵심 원칙은 자율성 존중, 선의, 무해성, 공정성, 충실성이다. 상담자는 이중관계(다중관계)를 피하고, 자신의 전문성 범위를 넘는 사례는 의뢰한다. 미성년 내담자의 경우 원칙적으로 보호자의 동의를 받되, 청소년 본인의 사생활과 자기결정권도 존중해야 하며, 부모에게 제공하는 정보의 범위를 미리 합의하는 것이 바람직하다. 기록은 안전하게 보관하고 법정 기간 후 폐기한다."}],"questions":[{"id":"ct-001","topic":"청소년상담의 특성","q":"청소년상담이 성인상담과 구별되는 특성으로 가장 거리가 먼 것은?","choices":["문제 해결과 더불어 예방 및 발달 촉진을 함께 지향한다","부모, 교사 등 관련인과 환경에 대한 개입을 병행한다","비자발적으로 의뢰되는 내담자의 비율이 상대적으로 높다","전화, 사이버, 또래상담 등 접근 통로가 다양하다","내담자의 통찰과 성격 재구조화를 일차적 목표로 삼는다"],"answer":4,"explain":"청소년상담은 발달 단계상 추상적 통찰 능력이 완성되지 않은 대상이 많고 개입 기간도 제한적이어서, 성격 재구조화보다 구체적 문제 해결·대처능력 증진·발달과업 성취를 우선한다. 나머지는 모두 청소년상담의 대표적 특성이다."},{"id":"ct-002","topic":"상담 구조화","q":"상담 초기의 구조화(structuring)에 포함되는 내용으로 옳지 않은 것은?","choices":["상담의 목적과 진행 방식에 대한 설명","상담 시간, 횟수, 장소 등 물리적 조건의 안내","비밀보장의 원칙과 그 예외 상황에 대한 고지","상담자와 내담자 각각의 역할에 대한 안내","내담자의 무의식적 갈등에 대한 심층 해석의 제공"],"answer":4,"explain":"구조화는 상담이라는 작업의 틀(목적·조건·역할·비밀보장의 한계)을 합의하는 절차다. 심층 해석은 충분한 신뢰관계와 탐색이 이루어진 중기 이후의 개입이며 구조화의 내용이 아니다."},{"id":"ct-003","topic":"정신분석","q":"정신분석 상담에서 '훈습(working through)'에 관한 설명으로 옳은 것은?","choices":["내담자가 자유연상 중 떠오르는 것을 검열 없이 말하도록 하는 절차이다","통찰한 내용을 반복적으로 다루어 실제 생활의 변화로 이어지게 하는 과정이다","상담자가 내담자에게 갖는 무의식적 감정 반응을 분석하는 것이다","내담자가 상담 진행을 방해하는 행동을 보이는 현상이다","억압된 기억을 최면을 통해 회상시키는 기법이다"],"answer":1,"explain":"훈습은 해석을 통해 얻은 통찰이 일회적 깨달음에 그치지 않도록 여러 맥락에서 반복적으로 다루어 실제 행동 변화로 정착시키는 과정이다. ③은 역전이, ④는 저항에 대한 설명이다."},{"id":"ct-004","topic":"개인심리학","q":"Adler의 개인심리학에서 정신건강을 판단하는 가장 핵심적인 준거는?","choices":["무의식적 갈등의 해소 정도","자기개념과 경험 간의 일치 정도","사회적 관심(공동체감)의 발달 정도","기본 욕구의 충족 정도","비합리적 신념의 감소 정도"],"answer":2,"explain":"Adler는 사회적 관심을 정신건강의 지표로 보았다. ②는 Rogers, ④는 Glasser, ⑤는 Ellis의 관점이다."},{"id":"ct-005","topic":"개인심리학","q":"다음 사례에서 상담자가 사용한 Adler 학파의 기법은?\n\n내담자: \"저는 반장이 되면 애들이 다 저를 싫어할 거예요.\"\n상담자: \"그렇군요. 그럼 이번 주에 딱 하루만, 이미 모두에게 사랑받는 반장인 것처럼 행동해 보면 어떨까요?\"","choices":["수프에 침 뱉기","단추 누르기","마치 ~인 것처럼 행동하기","역설적 의도","초기 회상"],"answer":2,"explain":"'마치 ~인 것처럼 행동하기(acting as if)'는 내담자가 바라는 모습을 이미 갖춘 것처럼 행동해 보게 하여 생활양식의 변화를 유도하는 기법이다. '수프에 침 뱉기'는 내담자의 자기패배적 행동의 숨은 의도를 드러내 그 행동의 매력을 떨어뜨리는 기법이다."},{"id":"ct-006","topic":"인간중심","q":"Rogers가 제시한 성격 변화의 필요충분조건에 해당하지 않는 것은?","choices":["상담자가 관계 안에서 일치성을 갖추고 있다","상담자가 내담자를 무조건적으로 긍정적으로 존중한다","상담자가 내담자의 내적 준거틀을 공감적으로 이해한다","상담자의 공감과 존중이 내담자에게 어느 정도 전달된다","상담자가 내담자의 부적응 행동을 정확히 진단하고 분류한다"],"answer":4,"explain":"인간중심 상담은 진단과 분류를 중시하지 않으며 오히려 진단적 태도가 관계를 해칠 수 있다고 본다. 태도 조건이 내담자에게 '지각되어야' 한다는 점(④)은 필요조건에 포함된다."},{"id":"ct-007","topic":"게슈탈트","q":"게슈탈트 상담의 접촉경계 혼란 중 '반전(retroflection)'에 해당하는 것은?","choices":["타인의 가치관을 검토 없이 그대로 받아들인다","자신의 욕구나 감정을 타인의 것으로 돌린다","타인에게 하고 싶은 행동을 자기 자신에게 한다","자신과 타인의 경계가 흐려져 구분하지 못한다","환경과의 접촉을 흐릿하게 하여 자극을 둔화시킨다"],"answer":2,"explain":"반전은 타인에게 향해야 할 행동이나 감정을 자신에게 돌리는 것이다(예: 화가 나면 자기 몸을 때림). ①은 내사, ②는 투사, ④는 융합, ⑤는 편향이다."},{"id":"ct-008","topic":"REBT","q":"Ellis의 REBT에서 비합리적 신념의 가장 핵심적인 특징은?","choices":["과거 경험에 근거한다는 점","당위적·절대적 요구의 형태를 띤다는 점","무의식에 억압되어 있다는 점","타인과의 관계에서만 나타난다는 점","정서보다 행동에 먼저 영향을 준다는 점"],"answer":1,"explain":"Ellis는 비합리적 신념의 핵심을 '반드시 ~해야만 한다(must, should)'는 당위적 요구로 보았고, 여기서 파국화, 좌절에 대한 낮은 인내, 자기·타인 비하가 파생된다고 설명했다."},{"id":"ct-009","topic":"인지치료","q":"다음 진술에 나타난 Beck의 인지적 오류는?\n\n\"수행평가에서 한 문제를 틀렸어요. 저는 결국 아무것도 제대로 못 하는 사람이에요.\"","choices":["임의적 추론","선택적 추상화","과잉일반화","개인화","의미 축소"],"answer":2,"explain":"하나의 사건(한 문제 오답)에서 전반적이고 극단적인 결론(아무것도 못 함)을 끌어내는 것은 과잉일반화다. 선택적 추상화는 전체 맥락 중 부정적 세부에만 주목하는 것, 임의적 추론은 근거 없이 결론을 내리는 것이다."},{"id":"ct-010","topic":"행동주의","q":"체계적 둔감법(systematic desensitization)의 절차를 순서대로 바르게 나열한 것은?","choices":["불안위계 작성 → 이완훈련 → 위계에 따른 둔감화","이완훈련 → 불안위계 작성 → 위계에 따른 둔감화","이완훈련 → 홍수법 적용 → 불안위계 작성","불안위계 작성 → 실제 노출 → 이완훈련","모델링 → 이완훈련 → 불안위계 작성"],"answer":1,"explain":"Wolpe의 체계적 둔감법은 ① 근육이완 훈련 ② 불안위계 목록 작성 ③ 이완 상태에서 낮은 위계부터 상상 노출하며 둔감화하는 순서로 진행된다. 상호제지(역조건형성) 원리에 근거한다."},{"id":"ct-011","topic":"행동주의","q":"프리맥 원리(Premack principle)를 적용한 예로 가장 적절한 것은?","choices":["숙제를 마치면 좋아하는 게임을 할 수 있게 한다","떠들 때마다 5분간 교실 뒤에 서 있게 한다","발표할 때마다 스티커를 주고 10개를 모으면 상품과 교환한다","목표 행동에 근접한 행동부터 단계적으로 강화한다","또래가 발표하고 칭찬받는 장면을 관찰하게 한다"],"answer":0,"explain":"프리맥 원리는 발생 빈도가 높은 선호 행동을 낮은 빈도의 비선호 행동에 대한 강화물로 사용하는 것이다. ②는 타임아웃, ③은 토큰경제, ④는 행동조성(조형), ⑤는 모델링이다."},{"id":"ct-012","topic":"현실치료","q":"현실치료의 WDEP 모형에서 'E' 단계에 해당하는 활동은?","choices":["내담자가 진정으로 원하는 것을 탐색한다","내담자가 현재 하고 있는 행동을 구체적으로 확인한다","현재 행동이 원하는 것을 얻는 데 도움이 되는지 스스로 판단하게 한다","실행 가능한 구체적 계획을 함께 수립한다","계획 실행의 결과에 대해 변명을 수용하지 않는다"],"answer":2,"explain":"E는 Evaluation, 즉 자기평가 단계다. 상담자가 평가해 주는 것이 아니라 내담자 스스로 '지금 행동이 내가 원하는 것을 얻게 해 주는가'를 판단하게 하는 것이 핵심이다."},{"id":"ct-013","topic":"현실치료","q":"Glasser의 선택이론에서 말하는 '전행동(total behavior)'의 네 요소가 아닌 것은?","choices":["활동하기","생각하기","느끼기","생리반응","기억하기"],"answer":4,"explain":"전행동은 활동하기(acting), 생각하기(thinking), 느끼기(feeling), 생리반응(physiology)의 네 요소로 구성된다. 이 중 직접 통제가 쉬운 것은 활동하기와 생각하기이므로 현실치료는 여기에 개입한다."},{"id":"ct-014","topic":"해결중심","q":"해결중심 단기상담에서 다음 질문이 해당하는 유형은?\n\n\"지금까지 그렇게 힘든 상황에서도 학교를 계속 다닐 수 있었던 힘은 무엇이었나요?\"","choices":["기적질문","예외질문","척도질문","대처질문","관계성 질문"],"answer":3,"explain":"대처질문은 어려운 상황에서도 견뎌 온 내담자의 자원과 강점에 주목하게 하는 질문이다. 예외질문은 문제가 일어나지 않았던 때를 찾는 질문, 관계성 질문은 중요한 타인의 관점에서 보게 하는 질문이다."},{"id":"ct-015","topic":"해결중심","q":"해결중심 상담에서 '불평형(complainant)' 내담자에 대한 개입으로 가장 적절한 것은?","choices":["행동 과제를 부과하여 즉시 실천하게 한다","문제와 관련된 관찰 과제를 제안한다","상담을 종결하고 다른 기관에 의뢰한다","직면을 통해 책임을 인식하게 한다","라포 형성에만 집중하고 과제를 주지 않는다"],"answer":1,"explain":"불평형은 문제는 인식하나 해결의 주체를 타인으로 보는 유형으로, 행동 과제보다 관찰 과제가 적합하다. 방문형에게는 과제 없이 관계 형성에 집중하고, 고객형에게는 행동 과제를 부과한다."},{"id":"ct-016","topic":"상담 기법","q":"상담자의 반응 중 '직면(confrontation)'의 사용 원칙으로 옳지 않은 것은?","choices":["충분한 신뢰관계가 형성된 후에 사용한다","내담자의 말과 행동 간 불일치를 다룬다","내담자가 변화할 준비와 자원이 있는지 고려한다","내담자의 인격이 아니라 구체적 행동에 초점을 둔다","상담 초기에 문제를 신속히 밝히기 위해 적극 활용한다"],"answer":4,"explain":"직면은 방어를 자극할 수 있는 강한 개입이므로 신뢰관계가 충분히 형성된 뒤, 내담자가 수용할 준비가 되었을 때 사용한다. 초기의 무분별한 직면은 조기 종결을 초래한다."},{"id":"ct-017","topic":"상담 기법","q":"다음 상담자 반응에 해당하는 기법은?\n\n내담자: \"엄마가 학원 얘기만 꺼내면 그냥 방으로 들어가 버려요. 뭐라고 해야 할지 모르겠고요.\"\n상담자: \"엄마의 기대에 답할 자신이 없어서, 대화를 피하는 것으로 그 부담을 막고 있는 것처럼 들리네요.\"","choices":["재진술","감정 반영","명료화","해석","요약"],"answer":3,"explain":"내담자가 명시적으로 표현하지 않은 행동의 의미와 동기를 상담자의 준거틀로 연결해 새로운 관점을 제시하고 있으므로 해석이다. 감정 반영은 표현된 감정을 되비추는 데 그친다."},{"id":"ct-018","topic":"상담 과정","q":"상담 종결기에 다루어야 할 과제로 가장 거리가 먼 것은?","choices":["상담 목표의 달성 정도에 대한 평가","종결에 따른 내담자의 이별 감정 다루기","재발 가능성에 대비한 대처 계획 수립","추수상담의 필요성과 방법에 대한 합의","새로운 상담 목표를 설정하고 심층 탐색 시작"],"answer":4,"explain":"종결기에는 성과를 정리하고 유지·일반화를 준비한다. 새로운 목표를 설정해 심층 탐색을 시작하는 것은 종결 과제가 아니며, 종결에 대한 내담자의 불안이 새 문제 호소로 나타나는 것은 아닌지 함께 살펴야 한다."},{"id":"ct-019","topic":"저항","q":"비자발적으로 의뢰된 청소년 내담자의 저항을 다루는 방법으로 가장 적절하지 않은 것은?","choices":["의뢰 경위와 그에 대한 불편한 감정을 먼저 다룬다","상담에 오게 된 것에 대한 내담자의 입장을 인정한다","비밀보장의 범위와 한계를 명확히 알려 준다","내담자가 원하는 것 중 상담에서 다룰 수 있는 것을 찾는다","의뢰자가 지목한 문제를 즉시 상담 목표로 확정한다"],"answer":4,"explain":"의뢰자의 문제 인식을 그대로 목표로 삼으면 내담자는 상담을 처벌로 지각해 저항이 강화된다. 내담자 자신의 관심사에서 출발해 합의된 목표로 옮겨 가는 것이 원칙이다."},{"id":"ct-020","topic":"위기개입","q":"자살 위험이 의심되는 청소년에 대한 상담자의 대응으로 옳은 것은?","choices":["자살에 대해 직접 묻는 것은 자살을 촉발하므로 언급을 피한다","자살 사고의 구체성, 계획, 수단의 접근성을 직접 확인한다","비밀보장 원칙에 따라 보호자에게 알리지 않는다","위험이 확인되면 즉시 상담을 종결하고 관계를 정리한다","죽고 싶다는 말은 관심을 끌기 위한 것이므로 반응하지 않는다"],"answer":1,"explain":"자살 위험 평가는 사고의 빈도·강도, 계획의 구체성, 수단의 접근성과 치명성, 과거 시도력, 보호요인을 직접적이고 명확하게 확인해야 한다. 자살 위험은 비밀보장의 예외 사유이므로 보호자 및 관련 기관에 알리고 연계해야 한다."},{"id":"ct-021","topic":"윤리","q":"청소년상담에서 비밀보장이 제한될 수 있는 경우에 해당하지 않는 것은?","choices":["내담자가 자신이나 타인을 해칠 명백한 위험이 있는 경우","아동·청소년 학대가 의심되는 경우","법원이 상담 기록의 제출을 명령한 경우","감염성이 있고 생명을 위협하는 질병에 타인이 노출될 위험이 있는 경우","보호자가 상담 내용 전부를 알려 달라고 요구하는 경우"],"answer":4,"explain":"보호자의 요구만으로 상담 내용 전부를 공개할 수는 없다. 미성년자라도 사생활과 자기결정권을 존중해야 하며, 보호자에게 제공할 정보의 범위는 상담 초기에 내담자와 합의해 두는 것이 바람직하다."},{"id":"ct-022","topic":"윤리","q":"상담자의 이중관계(다중관계)에 관한 설명으로 옳지 않은 것은?","choices":["내담자와 상담 외의 사적 관계를 맺는 것을 말한다","객관성과 판단력을 해칠 수 있어 원칙적으로 피해야 한다","불가피한 경우 그 영향을 최소화할 조치를 취하고 기록한다","내담자와의 성적 관계는 어떤 경우에도 금지된다","소규모 지역사회에서는 이중관계가 허용되므로 별도 조치가 불필요하다"],"answer":4,"explain":"소규모 지역사회처럼 접촉이 불가피한 환경에서도 이중관계가 자동으로 허용되는 것은 아니다. 위험을 평가하고, 사전에 내담자와 논의하며, 슈퍼비전을 받고 기록으로 남기는 등의 보호 조치가 필요하다."},{"id":"ct-023","topic":"전달체계","q":"위기청소년을 위한 지역사회 통합지원체계(CYS-Net)에 관한 설명으로 옳은 것은?","choices":["「초·중등교육법」에 근거하여 학교 단위로 운영된다","「청소년복지지원법」에 근거한 지역사회 자원 연계망이다","가출청소년의 일시 보호만을 전담하는 시설이다","학교 밖 청소년의 검정고시 지원만을 목적으로 한다","중앙정부가 직접 개별 사례를 관리하는 체계이다"],"answer":1,"explain":"CYS-Net은 「청소년복지지원법」에 근거해 지자체·상담복지센터·학교·경찰·의료기관 등을 연계하여 위기청소년을 발견·보호·지원하는 지역사회 안전망이다. 일시 보호는 청소년쉼터, 학교 밖 청소년 지원은 꿈드림이 담당한다."},{"id":"ct-024","topic":"또래상담","q":"또래상담(peer counseling)의 특징으로 옳지 않은 것은?","choices":["청소년의 고민을 또래가 먼저 발견하기 쉬운 점을 활용한다","또래상담자는 훈련을 통해 기본적인 조력 기술을 익힌다","또래상담자에게도 비밀보장의 원칙과 그 한계를 교육한다","위기 사례는 또래상담자가 지도자에게 연계하도록 한다","또래상담자가 전문상담자를 대체하여 심층 개입을 수행한다"],"answer":4,"explain":"또래상담자는 발견·지지·연계의 역할을 하며 전문상담자를 대체하지 않는다. 자살, 학대, 심각한 정신건강 문제 등 위기 사례는 반드시 지도교사나 전문상담자에게 즉시 연계해야 한다."},{"id":"ct-025","topic":"사이버상담","q":"사이버상담(문자·채팅 기반)의 특성에 관한 설명으로 옳지 않은 것은?","choices":["익명성으로 인해 자기개방이 촉진될 수 있다","시간과 공간의 제약이 적어 접근성이 높다","비언어적 단서가 제한되어 오해가 발생할 수 있다","글쓰기 자체가 자기 정리의 효과를 가질 수 있다","내담자의 신원 확인이 쉬워 위기개입에 유리하다"],"answer":4,"explain":"사이버상담은 익명성 때문에 오히려 신원 확인과 위치 파악이 어려워 위기개입에 제약이 크다. 이 때문에 위기 상황에서는 대면·전화 상담이나 기관 연계로 전환하는 절차를 마련해 둔다."},{"id":"ct-026","topic":"사례개념화","q":"사례개념화(case conceptualization)에 포함되어야 할 요소로 가장 거리가 먼 것은?","choices":["호소문제와 촉발요인의 정리","문제의 발생·유지에 관여하는 요인에 대한 가설","내담자의 강점과 활용 가능한 자원","이론적 틀에 근거한 개입 전략과 목표","표준화 검사 점수의 규준집단 산출 절차"],"answer":4,"explain":"사례개념화는 내담자 문제를 이론적으로 설명하고 개입 방향을 도출하는 작업이다. 검사 결과는 자료로 활용되지만 규준 산출 절차 자체는 검사 제작의 문제이지 사례개념화의 구성 요소가 아니다."},{"id":"ct-027","topic":"부모상담","q":"청소년 내담자의 부모를 상담에 참여시킬 때 상담자의 태도로 가장 적절한 것은?","choices":["부모를 문제의 원인으로 규정하고 변화를 요구한다","청소년의 상담 내용을 상세히 전달해 협조를 얻는다","부모의 어려움을 공감하면서 협력자로 자리매김한다","부모의 요구를 상담 목표로 그대로 채택한다","부모와 청소년 중 한쪽 편을 명확히 들어 준다"],"answer":2,"explain":"부모는 비난의 대상이 아니라 변화의 협력자다. 부모의 좌절과 부담을 먼저 공감하고, 청소년과 합의한 범위 내에서만 정보를 공유하며, 중립성을 유지하는 것이 원칙이다."},{"id":"ct-028","topic":"동기강화상담","q":"동기강화상담(MI)의 기본 정신 또는 원리에 해당하지 않는 것은?","choices":["공감 표현하기","불일치감 만들기","저항과 함께 구르기","자기효능감 지지하기","논쟁을 통해 문제를 인정시키기"],"answer":4,"explain":"동기강화상담은 논쟁을 피하는 것을 원칙으로 삼는다(avoid argumentation). 직접적 논박은 저항을 강화하므로, 저항과 함께 구르며 내담자 스스로 변화 대화를 하도록 이끈다."},{"id":"ct-029","topic":"실존치료","q":"실존주의 상담에서 다루는 인간 실존의 궁극적 관심사에 해당하지 않는 것은?","choices":["죽음","자유와 책임","실존적 고립","무의미성","무조건적 긍정적 존중"],"answer":4,"explain":"Yalom은 죽음, 자유(와 그에 따른 책임), 실존적 고립, 무의미성을 인간 실존의 네 가지 궁극적 관심사로 제시했다. 무조건적 긍정적 존중은 인간중심 상담의 태도 조건이다."},{"id":"ct-030","topic":"상담이론 종합","q":"각 상담이론과 변화의 핵심 기제를 짝지은 것으로 옳지 않은 것은?","choices":["정신분석 — 무의식의 의식화와 통찰",
